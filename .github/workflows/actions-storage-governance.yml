name: Actions Storage Governance

on:
  push:
    branches:
      - "agent/actions-storage-structural-governance"
    paths:
      - ".github/workflows/actions-storage-governance.yml"
      - "config/actions-storage-policy.json"
      - "scripts/ops/audit_actions_storage.py"
      - "scripts/ops/migrate_actions_artifact_retention.py"
      - "scripts/ops/install_axignal_trusted_runner.sh"
      - "tests/ops/test_actions_storage_policy_tools.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/actions-storage-policy.json"
      - "scripts/ops/audit_actions_storage.py"
      - "scripts/ops/migrate_actions_artifact_retention.py"
      - "scripts/ops/install_axignal_trusted_runner.sh"
      - "tests/ops/test_actions_storage_policy_tools.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Artifact pages to scan; 0 means complete inventory"
        required: false
        default: "0"

permissions:
  actions: read
  contents: read

concurrency:
  group: actions-storage-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare report directory
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0755 reports

      - name: Compile governance tools
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/ops/audit_actions_storage.py \
            scripts/ops/migrate_actions_artifact_retention.py \
            tests/ops/test_actions_storage_policy_tools.py
          bash -n scripts/ops/install_axignal_trusted_runner.sh

      - name: Run governance regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/ops/test_actions_storage_policy_tools.py

      - name: Audit workflow storage policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ops/audit_actions_storage.py \
            --report-json reports/actions-storage-static-audit.json \
            --report-md reports/actions-storage-static-audit.md
          cat reports/actions-storage-static-audit.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Dry-run retention migration
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 scripts/ops/migrate_actions_artifact_retention.py \
            --report reports/actions-retention-migration.json \
            > reports/actions-retention-migration.log
          rc=$?
          set -e
          cat reports/actions-retention-migration.log
          python3 - "$rc" <<'PY'
          import json
          import pathlib
          import sys

          rc = int(sys.argv[1])
          report = json.loads(
              pathlib.Path("reports/actions-retention-migration.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n## Retention migration dry-run\n\n")
              handle.write(f"- Files requiring changes: **{report['changed_file_count']}**\n")
              handle.write(f"- Insertions: **{report['insert_count']}**\n")
              handle.write(f"- Replacements: **{report['replace_count']}**\n")
              handle.write(f"- Rejected ambiguous steps: **{report['rejected_count']}**\n")
          if rc not in {0, 3}:
              raise SystemExit(rc)
          PY

  remote-inventory:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare report directory
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0755 reports

      - name: Inventory all Actions artifacts without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ops/audit_actions_storage.py \
            --inventory-artifacts \
            --max-pages "${MAX_PAGES}" \
            --report-json reports/actions-storage-inventory.json \
            --report-md reports/actions-storage-inventory.md \
            > reports/actions-storage-inventory.log
          cat reports/actions-storage-inventory.log
          cat reports/actions-storage-inventory.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify governance remains non-destructive
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          policy = json.loads(
              pathlib.Path("config/actions-storage-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          report = json.loads(
              pathlib.Path("reports/actions-storage-inventory.json").read_text(
                  encoding="utf-8"
              )
          )
          assert policy["destructive_cleanup_enabled"] is False
          assert report["destructive_cleanup_enabled"] is False
          assert report["inventory"]["total_count"] >= 0
          print("AXIGNAL_ACTIONS_STORAGE_AUDIT_ONLY=PASS")
          PY
