name: Actions Storage Governance

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: actions-storage-governance
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'OPS: actions storage cleanup'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
    steps:
      - name: Delete heavy obsolete workflow artifacts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import os
          import threading
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          event_name = os.environ["EVENT_NAME"]
          issue_number = os.environ.get("ISSUE_NUMBER", "").strip()
          owner, repo = repository.split("/", 1)
          api_root = "https://api.github.com"

          emergency = event_name in {"issues", "workflow_dispatch"}
          cutoff = datetime.now(timezone.utc) - timedelta(hours=1 if emergency else 24)
          scan_pages = 150 if emergency else 30
          deletion_limit = 600 if emergency else 150
          protected_artifact_ids = {8906279065, 8913254281}

          protected_name_fragments = {
              "attestation",
              "canonical-contract",
              "certificate",
              "closure",
              "evidence-bundle",
              "full-migration",
              "manifest",
              "provenance",
              "restore",
              "sbom",
              "signature",
          }
          high_value_cleanup_fragments = {
              "browser",
              "coverage",
              "diagnostic",
              "e2e-audit",
              "playwright",
              "screenshot",
              "test-results",
              "trace",
              "video",
              "viewport",
          }

          def request(method: str, path: str, payload: dict[str, Any] | None = None) -> Any:
              url = path if path.startswith("http") else f"{api_root}{path}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "axignal-actions-storage-governance",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read()
                      return None if not body else json.loads(body.decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {url} failed: {exc.code} {body}") from exc

          repo_info = request("GET", f"/repos/{owner}/{repo}")
          default_branch = repo_info["default_branch"]

          protected_shas: set[str] = set()
          page = 1
          while True:
              pulls = request(
                  "GET",
                  f"/repos/{owner}/{repo}/pulls?state=open&per_page=100&page={page}",
              )
              if not pulls:
                  break
              for pull in pulls:
                  sha = pull.get("head", {}).get("sha")
                  if sha:
                      protected_shas.add(sha)
              if len(pulls) < 100:
                  break
              page += 1

          before = request("GET", f"/repos/{owner}/{repo}/actions/artifacts?per_page=1")
          artifacts_before = int(before["total_count"])

          candidates: list[dict[str, Any]] = []
          scanned = 0
          for page in range(1, scan_pages + 1):
              result = request(
                  "GET",
                  f"/repos/{owner}/{repo}/actions/artifacts?per_page=100&page={page}",
              )
              artifacts = result.get("artifacts", [])
              if not artifacts:
                  break
              scanned += len(artifacts)

              for artifact in artifacts:
                  artifact_id = int(artifact["id"])
                  if artifact_id in protected_artifact_ids or artifact.get("expired"):
                      continue

                  created_at = datetime.fromisoformat(
                      artifact["created_at"].replace("Z", "+00:00")
                  )
                  if created_at >= cutoff:
                      continue

                  run = artifact.get("workflow_run") or {}
                  if run.get("head_branch") in {None, default_branch}:
                      continue
                  if run.get("head_sha") in protected_shas:
                      continue

                  name = str(artifact.get("name") or "").lower()
                  if any(fragment in name for fragment in protected_name_fragments):
                      continue

                  size = int(artifact.get("size_in_bytes") or 0)
                  is_high_value_cleanup = any(
                      fragment in name for fragment in high_value_cleanup_fragments
                  )
                  if size < 100_000 and not is_high_value_cleanup:
                      continue

                  candidates.append(artifact)

              if len(artifacts) < 100:
                  break

          candidates.sort(
              key=lambda item: int(item.get("size_in_bytes") or 0), reverse=True
          )
          selected = candidates[:deletion_limit]

          deleted: list[dict[str, Any]] = []
          failures: list[dict[str, Any]] = []
          lock = threading.Lock()

          def delete_artifact(artifact: dict[str, Any]) -> None:
              artifact_id = int(artifact["id"])
              try:
                  request(
                      "DELETE",
                      f"/repos/{owner}/{repo}/actions/artifacts/{artifact_id}",
                  )
                  with lock:
                      deleted.append(
                          {
                              "id": artifact_id,
                              "name": artifact.get("name"),
                              "size_in_bytes": int(artifact.get("size_in_bytes") or 0),
                          }
                      )
              except RuntimeError as exc:
                  with lock:
                      failures.append({"id": artifact_id, "error": str(exc)})

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              list(executor.map(delete_artifact, selected))

          after = request("GET", f"/repos/{owner}/{repo}/actions/artifacts?per_page=1")
          artifacts_after = int(after["total_count"])
          bytes_deleted = sum(item["size_in_bytes"] for item in deleted)

          report = {
              "repository": repository,
              "mode": "emergency" if emergency else "scheduled",
              "cutoff": cutoff.isoformat(),
              "pages_scanned": scan_pages,
              "artifacts_scanned": scanned,
              "eligible_candidates": len(candidates),
              "selected": len(selected),
              "deleted_artifacts": len(deleted),
              "deleted_bytes": bytes_deleted,
              "deleted_megabytes": round(bytes_deleted / 1_000_000, 3),
              "delete_failures": failures[:20],
              "protected_open_pr_shas": sorted(protected_shas),
              "protected_artifact_ids": sorted(protected_artifact_ids),
              "artifacts_before": artifacts_before,
              "artifacts_after": artifacts_after,
              "artifact_records_removed_observed": max(0, artifacts_before - artifacts_after),
          }

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "# Actions storage governance\n\n"
              f"```json\n{json.dumps(report, indent=2, sort_keys=True)}\n```\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))

          if issue_number:
              body = (
                  "Heavy-artifact cleanup completed.\n\n"
                  f"- Artifacts scanned: **{scanned}**\n"
                  f"- Heavy obsolete artifacts deleted: **{len(deleted)}**\n"
                  f"- Bytes deleted: **{bytes_deleted:,}** "
                  f"(**{bytes_deleted / 1_000_000:.2f} MB**)\n"
                  f"- Artifact records before: **{artifacts_before}**\n"
                  f"- Artifact records after: **{artifacts_after}**\n"
                  f"- Protected canonical artifacts: `{sorted(protected_artifact_ids)}`\n"
                  f"- Delete failures: **{len(failures)}**\n"
              )
              request(
                  "POST",
                  f"/repos/{owner}/{repo}/issues/{issue_number}/comments",
                  {"body": body},
              )
              request(
                  "PATCH",
                  f"/repos/{owner}/{repo}/issues/{issue_number}",
                  {"state": "closed", "state_reason": "completed"},
              )

          if failures:
              raise SystemExit("one or more artifact deletions failed")
          PY
