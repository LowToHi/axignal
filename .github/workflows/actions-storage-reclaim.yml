name: Actions Storage Reclamation

# Execution revision: contract-aware dry-run v1
on:
  push:
    branches:
      - agent/actions-storage-reclaim
    paths:
      - .github/workflows/actions-storage-reclaim.yml
      - scripts/ops/reclaim_github_actions_storage.py
  workflow_dispatch:
    inputs:
      target_free_mib:
        description: Minimum storage to reclaim in MiB
        required: false
        default: "300"
      dry_run:
        description: Inventory and plan without deletion
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: actions-storage-reclamation
  cancel-in-progress: true

jobs:
  reclaim:
    name: Reclaim stale Actions storage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_FREE_MIB: ${{ inputs.target_free_mib || '300' }}
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
      PRESERVE_RECENT_HOURS: "24"
      REPORT_PATH: /tmp/axignal-actions-storage-report.json
    steps:
      - name: Fetch exact-head reclaimer
        shell: bash
        run: |
          set -Eeuo pipefail
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/ops/reclaim_github_actions_storage.py"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            "$url" --output /tmp/reclaim_github_actions_storage.py
          python3 -m py_compile /tmp/reclaim_github_actions_storage.py

      - name: Inventory and reclaim non-contractual storage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 /tmp/reclaim_github_actions_storage.py

      - name: Publish local summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$REPORT_PATH" ]]; then
            {
              echo '## AXIGNAL Actions storage reclamation'
              echo
              echo '```json'
              cat "$REPORT_PATH"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi
