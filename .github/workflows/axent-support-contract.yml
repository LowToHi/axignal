name: Axent Customer Support Contract

on:
  pull_request:
    paths:
      - 'apps/api/src/axignal_api/axent_*.py'
      - 'apps/api/tests/test_axent_*.py'
      - 'apps/web/app/help/**'
      - 'apps/web/app/support-admin/**'
      - 'apps/web/app/api/axent/**'
      - 'apps/web/app/api/axent-admin/**'
      - 'apps/web/components/axent/**'
      - 'apps/web/lib/axent-server.ts'
      - 'infra/postgres/14*-axent-*.sql'
      - 'infra/postgres/15*-axent-*.sql'
      - 'infra/postgres/Dockerfile'
      - 'docs/contracts/31-axent-customer-support-e2e-contract-v1.0.md'
      - 'scripts/verify_axent_support_contract.py'
      - 'scripts/verify_axent_postgres_roundtrip.py'
      - '.github/workflows/axent-support-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install API test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify executable contract
        run: python scripts/verify_axent_support_contract.py
      - name: Compile Axent modules
        run: python -m compileall -q apps/api/src/axignal_api/axent_*.py
      - name: Lint Axent modules and tests
        run: |
          ruff check \
            apps/api/src/axignal_api/axent_*.py \
            apps/api/tests/test_axent_*.py \
            scripts/verify_axent_postgres_roundtrip.py
      - name: Run focused Axent tests
        run: pytest -q apps/api/tests/test_axent_*.py
      - name: Verify no direct entitlement mutation
        run: |
          ! grep -R "UPDATE tenant_private.*entitlement\|INSERT INTO tenant_private.*entitlement" apps/api/src/axignal_api/axent_*.py
      - name: Typecheck Axent web surfaces
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @axignal/web typecheck
      - name: Start clean PostgreSQL authority
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --build postgres
          for attempt in $(seq 1 90); do
            authority_ready="$(
              docker compose exec -T postgres \
                psql -U axignal -d axignal -Atc \
                "SELECT to_regclass('tenant_private.support_conversations') IS NOT NULL" \
                2>/dev/null || true
            )"
            if [ "$authority_ready" = "t" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Execute real support round trip
        env:
          AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
        run: python scripts/verify_axent_postgres_roundtrip.py create
      - name: Restart PostgreSQL authority
        run: |
          docker compose restart postgres
          for attempt in $(seq 1 60); do
            authority_ready="$(
              docker compose exec -T postgres \
                psql -U axignal -d axignal -Atc \
                "SELECT to_regclass('tenant_private.support_conversations') IS NOT NULL" \
                2>/dev/null || true
            )"
            if [ "$authority_ready" = "t" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Verify persistence from fresh process
        env:
          AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
        run: python scripts/verify_axent_postgres_roundtrip.py verify
      - name: Backup authority and mutate source
        run: |
          docker compose exec -T postgres \
            pg_dump -U axignal -d axignal -Fc > axent-authority.dump
          docker compose exec -T postgres \
            psql -U axignal -d axignal -v ON_ERROR_STOP=1 -c \
            "UPDATE tenant_private.support_conversations SET status='OPEN', resolution_code=NULL;"
          test "$(docker compose exec -T postgres psql -U axignal -d axignal -Atc \
            "SELECT count(*) FROM tenant_private.support_conversations WHERE status='OPEN'")" -gt 0
      - name: Restore into clean database
        run: |
          docker compose exec -T postgres createdb -U axignal axignal_restore
          cat axent-authority.dump | docker compose exec -T postgres \
            pg_restore -U axignal -d axignal_restore --no-owner
      - name: Verify restored authority from fresh process
        env:
          AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal_restore
        run: |
          python scripts/verify_axent_postgres_roundtrip.py verify
          echo AXENT_BACKUP_MUTATION_RESTORE_PASS
      - name: Emit final Axent closure marker
        run: echo AXENT_CUSTOMER_SUPPORT_E2E_PASS
      - name: Destroy PostgreSQL authority
        if: always()
        run: docker compose down -v --remove-orphans
