name: CI Architecture Migration

on:
  pull_request:
    branches:
      - agent/axignal-c0-canonical-reconciliation-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/ci-architecture-migration.yml
      - scripts/ci/bootstrap/**

permissions:
  contents: write

concurrency:
  group: ci-architecture-migration-v1
  cancel-in-progress: false

jobs:
  migrate:
    name: Export verified incremental exact-head gates
    if: github.event.pull_request.head.ref == 'ci/axignal-architecture-migration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXIGNAL_MIGRATION_BASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/axignal-architecture-migration-v1
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact migration input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_MIGRATION_BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          'ruamel.yaml==0.18.16' 'PyYAML==6.0.3'

      - name: Reconstruct and verify migration generator
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/ci/bootstrap/payload-*.gz.b64 \
            | tr -d '\n' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/apply_ci_architecture_v1.py
          printf '%s  %s\n' \
            '03027197de1989d9a11407bcfdf5bb65dd9f6fdc7c389a868702f153083cf893' \
            '/tmp/apply_ci_architecture_v1.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/apply_ci_architecture_v1.py

      - name: Generate incremental CI architecture
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ci-architecture-migration.yml
          python /tmp/apply_ci_architecture_v1.py

      - name: Verify generated architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/verify_ci_architecture.py | tee ci-architecture-verification.json
          python scripts/ci/test_compute_workflow_scope.py 2>&1 | tee ci-scope-tests.txt
          python -m py_compile \
            scripts/ci/compute_workflow_scope.py \
            scripts/ci/test_compute_workflow_scope.py \
            scripts/ci/verify_ci_architecture.py

      - name: Build deterministic tree handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/ci/bootstrap scripts/ci/__pycache__
          rm -f .github/workflows/ci-architecture-migration.yml
          {
            git diff --name-only --diff-filter=ACMRT HEAD
            git ls-files --others --exclude-standard -- \
              .github/ci/workflow-scope.json \
              .github/workflows/ci-pr-core.yml \
              .github/workflows/ci-pr-runtime.yml \
              .github/workflows/ci-pr-domain.yml \
              docs/engineering/ci-architecture-v1.md \
              scripts/ci/compute_workflow_scope.py \
              scripts/ci/test_compute_workflow_scope.py \
              scripts/ci/verify_ci_architecture.py
          } | LC_ALL=C sort -u > ci-architecture-files.txt
          git diff --name-only --diff-filter=D HEAD | LC_ALL=C sort > ci-architecture-deletions.txt
          test "$(wc -l < ci-architecture-files.txt)" -eq 64
          test "$(wc -l < ci-architecture-deletions.txt)" -eq 13
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf ci-architecture-tree.tar.gz -T ci-architecture-files.txt
          {
            printf 'schema=axignal.ci-architecture-handoff.v1\n'
            printf 'base_sha=%s\n' "$AXIGNAL_MIGRATION_BASE_SHA"
            printf 'generated_file_count=%s\n' "$(wc -l < ci-architecture-files.txt)"
            printf 'deleted_file_count=%s\n' "$(wc -l < ci-architecture-deletions.txt)"
            sha256sum ci-architecture-tree.tar.gz ci-architecture-files.txt ci-architecture-deletions.txt
          } | tee ci-architecture-handoff.txt

      - name: Create unattached verified Git commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path
          from typing import Any

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base_sha = os.environ["AXIGNAL_MIGRATION_BASE_SHA"]

          def request(method: str, path: str, payload: dict[str, Any] | None = None) -> dict[str, Any]:
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              req = urllib.request.Request(
                  f"{api}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          base_commit = request("GET", f"/repos/{repo}/git/commits/{base_sha}")
          entries: list[dict[str, Any]] = []
          for path in Path("ci-architecture-files.txt").read_text(encoding="utf-8").splitlines():
              content = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              blob = request(
                  "POST",
                  f"/repos/{repo}/git/blobs",
                  {"content": content, "encoding": "base64"},
              )
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          for path in Path("ci-architecture-deletions.txt").read_text(encoding="utf-8").splitlines():
              entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})

          tree = request(
              "POST",
              f"/repos/{repo}/git/trees",
              {"base_tree": base_commit["tree"]["sha"], "tree": entries},
          )
          commit = request(
              "POST",
              f"/repos/{repo}/git/commits",
              {
                  "message": "ci: install incremental exact-head gates",
                  "tree": tree["sha"],
                  "parents": [base_sha],
              },
          )
          Path("ci-architecture-commit.txt").write_text(
              "\n".join(
                  [
                      "schema=axignal.ci-architecture-commit.v1",
                      f"base_sha={base_sha}",
                      f"tree_sha={tree['sha']}",
                      f"commit_sha={commit['sha']}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"base_sha": base_sha, "tree_sha": tree["sha"], "commit_sha": commit["sha"]}, sort_keys=True))
          PY

      - name: Upload verified architecture handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-architecture-commit-${{ env.AXIGNAL_MIGRATION_BASE_SHA }}
          path: |
            ci-architecture-commit.txt
            ci-architecture-tree.tar.gz
            ci-architecture-files.txt
            ci-architecture-deletions.txt
            ci-architecture-handoff.txt
            ci-architecture-verification.json
            ci-scope-tests.txt
          if-no-files-found: error
          retention-days: 3
