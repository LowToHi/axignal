name: CI Architecture Migration

on:
  push:
    branches:
      - ci/axignal-architecture-migration-v1
    paths:
      - .github/workflows/ci-architecture-migration.yml
      - scripts/ci/bootstrap/**

permissions:
  contents: write

concurrency:
  group: ci-architecture-migration-v1
  cancel-in-progress: false

jobs:
  migrate:
    name: Install incremental exact-head gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/axignal-architecture-migration-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install generator dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.16'

      - name: Reconstruct and verify migration generator
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/ci/bootstrap/part-*.b64 | tr -d '\n' | base64 --decode > /tmp/apply_ci_architecture_v1.py
          printf '%s  %s\n' \
            '03027197de1989d9a11407bcfdf5bb65dd9f6fdc7c389a868702f153083cf893' \
            '/tmp/apply_ci_architecture_v1.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/apply_ci_architecture_v1.py

      - name: Generate incremental CI architecture
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_ci_architecture_v1.py

      - name: Verify generated architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/verify_ci_architecture.py
          python scripts/ci/test_compute_workflow_scope.py
          python -m py_compile \
            scripts/ci/compute_workflow_scope.py \
            scripts/ci/test_compute_workflow_scope.py \
            scripts/ci/verify_ci_architecture.py

      - name: Remove migration bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/ci/bootstrap
          rm -f .github/workflows/ci-architecture-migration.yml

      - name: Commit atomic architecture migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AXIGNAL CI Architecture'
          git config user.email 'ci-architecture@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'ci: install incremental exact-head gates'
          git push origin HEAD:ci/axignal-architecture-migration-v1
