name: CI Architecture Migration

on:
  pull_request:
    branches:
      - agent/axignal-c0-canonical-reconciliation-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/ci-architecture-migration.yml
      - scripts/ci/bootstrap/**

permissions:
  contents: read

concurrency:
  group: ci-architecture-migration-v1
  cancel-in-progress: false

jobs:
  migrate:
    name: Export verified incremental exact-head gates
    if: github.event.pull_request.head.ref == 'ci/axignal-architecture-migration-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXIGNAL_MIGRATION_BASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/axignal-architecture-migration-v1
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact migration input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_MIGRATION_BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        shell: bash
        run: >-
          python -m pip install --disable-pip-version-check
          'ruamel.yaml==0.18.16' 'PyYAML==6.0.3'

      - name: Reconstruct and verify migration generator
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/ci/bootstrap/payload-*.gz.b64 \
            | tr -d '\n' \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/apply_ci_architecture_v1.py
          printf '%s  %s\n' \
            '03027197de1989d9a11407bcfdf5bb65dd9f6fdc7c389a868702f153083cf893' \
            '/tmp/apply_ci_architecture_v1.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/apply_ci_architecture_v1.py

      - name: Generate incremental CI architecture
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ci-architecture-migration.yml
          python /tmp/apply_ci_architecture_v1.py

      - name: Verify generated architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/verify_ci_architecture.py | tee ci-architecture-verification.json
          python scripts/ci/test_compute_workflow_scope.py 2>&1 | tee ci-scope-tests.txt
          python -m py_compile \
            scripts/ci/compute_workflow_scope.py \
            scripts/ci/test_compute_workflow_scope.py \
            scripts/ci/verify_ci_architecture.py

      - name: Build deterministic tree handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/ci/bootstrap
          rm -f .github/workflows/ci-architecture-migration.yml
          git diff --name-only --diff-filter=ACMRT HEAD | LC_ALL=C sort > ci-architecture-files.txt
          git diff --name-only --diff-filter=D HEAD | LC_ALL=C sort > ci-architecture-deletions.txt
          test -s ci-architecture-files.txt
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf ci-architecture-tree.tar.gz -T ci-architecture-files.txt
          {
            printf 'schema=axignal.ci-architecture-handoff.v1\n'
            printf 'base_sha=%s\n' "$AXIGNAL_MIGRATION_BASE_SHA"
            printf 'generated_file_count=%s\n' "$(wc -l < ci-architecture-files.txt)"
            printf 'deleted_file_count=%s\n' "$(wc -l < ci-architecture-deletions.txt)"
            sha256sum ci-architecture-tree.tar.gz ci-architecture-files.txt ci-architecture-deletions.txt
          } | tee ci-architecture-handoff.txt

      - name: Upload verified architecture handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-architecture-handoff-${{ env.AXIGNAL_MIGRATION_BASE_SHA }}
          path: |
            ci-architecture-tree.tar.gz
            ci-architecture-files.txt
            ci-architecture-deletions.txt
            ci-architecture-handoff.txt
            ci-architecture-verification.json
            ci-scope-tests.txt
          if-no-files-found: error
          retention-days: 3
