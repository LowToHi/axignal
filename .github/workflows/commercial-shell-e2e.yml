name: Commercial Shell E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, release/axignal-e2e-final]
    paths:
      - "apps/api/src/axignal_api/billing_*.py"
      - "apps/api/src/axignal_api/stripe_*.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_billing_*.py"
      - "apps/web/app/api/billing/**"
      - "apps/web/app/billing/**"
      - "apps/web/components/billing-bridge*"
      - "apps/web/lib/billing-server.ts"
      - "apps/web/app/page.tsx"
      - "infra/pilot/compose.billing-test.yaml"
      - "playwright.config.ts"
      - "tests/e2e/commercial-shell.spec.ts"
      - "scripts/verify_commercial_shell_e2e.py"
      - "scripts/verify_commercial_round_trip_e2e.py"
      - ".github/workflows/commercial-shell-e2e.yml"
  push:
    branches: [main, "agent/**"]
    paths:
      - "apps/api/src/axignal_api/billing_*.py"
      - "apps/api/src/axignal_api/stripe_*.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_billing_*.py"
      - "apps/web/app/api/billing/**"
      - "apps/web/app/billing/**"
      - "apps/web/components/billing-bridge*"
      - "apps/web/lib/billing-server.ts"
      - "apps/web/app/page.tsx"
      - "infra/pilot/compose.billing-test.yaml"
      - "playwright.config.ts"
      - "tests/e2e/commercial-shell.spec.ts"
      - "scripts/verify_commercial_shell_e2e.py"
      - "scripts/verify_commercial_round_trip_e2e.py"
      - ".github/workflows/commercial-shell-e2e.yml"

permissions:
  contents: read

concurrency:
  group: commercial-shell-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commercial-shell:
    name: Auth, signed lifecycle, reconciliation, isolation and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AXIGNAL_PILOT_ENV_FILE: /tmp/axignal-commercial-shell-ci.env
      AXIGNAL_PILOT_COMPOSE_FILE: infra/pilot/compose.yaml
      AXIGNAL_PILOT_COMPOSE_EDGE_FILE: infra/pilot/remote/compose.shared-traefik.yaml
      AXIGNAL_BILLING_TEST_COMPOSE_FILE: infra/pilot/compose.billing-test.yaml
      AXIGNAL_DATABASE_URL: postgresql://axignal:ci-admin-password-not-for-deployment@127.0.0.1:15432/axignal
      AXIGNAL_PLAYWRIGHT_EXTERNAL_SERVER: "true"
      AXIGNAL_PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record exact-head authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)" | tee commercial-exact-head.txt
          printf 'git_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')" | tee -a commercial-exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce focused Python lint and tests
        run: |
          set -euo pipefail
          ruff check \
            apps/api/src/axignal_api/billing_config.py \
            apps/api/src/axignal_api/billing_provider.py \
            apps/api/src/axignal_api/billing_read_routes.py \
            apps/api/src/axignal_api/billing_reconciliation_routes.py \
            apps/api/src/axignal_api/billing_repository.py \
            apps/api/src/axignal_api/billing_routes.py \
            apps/api/src/axignal_api/billing_test_routes.py \
            apps/api/src/axignal_api/stripe_gateway.py \
            apps/api/src/axignal_api/stripe_signature.py \
            apps/api/src/axignal_api/application.py \
            apps/api/tests/test_billing_provider.py \
            apps/api/tests/test_billing_reconciliation.py \
            apps/api/tests/test_billing_runtime.py \
            apps/api/tests/test_billing_test_route.py \
            scripts/verify_commercial_shell_e2e.py \
            scripts/verify_commercial_round_trip_e2e.py
          pytest \
            apps/api/tests/test_billing_provider.py \
            apps/api/tests/test_billing_reconciliation.py \
            apps/api/tests/test_billing_runtime.py \
            apps/api/tests/test_billing_test_route.py

      - name: Typecheck and build workspaces
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm build

      - name: Create synthetic CI-only commercial environment
        shell: bash
        run: |
          set -euo pipefail
          cat > "$AXIGNAL_PILOT_ENV_FILE" <<'ENV'
          AXIGNAL_BUILD_SHA=${{ github.sha }}
          AXIGNAL_PILOT_SITE_ADDRESS=:80
          AXIGNAL_PILOT_CADDY_SITE_ADDRESS=:80
          AXIGNAL_PILOT_EDGE_MODE=shared-traefik
          AXIGNAL_PILOT_BIND_ADDRESS=127.0.0.1
          AXIGNAL_PILOT_HTTP_PORT=18080
          AXIGNAL_PILOT_HTTPS_PORT=18443
          AXIGNAL_POSTGRES_DB=axignal
          AXIGNAL_POSTGRES_USER=axignal
          AXIGNAL_POSTGRES_PASSWORD=ci-admin-password-not-for-deployment
          AXIGNAL_PROPOSAL_DB_PASSWORD=ci-proposal-password-not-for-deployment
          AXIGNAL_ADMISSION_DB_PASSWORD=ci-admission-password-not-for-deployment
          AXIGNAL_HUMAN_REVIEW_DB_PASSWORD=ci-review-password-not-for-deployment
          AXIGNAL_VALIDATION_DB_PASSWORD=ci-validation-password-not-for-deployment
          AXIGNAL_VALIDATION_ANALYST_DB_PASSWORD=ci-analyst-password-not-for-deployment
          AXIGNAL_SCHEDULER_DB_PASSWORD=ci-scheduler-password-not-for-deployment
          AXIGNAL_AUTH_EMAIL=pilot@example.test
          AXIGNAL_AUTH_SUBJECT=usr_pilot_ci
          AXIGNAL_AUTH_TENANT_ID=11111111-1111-4111-8111-111111111111
          AXIGNAL_AUTH_PASSWORD_SCRYPT='scrypt$00112233445566778899aabbccddeeff$c90f8bf5f5c77a981b682204633909aba0e58fe328cb71c9c357399c5ca92ea4a088a494b462b96f17efb7360ac400648f893f36fa31d4ec996236784dcbee94'
          AXIGNAL_SESSION_SECRET=ci-session-secret-with-at-least-32-bytes
          AXIGNAL_IDENTITY_ASSERTION_SECRET=ci-identity-secret-with-at-least-32-bytes
          AXIGNAL_VALIDATION_PARTICIPANT_SALT=ci-participant-salt-with-at-least-32-bytes
          AXIGNAL_OTEL_ENABLED=false
          ENV

      - name: Validate and start isolated commercial topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" config >/dev/null
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            up --build --detach --wait
          curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute browser commercial round trip
        run: pnpm exec playwright test tests/e2e/commercial-shell.spec.ts --project=chromium-desktop

      - name: Verify persisted authority, isolation and rollback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            exec -T api python - --output-dir /tmp/axignal-commercial-artifacts \
            < scripts/verify_commercial_shell_e2e.py
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            exec -T api python - --output /tmp/axignal-commercial-artifacts/e2e-3-commercial-round-trip.json \
            < scripts/verify_commercial_round_trip_e2e.py
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            cp api:/tmp/axignal-commercial-artifacts/. artifacts/
          cp commercial-exact-head.txt artifacts/

      - name: Verify evidence sanitation and sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'sk_(live|test)_|rk_(live|test)_|whsec_|payment_method|card_number|raw_payload' artifacts; then
            echo 'Commercial evidence contains forbidden secret or payment material' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('artifacts').glob('*.json'):
              data = json.loads(path.read_text())
              assert data['status'] == 'PASS', (path, data)

          commercial = json.loads(Path('artifacts/commercial-shell-e2e.json').read_text())
          assert commercial['provider'] == 'DETERMINISTIC_TEST_PROVIDER'
          assert commercial['external_stripe_verified'] is False
          assert commercial['commercial_payment_evidence'] is False
          assert commercial['external_stripe_calls'] == 0

          round_trip = json.loads(
              Path('artifacts/e2e-3-commercial-round-trip.json').read_text()
          )
          assert round_trip['output'] == 'AX_E2E_COMMERCIAL_DETERMINISTIC_PASS'
          assert round_trip['external_stripe_verified'] is False
          assert round_trip['browser_entitlement_authority'] is False
          assert round_trip['reconciliation'] == 'DETERMINISTIC_PROVIDER_VERIFIED'
          assert 'APPLIED' in round_trip['receipt_dispositions']
          assert 'STALE' in round_trip['receipt_dispositions']
          PY
          printf '%s\n' AX_E2E_COMMERCIAL_DETERMINISTIC_PASS

      - name: Upload deterministic commercial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commercial-round-trip-deterministic-${{ github.sha }}
          path: |
            artifacts/commercial-exact-head.txt
            artifacts/commercial-shell-e2e.json
            artifacts/e2e-3-commercial-round-trip.json
            artifacts/billing-ui-state-matrix.json
            artifacts/billing-tenant-isolation.json
            artifacts/billing-rollback-residue.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" logs --no-color

      - name: Stop disposable services
        if: always()
        run: |
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" down -v
