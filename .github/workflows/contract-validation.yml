name: Contract Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml openapi-spec-validator

      - name: Validate canonical naming
        run: python scripts/validate_canonical_naming.py .

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          files = sorted(Path('schemas').glob('*.schema.json'))
          if not files:
              raise SystemExit('No JSON schemas found')
          for path in files:
              schema = json.loads(path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              print(f'PASS {path}')
          PY

      - name: Validate typed task instances
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path('schemas/task.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema)
          paths = [
              *sorted(Path('docs/tasks').glob('**/*.task.json')),
              *sorted(Path('docs/roadmap/tasks').glob('AX-F*.json')),
              *sorted(Path('docs/roadmap/tasks').glob('AX-GE2E-P*.json')),
          ]
          if not paths:
              raise SystemExit('No typed task instances found')
          task_ids: list[str] = []
          for path in paths:
              instance = json.loads(path.read_text(encoding='utf-8'))
              errors = sorted(validator.iter_errors(instance), key=lambda error: list(error.path))
              assert not errors, f"{path}: {[error.message for error in errors]}"
              task_ids.append(instance['task_id'])
              print(f'PASS {path}: {instance["task_id"]}')
          registry = json.loads(
              Path('data/programmes/global-e2e-task-registry.v1.4.json').read_text(encoding='utf-8')
          )
          for shard in registry['shards']:
              data = json.loads(Path(shard['path']).read_text(encoding='utf-8'))
              for instance in data['tasks']:
                  errors = sorted(validator.iter_errors(instance), key=lambda error: list(error.path))
                  assert not errors, f"{instance['task_id']}: {[error.message for error in errors]}"
                  task_ids.append(instance['task_id'])
                  print(f'PASS global registry: {instance["task_id"]}')
          assert len(task_ids) == len(set(task_ids)), 'Duplicate typed task IDs across task locations'
          PY

      - name: Validate v1.4 global programme
        run: python scripts/verify_global_e2e_contract.py

      - name: Validate P01 research programme
        run: python scripts/verify_p01_research_program.py

      - name: Validate P02 ontology foundation
        run: python scripts/verify_p02_ontology_foundation.py

      - name: Validate P02 individual library contracts
        run: python scripts/verify_p02_library_contracts.py

      - name: Rehearse byte-exact P02 rollback at frozen P02 head
        env:
          P02_ENGINEERING_HEAD: 1800d5e7944e49cb85f52abeb9c1ce51af666d08
        run: |
          set -euo pipefail
          verification_dir="${RUNNER_TEMP}/axignal-p02-rollback"
          rm -rf "${verification_dir}"
          git worktree add --detach "${verification_dir}" "${P02_ENGINEERING_HEAD}"
          trap 'git worktree remove --force "${verification_dir}" >/dev/null 2>&1 || true' EXIT
          python "${verification_dir}/scripts/verify_p02_rollback.py"

