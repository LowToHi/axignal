name: Contract Validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml openapi-spec-validator

      - name: Validate canonical naming
        run: python scripts/validate_canonical_naming.py .

      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          files = sorted(Path('schemas').glob('*.schema.json'))
          if not files:
              raise SystemExit('No JSON schemas found')
          for path in files:
              schema = json.loads(path.read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              print(f'PASS {path}')
          PY

      - name: Validate skill registry YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('skills/registry.yaml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert data['goal_id'] == 'AXIGNAL-GOAL-001'
          assert data['canonical_brand'] == 'AXIGNAL'
          assert data['canonical_domain'] == 'axignal.com'
          ids = [item['skill_id'] for item in data['skills']]
          assert len(ids) == len(set(ids)), 'Duplicate skill IDs'
          print(f'PASS {path}: {len(ids)} skills')
          PY

      - name: Validate OpenAPI
        run: openapi-spec-validator openapi/axignal-v1.yaml
