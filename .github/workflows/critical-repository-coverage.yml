name: Critical Repository Coverage

on:
  push:
    branches:
      - "agent/axignal-rc3b-critical-repository-coverage-v1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: critical-repository-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Repository surface inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate and inventory critical repositories
        run: |
          python -m py_compile scripts/inventory_critical_repositories.py
          python scripts/inventory_critical_repositories.py | tee critical-repository-inventory.json
      - name: Upload repository inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-repository-inventory
          path: |
            critical-repository-inventory.json
            pyproject.toml
            apps/api/src/axignal_api
            apps/api/tests/test_critical_repositories_wrappers.py
            apps/api/tests/test_critical_repositories_proposal_ted.py
            apps/api/tests/test_critical_repository_cursors.py
          if-no-files-found: error
          retention-days: 1

  wrapper-contracts:
    name: Repository roles, wrappers, failures and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint repository verifiers
        run: |
          ruff check \
            scripts/inventory_critical_repositories.py \
            scripts/verify_critical_repository_coverage.py
      - name: Lint intentional private-boundary test doubles
        run: |
          ruff check --ignore B010,SIM117,F401 \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repository_cursors.py
      - name: Execute repository characterization suite
        shell: bash
        run: |
          set -o pipefail
          pytest \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repository_cursors.py \
            --cov=axignal_api.admission_repository \
            --cov=axignal_api.billing_repository \
            --cov=axignal_api.entitlement_repository \
            --cov=axignal_api.identity_repository \
            --cov=axignal_api.organic_repository \
            --cov=axignal_api.proposal_repository \
            --cov=axignal_api.retention_repository \
            --cov=axignal_api.seat_repository \
            --cov=axignal_api.ted_repository \
            --cov-report=term-missing \
            --cov-report=json:critical-repository-coverage.json \
            2>&1 | tee critical-repository-pytest.log
      - name: Enforce per-module coverage floors
        run: python scripts/verify_critical_repository_coverage.py critical-repository-coverage.json
      - name: Upload repository coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-repository-coverage
          path: |
            critical-repository-coverage.json
            critical-repository-pytest.log
          if-no-files-found: warn
          retention-days: 2
