name: Critical Repository Coverage

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/*_repository.py"
      - "apps/api/tests/test_critical_repositories*.py"
      - "scripts/inventory_critical_repositories.py"
      - "scripts/verify_critical_repository_coverage.py"
      - ".github/workflows/critical-repository-coverage.yml"
  push:
    branches:
      - "agent/axignal-rc3b-critical-repository-coverage-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-repository-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Repository surface inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Validate and inventory critical repositories
        run: |
          python -m py_compile scripts/inventory_critical_repositories.py
          python scripts/inventory_critical_repositories.py | tee critical-repository-inventory.json
      - name: Upload repository inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-repository-inventory
          path: critical-repository-inventory.json
          if-no-files-found: error
          retention-days: 14
