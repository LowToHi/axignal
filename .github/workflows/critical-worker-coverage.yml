name: Critical Worker Coverage

on:
  push:
    branches:
      - "agent/axignal-rc3a-critical-worker-coverage-v1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: critical-worker-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-contracts:
    name: Worker state machines, entrypoints and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install frozen project contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint changed runtime and tests
        run: |
          ruff check \
            apps/api/src/axignal_api/runtime_invariants.py \
            apps/api/src/axignal_api/worker.py \
            apps/api/src/axignal_api/retention_worker.py \
            apps/api/src/axignal_api/proposal_publisher.py \
            apps/api/src/axignal_api/proposal_worker.py \
            apps/api/src/axignal_api/admission_runtime.py \
            apps/api/src/axignal_api/scheduler_service.py \
            apps/api/tests/test_critical_worker_state_machines.py \
            apps/api/tests/test_critical_worker_entrypoints.py \
            scripts/verify_critical_worker_coverage.py
      - name: Execute worker characterization suite
        run: |
          pytest \
            apps/api/tests/test_critical_worker_state_machines.py \
            apps/api/tests/test_critical_worker_entrypoints.py \
            --cov=axignal_api.runtime_invariants \
            --cov=axignal_api.worker \
            --cov=axignal_api.retention_worker \
            --cov=axignal_api.proposal_publisher \
            --cov=axignal_api.proposal_worker \
            --cov=axignal_api.admission_runtime \
            --cov=axignal_api.scheduler_service \
            --cov-report=term-missing \
            --cov-report=json:critical-worker-coverage.json
      - name: Enforce per-module coverage floors
        run: python scripts/verify_critical_worker_coverage.py critical-worker-coverage.json
      - name: Prove invariants remain active under optimized Python
        run: |
          python -O - <<'PY'
          from axignal_api.runtime_invariants import (
              RuntimeConfigurationInvariantError,
              require_runtime_value,
          )

          try:
              require_runtime_value(None, name="OPTIMIZED_RUNTIME_TEST")
          except RuntimeConfigurationInvariantError:
              pass
          else:
              raise SystemExit("runtime invariant disappeared under python -O")
          PY
      - name: Upload worker coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-worker-coverage
          path: critical-worker-coverage.json
          if-no-files-found: warn
          retention-days: 2
