name: DeepSeek V4 Flash 0731 Proposal Adapter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - "apps/api/src/axignal_api/deepseek_proposals.py"
      - "apps/api/src/axignal_api/proposal_worker.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/tests/test_deepseek_v4_flash_proposals.py"
      - "scripts/verify_deepseek_v4_flash_preflight.py"
      - ".github/workflows/deepseek-v4-flash-proposal.yml"

  workflow_call:
permissions:
  contents: read

concurrency:
  group: deepseek-v4-flash-0731-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)" | tee exact-head.txt
          printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" | tee -a exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install frozen development graph
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Enforce focused lint
        run: |
          ruff check \
            apps/api/src/axignal_api/deepseek_proposals.py \
            apps/api/src/axignal_api/proposal_worker.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/tests/test_deepseek_v4_flash_proposals.py \
            scripts/verify_deepseek_v4_flash_preflight.py

      - name: Run proposal authority tests
        run: pytest apps/api/tests/test_deepseek_v4_flash_proposals.py

      - name: Verify secret remains untracked
        shell: bash
        run: |
          test "$(grep '^DEEPSEEK_API_KEY=' .env.example)" = "DEEPSEEK_API_KEY="
          ! git grep -nE 'DEEPSEEK_API_KEY=[^[:space:]]+' -- ':!*.md' ':!.github/workflows/*'

      - name: Upload exact-head contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-v4-flash-0731-contract-${{ env.AXIGNAL_EXACT_SHA }}
          path: exact-head.txt
          if-no-files-found: error
          retention-days: 1

  authenticated-preflight:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          git rev-parse 'HEAD^{tree}'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Install minimal client dependency
        run: python -m pip install "httpx==0.28.1"

      - name: Verify credential, checkpoint and minimal JSON completion
        run: python scripts/verify_deepseek_v4_flash_preflight.py

      - name: Upload non-sensitive preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-v4-flash-0731-preflight-${{ env.AXIGNAL_EXACT_SHA }}
          path: deepseek-v4-flash-0731-preflight-evidence.json
          if-no-files-found: error
          retention-days: 1
