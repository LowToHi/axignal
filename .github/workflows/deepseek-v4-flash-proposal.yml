name: DeepSeek V4 Flash Proposal Adapter

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".env.example"
      - "apps/api/src/axignal_api/deepseek_proposals.py"
      - "apps/api/src/axignal_api/proposal_worker.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/tests/test_deepseek_v4_flash_proposals.py"
      - "scripts/verify_deepseek_v4_flash_preflight.py"
      - ".github/workflows/deepseek-v4-flash-proposal.yml"
  push:
    branches:
      - "agent/deepseek-v4-flash-proposal-v0.1"
      - main
    paths:
      - ".env.example"
      - "apps/api/src/axignal_api/deepseek_proposals.py"
      - "apps/api/src/axignal_api/proposal_worker.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/tests/test_deepseek_v4_flash_proposals.py"
      - "scripts/verify_deepseek_v4_flash_preflight.py"
      - ".github/workflows/deepseek-v4-flash-proposal.yml"

permissions:
  contents: read

concurrency:
  group: deepseek-v4-flash-proposal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install deterministic dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Enforce focused lint
        run: |
          ruff check \
            apps/api/src/axignal_api/deepseek_proposals.py \
            apps/api/src/axignal_api/proposal_worker.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/tests/test_deepseek_v4_flash_proposals.py \
            scripts/verify_deepseek_v4_flash_preflight.py
      - name: Run proposal authority tests
        run: pytest apps/api/tests/test_deepseek_v4_flash_proposals.py
      - name: Verify secret remains untracked
        shell: bash
        run: |
          test "$(grep '^DEEPSEEK_API_KEY=' .env.example)" = "DEEPSEEK_API_KEY="
          ! git grep -nE 'DEEPSEEK_API_KEY=[^[:space:]]+' -- ':!*.md' ':!.github/workflows/*'

  authenticated-preflight:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install minimal client dependency
        run: python -m pip install "httpx>=0.28,<1"
      - name: Verify credential, model and minimal JSON completion
        run: python scripts/verify_deepseek_v4_flash_preflight.py
      - name: Upload non-sensitive preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepseek-v4-flash-preflight-${{ github.sha }}
          path: deepseek-v4-flash-preflight-evidence.json
          if-no-files-found: error
          retention-days: 30
