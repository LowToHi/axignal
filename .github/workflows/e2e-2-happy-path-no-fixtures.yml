name: E2E-2 Happy Path No Fixtures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/subscriber_workspace_*.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_subscriber_workspace_routes.py"
      - "apps/web/app/api/subscriber-workspace/live/**"
      - "apps/web/components/subscriber/subscriber-entry.tsx"
      - "apps/web/components/subscriber/subscriber-live-workspace*"
      - "apps/web/lib/subscriber-live-*"
      - "infra/postgres/140-subscriber-workspace-live.sql"
      - "infra/postgres/Dockerfile"
      - "infra/pilot/compose.yaml"
      - "infra/pilot/compose.billing-test.yaml"
      - "tests/e2e/subscriber-live-happy-path.spec.ts"
      - "tests/e2e/commercial-shell.spec.ts"
      - "scripts/verify_e2e_2_*.py"
      - "data/programmes/e2e-2-happy-path-no-fixtures.v1.json"
      - "docs/acceptance/AXIGNAL-E2E-2-happy-path-no-fixtures.md"
      - ".github/workflows/e2e-2-happy-path-no-fixtures.yml"
  push:
    branches:
      - "agent/e2e-2-happy-path-no-fixtures"
    paths:
      - "apps/api/src/axignal_api/subscriber_workspace_*.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_subscriber_workspace_routes.py"
      - "apps/web/app/api/subscriber-workspace/live/**"
      - "apps/web/components/subscriber/subscriber-entry.tsx"
      - "apps/web/components/subscriber/subscriber-live-workspace*"
      - "apps/web/lib/subscriber-live-*"
      - "infra/postgres/140-subscriber-workspace-live.sql"
      - "infra/postgres/Dockerfile"
      - "infra/pilot/compose.yaml"
      - "infra/pilot/compose.billing-test.yaml"
      - "tests/e2e/subscriber-live-happy-path.spec.ts"
      - "tests/e2e/commercial-shell.spec.ts"
      - "scripts/verify_e2e_2_*.py"
      - "data/programmes/e2e-2-happy-path-no-fixtures.v1.json"
      - "docs/acceptance/AXIGNAL-E2E-2-happy-path-no-fixtures.md"
      - ".github/workflows/e2e-2-happy-path-no-fixtures.yml"

permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: e2e-2-no-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-fixture-happy-path:
    name: Passkey, entitlement, TED, workspace, document and export
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      AXIGNAL_PILOT_ENV_FILE: /tmp/axignal-e2e-2-ci.env
      AXIGNAL_PILOT_COMPOSE_FILE: infra/pilot/compose.yaml
      AXIGNAL_PILOT_COMPOSE_EDGE_FILE: infra/pilot/remote/compose.shared-traefik.yaml
      AXIGNAL_BILLING_TEST_COMPOSE_FILE: infra/pilot/compose.billing-test.yaml
      AXIGNAL_DATABASE_URL: postgresql://axignal:ci-admin-password-not-for-deployment@127.0.0.1:15432/axignal
      AXIGNAL_PLAYWRIGHT_EXTERNAL_SERVER: "true"
      AXIGNAL_PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          git merge-base --is-ancestor 9bbc60b9cfd46f52eef544eb8f91f4d5ddf21878 "$actual_sha"
          mkdir -p artifacts
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
            printf 'e2e_1_parent=%s\n' 9bbc60b9cfd46f52eef544eb8f91f4d5ddf21878
          } | tee artifacts/exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Install frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate fail-closed phase contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_e2e_2_contract.py \
            | tee artifacts/static-contract.json

      - name: Enforce focused Python quality and authority tests
        run: |
          ruff check \
            apps/api/src/axignal_api/subscriber_workspace_repository.py \
            apps/api/src/axignal_api/subscriber_workspace_routes.py \
            apps/api/src/axignal_api/application.py \
            apps/api/tests/test_subscriber_workspace_routes.py \
            scripts/verify_e2e_2_contract.py \
            scripts/verify_e2e_2_persistence.py
          pytest apps/api/tests/test_subscriber_workspace_routes.py

      - name: Typecheck, test and build production workspaces
        run: |
          pnpm typecheck
          pnpm test
          AXIGNAL_BUILD_SHA="$AXIGNAL_EXACT_SHA" pnpm build

      - name: Create isolated governed environment
        shell: bash
        run: |
          cat > "$AXIGNAL_PILOT_ENV_FILE" <<'ENV'
          AXIGNAL_BUILD_SHA=${{ env.AXIGNAL_EXACT_SHA }}
          AXIGNAL_PILOT_SITE_ADDRESS=:80
          AXIGNAL_PILOT_CADDY_SITE_ADDRESS=:80
          AXIGNAL_PILOT_EDGE_MODE=shared-traefik
          AXIGNAL_PILOT_BIND_ADDRESS=127.0.0.1
          AXIGNAL_PILOT_HTTP_PORT=18080
          AXIGNAL_PILOT_HTTPS_PORT=18443
          AXIGNAL_POSTGRES_DB=axignal
          AXIGNAL_POSTGRES_USER=axignal
          AXIGNAL_POSTGRES_PASSWORD=ci-admin-password-not-for-deployment
          AXIGNAL_PROPOSAL_DB_PASSWORD=ci-proposal-password-not-for-deployment
          AXIGNAL_ADMISSION_DB_PASSWORD=ci-admission-password-not-for-deployment
          AXIGNAL_HUMAN_REVIEW_DB_PASSWORD=ci-review-password-not-for-deployment
          AXIGNAL_VALIDATION_DB_PASSWORD=ci-validation-password-not-for-deployment
          AXIGNAL_VALIDATION_ANALYST_DB_PASSWORD=ci-analyst-password-not-for-deployment
          AXIGNAL_SCHEDULER_DB_PASSWORD=ci-scheduler-password-not-for-deployment
          AXIGNAL_AUTH_EMAIL=pilot@example.test
          AXIGNAL_AUTH_SUBJECT=usr_pilot_ci
          AXIGNAL_AUTH_TENANT_ID=11111111-1111-4111-8111-111111111111
          AXIGNAL_AUTH_PASSWORD_SCRYPT='scrypt$00112233445566778899aabbccddeeff$c90f8bf5f5c77a981b682204633909aba0e58fe328cb71c9c357399c5ca92ea4a088a494b462b96f17efb7360ac400648f893f36fa31d4ec996236784dcbee94'
          AXIGNAL_SESSION_SECRET=ci-session-secret-with-at-least-32-bytes
          AXIGNAL_IDENTITY_ASSERTION_SECRET=ci-identity-secret-with-at-least-32-bytes
          AXIGNAL_VALIDATION_PARTICIPANT_SALT=ci-participant-salt-with-at-least-32-bytes
          AXIGNAL_OTEL_ENABLED=false
          ENV

      - name: Validate and start isolated product topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" config >/dev/null
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            up --build --detach --wait
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            --profile workers up --build --detach research-worker
          curl --fail --silent http://127.0.0.1:18080/api/health \
            | tee artifacts/web-health.json

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute authenticated live subscriber lifecycle
        run: |
          pnpm exec playwright test \
            tests/e2e/subscriber-live-happy-path.spec.ts \
            --project=chromium-desktop

      - name: Independently audit PostgreSQL persistence and isolation
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_e2e_2_persistence.py \
            --dsn "$AXIGNAL_DATABASE_URL" \
            --subject usr_pilot_ci \
            | tee artifacts/e2e-2-persistence.txt
          grep -qx 'AX_E2E_HAPPY_PATH_NO_FIXTURES_PASS' \
            artifacts/e2e-2-persistence.txt

      - name: Verify evidence sanitation and exact output
        shell: bash
        run: |
          set -euo pipefail
          sensitive_pattern='sk_(live|test)_|rk_(live|test)_|whsec_|card_number|credential_public_key|session_token|recovery_code'
          if grep -R -E "$sensitive_pattern" \
            artifacts playwright-report test-results; then
            echo "Sensitive evidence pattern detected." >&2
            exit 1
          fi
          marker_count="$(
            grep -R -h -c '^AX_E2E_HAPPY_PATH_NO_FIXTURES_PASS$' artifacts \
              | awk '{s+=$1} END {print s+0}'
          )"
          test "$marker_count" = "1"
          python - <<'PY'
          import json
          from pathlib import Path

          static = json.loads(Path("artifacts/static-contract.json").read_text())
          assert static["status"] == "PASS", static
          health = json.loads(Path("artifacts/web-health.json").read_text())
          exact = Path("artifacts/exact-head.txt").read_text()
          expected_sha = exact.split("exact_head_sha=", 1)[1].splitlines()[0]
          assert health["buildSha"] == expected_sha, health
          text = Path("artifacts/e2e-2-persistence.txt").read_text()
          payload_text = text.rsplit(
              "\nAX_E2E_HAPPY_PATH_NO_FIXTURES_PASS", 1
          )[0]
          payload = json.loads(payload_text)
          assert payload["status"] == "PASS", payload
          assert payload["cross_tenant_visible_rows"] == 0, payload
          assert payload["fixture_identifiers"] == 0, payload
          assert payload["audit_append_only"] is True, payload
          assert payload["session_revocation_function"] is True, payload
          PY

      - name: Upload E2E-2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-2-happy-path-no-fixtures-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30

      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f "$AXIGNAL_PILOT_ENV_FILE" ]]; then
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
              -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" logs --no-color
          else
            echo "Topology environment was not created; no service logs exist."
          fi

      - name: Stop disposable services
        if: always()
        shell: bash
        run: |
          if [[ -f "$AXIGNAL_PILOT_ENV_FILE" ]]; then
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
              -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
              --profile workers down --volumes --remove-orphans
          else
            echo "Topology environment was not created; teardown is a no-op."
          fi
