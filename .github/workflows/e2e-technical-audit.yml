name: E2E Technical Audit

on:
  push:
    branches:
      - agent/e2e-technical-audit-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-technical-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality-security:
    name: Python quality, tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install application and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "bandit>=1.8,<2" "detect-secrets>=1.5,<2" "pip-audit>=2.9,<3"
      - name: Ruff
        run: ruff check apps/api scripts
      - name: Python tests with coverage
        run: pytest --cov=axignal_api --cov-report=term-missing --cov-report=xml:coverage-python.xml
      - name: Bandit report
        continue-on-error: true
        run: bandit -r apps/api/src scripts -x apps/api/tests -f json -o bandit-report.json
      - name: Python dependency audit
        continue-on-error: true
        run: pip-audit --format=json --output=pip-audit-report.json
      - name: Secret-pattern inventory
        run: >-
          detect-secrets scan --all-files
          --exclude-files '(^|/)(\.git|\.pytest_cache|\.ruff_cache|pnpm-lock\.yaml|.*\.lock|test-results|playwright-report|bandit-report\.json|pip-audit-report\.json|coverage-python\.xml)(/|$)'
          > detect-secrets-report.json
      - name: Upload Python audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-audit-python
          path: |
            coverage-python.xml
            bandit-report.json
            pip-audit-report.json
            detect-secrets-report.json
          if-no-files-found: warn
          retention-days: 14

  javascript-quality-security:
    name: JavaScript quality, tests, build and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Clean install
        run: pnpm install --frozen-lockfile
      - name: Formatting inventory
        id: formatting
        continue-on-error: true
        run: pnpm format:check
      - name: Workspace lint contract
        id: lint
        continue-on-error: true
        run: pnpm lint
      - name: TypeScript contract
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck
      - name: Workspace tests
        id: tests
        continue-on-error: true
        run: pnpm test
      - name: Production builds
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Production dependency audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level high --json > pnpm-audit-report.json
      - name: Enforce functional JavaScript gates
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'lint=%s\ntypecheck=%s\ntests=%s\nbuild=%s\n' \
            "$LINT_OUTCOME" "$TYPECHECK_OUTCOME" "$TEST_OUTCOME" "$BUILD_OUTCOME"
          test "$LINT_OUTCOME" = success
          test "$TYPECHECK_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
      - name: Upload JavaScript audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-audit-javascript
          path: pnpm-audit-report.json
          if-no-files-found: warn
          retention-days: 14

  repository-contracts:
    name: Repository, workflow and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile all tracked Python
        run: python -m compileall -q apps scripts
      - name: Validate Docker Compose model
        run: docker compose config --quiet
      - name: Build disposable service topology
        run: docker compose build
      - name: Start and health-check disposable topology
        run: docker compose up --detach --wait
      - name: Capture service state
        if: always()
        run: |
          docker compose ps --all > compose-ps.txt
          docker compose logs --no-color > compose-logs.txt 2>&1 || true
      - name: Verify PostgreSQL and Valkey
        run: |
          test "$(docker compose exec -T valkey valkey-cli ping)" = "PONG"
          docker compose exec -T postgres psql -U axignal -d axignal -v ON_ERROR_STOP=1 -c "SELECT 1;"
      - name: Validate cumulative contract suite
        run: python scripts/verify_global_e2e_contract.py
      - name: Upload deployment audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-audit-deployment
          path: |
            compose-ps.txt
            compose-logs.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy disposable topology
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser-e2e:
    name: Browser E2E desktop and tablet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Clean install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all Chromium viewport contracts
        run: pnpm test:e2e
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-audit-browser
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
