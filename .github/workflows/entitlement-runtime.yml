name: Entitlement Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/axignal_api/ai_scope.py"
      - "apps/api/src/axignal_api/capability_tokens.py"
      - "apps/api/src/axignal_api/entitlement_*.py"
      - "apps/api/src/axignal_api/entitlements.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_entitlement_runtime.py"
      - "config/ai-assistance-policy.v0.1.json"
      - "docs/roadmap/tasks/AX-F9-T15.json"
      - "infra/postgres/080-entitlement-token-ledger.sql"
      - "infra/postgres/081-entitlement-ledger-hardening.sql"
      - "infra/postgres/082-entitlement-expiry-sweep.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/trial_grant_fixture.py"
      - "scripts/verify_entitlement_contract.py"
      - "scripts/verify_entitlement_runtime_e2e.py"
      - "scripts/verify_entitlement_authority_e2e.py"
      - ".github/workflows/entitlement-runtime.yml"
  push:
    branches: [main, "agent/**"]
    paths:
      - "apps/api/src/axignal_api/ai_scope.py"
      - "apps/api/src/axignal_api/capability_tokens.py"
      - "apps/api/src/axignal_api/entitlement_*.py"
      - "apps/api/src/axignal_api/entitlements.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_entitlement_runtime.py"
      - "config/ai-assistance-policy.v0.1.json"
      - "docs/roadmap/tasks/AX-F9-T15.json"
      - "infra/postgres/080-entitlement-token-ledger.sql"
      - "infra/postgres/081-entitlement-ledger-hardening.sql"
      - "infra/postgres/082-entitlement-expiry-sweep.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/trial_grant_fixture.py"
      - "scripts/verify_entitlement_contract.py"
      - "scripts/verify_entitlement_runtime_e2e.py"
      - "scripts/verify_entitlement_authority_e2e.py"
      - ".github/workflows/entitlement-runtime.yml"

permissions:
  contents: read

concurrency:
  group: entitlement-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Policy, API and disabled-by-default contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install deterministic development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Enforce focused Python lint
        run: |
          ruff check \
            apps/api/src/axignal_api/ai_scope.py \
            apps/api/src/axignal_api/capability_tokens.py \
            apps/api/src/axignal_api/entitlement_config.py \
            apps/api/src/axignal_api/entitlement_repository.py \
            apps/api/src/axignal_api/entitlements.py \
            apps/api/src/axignal_api/application.py \
            apps/api/tests/test_entitlement_runtime.py \
            scripts/trial_grant_fixture.py \
            scripts/verify_entitlement_contract.py \
            scripts/verify_entitlement_runtime_e2e.py \
            scripts/verify_entitlement_authority_e2e.py
      - name: Run scope, identity and token boundary tests
        run: pytest apps/api/tests/test_entitlement_runtime.py
      - name: Verify normative contract
        run: python scripts/verify_entitlement_contract.py | tee entitlement-contract.json
      - name: Upload contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: entitlement-contract-${{ github.sha }}
          path: entitlement-contract.json
          if-no-files-found: error
          retention-days: 30

  transactional-e2e:
    name: Tenant, concurrency, exhaustion, expiry and paid no-quota E2E
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_ENTITLEMENT_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_TRIAL_RUNTIME_ENABLED: "true"
      AXIGNAL_END_USER_AI_ENABLED: "true"
      AXIGNAL_IDENTITY_ASSERTION_SECRET: ci-identity-assertion-secret-with-at-least-32-bytes
      AXIGNAL_CAPABILITY_TOKEN_SECRET: ci-capability-token-secret-with-at-least-32-bytes
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Start disposable PostgreSQL
        run: docker compose up -d --build postgres
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Execute transactional entitlement circuit
        run: python scripts/verify_entitlement_runtime_e2e.py
      - name: Verify mutation authority and concurrent idempotency
        run: python scripts/verify_entitlement_authority_e2e.py
      - name: Upload non-sensitive E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: entitlement-runtime-e2e-${{ github.sha }}
          path: |
            artifacts/entitlement-runtime-e2e.json
            artifacts/entitlement-authority-e2e.json
          if-no-files-found: error
          retention-days: 30
      - name: Dump PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Stop disposable services
        if: always()
        run: docker compose down -v
