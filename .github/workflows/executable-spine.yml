name: Executable Spine

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-ted-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/f8-ted-persistent-source-v0.1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply reviewed lint and XSD date corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          path = root / 'apps/api/src/axignal_api/procurement_persistent_types.py'
          text = path.read_text()
          text = text.replace(
              'from datetime import UTC, datetime\n',
              'from datetime import UTC, date, datetime, time, timedelta, timezone\n',
          )
          text = text.replace('    ParsedProcurementLifecycleNotice,\n', '')
          text = text.replace(
              'DATE_PATTERN = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}(?:[T ][0-9:.+\\-Z]+)?$")\n',
              'XSD_DATE_PATTERN = re.compile(\n'
              '    r"^(?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})"\n'
              '    r"(?P<timezone>Z|[+\\-][0-9]{2}:[0-9]{2})?$"\n'
              ')\n',
          )
          old = '''    if predicate in {"procurement_submission_deadline", "procurement_award_date"}:\n        text = str(value)\n        if not DATE_PATTERN.fullmatch(text):\n            raise ProcurementPersistencePolicyError("TED date or datetime is invalid")\n        return text\n'''
          new = '''    if predicate == "procurement_submission_deadline":\n        if not isinstance(value, dict) or set(value) != {"date", "time"}:\n            raise ProcurementPersistencePolicyError("TED submission deadline is malformed")\n        date_text = _normalise_xsd_date(\n            value["date"],\n            error_message="TED submission deadline date is invalid",\n        )\n        time_value = value["time"]\n        time_text: str | None = None\n        if time_value is not None:\n            time_text = str(time_value)\n            try:\n                time.fromisoformat(time_text.replace("Z", "+00:00"))\n            except ValueError as exc:\n                raise ProcurementPersistencePolicyError(\n                    "TED submission deadline time is invalid"\n                ) from exc\n        return {"date": date_text, "time": time_text}\n    if predicate == "procurement_award_date":\n        return _normalise_xsd_date(value, error_message="TED award date is invalid")\n'''
          if old not in text:
              raise SystemExit('deadline policy source block not found')
          text = text.replace(old, new)
          old = '''def observed_at(issue_date: str) -> datetime:\n    try:\n        return datetime.fromisoformat(issue_date).replace(tzinfo=UTC)\n    except ValueError as exc:\n        raise ProcurementPersistencePolicyError("TED issue date is invalid") from exc\n'''
          new = '''def _normalise_xsd_date(value: Any, *, error_message: str) -> str:\n    text = str(value)\n    match = XSD_DATE_PATTERN.fullmatch(text)\n    if match is None:\n        raise ProcurementPersistencePolicyError(error_message)\n    try:\n        date.fromisoformat(match.group("date"))\n    except ValueError as exc:\n        raise ProcurementPersistencePolicyError(error_message) from exc\n    timezone_text = match.group("timezone")\n    if timezone_text not in {None, "Z"}:\n        hours = int(timezone_text[1:3])\n        minutes = int(timezone_text[4:6])\n        if hours > 14 or minutes > 59 or (hours == 14 and minutes != 0):\n            raise ProcurementPersistencePolicyError(error_message)\n    return text\n\n\ndef observed_at(issue_date: str) -> datetime:\n    text = _normalise_xsd_date(issue_date, error_message="TED issue date is invalid")\n    match = XSD_DATE_PATTERN.fullmatch(text)\n    if match is None:  # pragma: no cover - guaranteed by _normalise_xsd_date\n        raise ProcurementPersistencePolicyError("TED issue date is invalid")\n    timezone_text = match.group("timezone")\n    zone = UTC\n    if timezone_text not in {None, "Z"}:\n        sign = 1 if timezone_text[0] == "+" else -1\n        offset = timedelta(\n            hours=int(timezone_text[1:3]),\n            minutes=int(timezone_text[4:6]),\n        )\n        zone = timezone(sign * offset)\n    return datetime.combine(\n        date.fromisoformat(match.group("date")),\n        time.min,\n        tzinfo=zone,\n    )\n'''
          if old not in text:
              raise SystemExit('observed_at source block not found')
          path.write_text(text.replace(old, new))

          path = root / 'apps/api/src/axignal_api/procurement_repository.py'
          text = path.read_text()
          text = text.replace(
              '    LIFECYCLE_PROFILE,\n    PIPELINE_VERSION,\n    POLICY_VERSION,\n    PRODUCT_PROFILE,\n    PERSISTENT_AUTO_PREDICATES,\n',
              '    LIFECYCLE_PROFILE,\n    PERSISTENT_AUTO_PREDICATES,\n    PIPELINE_VERSION,\n    POLICY_VERSION,\n    PRODUCT_PROFILE,\n',
          )
          text = text.replace(
              '                    cursor.execute(\n                        "SELECT evidence_id FROM axignal_global.evidence_objects WHERE evidence_key = %s",\n                        (claim.evidence_key,),\n                    )',
              '                    cursor.execute(\n                        "SELECT evidence_id FROM axignal_global.evidence_objects "\n                        "WHERE evidence_key = %s",\n                        (claim.evidence_key,),\n                    )',
          )
          path.write_text(text)

          path = root / 'scripts/verify_official_ted_sdk_samples.py'
          text = path.read_text()
          old = '''            if document_type == "ContractNotice" and has_element(root, "Changes"):\n                if has_element(root, "ChangedNoticeIdentifier") and has_element(\n                    root, "ReasonCode"\n                ):\n                    correction_hashes.append(digest)'''
          new = '''            if (\n                document_type == "ContractNotice"\n                and has_element(root, "Changes")\n                and has_element(root, "ChangedNoticeIdentifier")\n                and has_element(root, "ReasonCode")\n            ):\n                correction_hashes.append(digest)'''
          if old not in text:
              raise SystemExit('official sample condition block not found')
          path.write_text(text.replace(old, new))

          path = root / 'scripts/verify_ted_persistent_source.py'
          text = path.read_text()
          text = text.replace(
              '                "SELECT admission_handoff_id FROM tenant_private.research_runs WHERE research_run_id = %s",',
              '                "SELECT admission_handoff_id FROM tenant_private.research_runs "\n                "WHERE research_run_id = %s",',
          )
          text = text.replace(
              '            "SELECT package_hash FROM axignal_global.admission_handoffs WHERE admission_handoff_id = %s",',
              '            "SELECT package_hash FROM axignal_global.admission_handoffs "\n            "WHERE admission_handoff_id = %s",',
          )
          text = text.replace(
              '    admission_rollback_job = admission_queue.dequeue(timeout_seconds=1)\n    assert admission_rollback_job is not None\n',
              '    admission_rollback_job = admission_queue.dequeue(timeout_seconds=1)\n    assert admission_rollback_job is not None\n    assert admission_rollback_job.research_run_id == admission_rollback_run\n',
          )
          path.write_text(text)
          PY
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check \
            apps/api/src/axignal_api/connectors/ted_xml.py \
            apps/api/src/axignal_api/persistent_procurement_research.py \
            apps/api/src/axignal_api/procurement_admission_runtime.py \
            apps/api/src/axignal_api/procurement_persistent_types.py \
            apps/api/src/axignal_api/procurement_queue.py \
            apps/api/src/axignal_api/procurement_repository.py \
            apps/api/src/axignal_api/procurement_retrieval_runtime.py \
            apps/api/tests/test_ted_persistent_source.py \
            scripts/verify_official_ted_sdk_samples.py \
            scripts/verify_ted_persistent_contract.py \
            scripts/verify_ted_persistent_source.py
          pytest apps/api/tests/test_ted_persistent_source.py
          python -m compileall -q apps/api/src scripts
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/executable-spine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair persistent TED XSD date validation and lint'
          git push origin HEAD:agent/f8-ted-persistent-source-v0.1
