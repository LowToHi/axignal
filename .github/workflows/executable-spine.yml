name: Executable Spine

on:
  push:
    branches:
      - main
  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: executable-spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, landing and browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee executable-spine-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executable-spine-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: executable-spine-exact-head-1.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspaces
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typescript-diagnostics-${{ env.AXIGNAL_EXACT_SHA }}
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Build product and landing
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run canonical browser workflow
        run: pnpm test:e2e --project=chromium-desktop
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: FastAPI contracts, proposal authority and admission policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 2
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee executable-spine-exact-head-2.txt

      - name: Upload exact-head identity 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executable-spine-exact-head-2-${{ env.AXIGNAL_EXACT_SHA }}
          path: executable-spine-exact-head-2.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Capture Ruff diagnostics
        if: always()
        shell: bash
        run: ruff check apps/api scripts --output-format=json > ruff-report.json || true
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-diagnostics-${{ env.AXIGNAL_EXACT_SHA }}
          path: ruff-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce API lint
        run: ruff check apps/api scripts
      - name: Test API
        run: pytest --cov=axignal_api --cov-report=term-missing
      - name: Verify local document proposal boundary
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_local_document_proposal_pipeline.py 2>&1 | tee local-document-proposal-acceptance.log
      - name: Upload local proposal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-document-proposal-diagnostics-${{ env.AXIGNAL_EXACT_SHA }}
          path: local-document-proposal-acceptance.log
          if-no-files-found: error
          retention-days: 7

  services:
    name: Persistent research, authority isolation and human review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_PROPOSAL_DATABASE_URL: postgresql://axignal_proposal_worker:axignal_proposal_worker@127.0.0.1:5432/axignal
      AXIGNAL_ADMISSION_DATABASE_URL: postgresql://axignal_admission_runtime_login:axignal_admission_runtime@127.0.0.1:5432/axignal
      AXIGNAL_HUMAN_REVIEW_DATABASE_URL: postgresql://axignal_human_reviewer_login:axignal_human_reviewer@127.0.0.1:5432/axignal
      AXIGNAL_HUMAN_REVIEWER_SUBJECTS: usr_human_review_ci
      AXIGNAL_VALKEY_URL: redis://127.0.0.1:6379/0
      AXIGNAL_PERSISTENT_RESEARCH_ENABLED: "true"
      AXIGNAL_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_WORLD_BANK_FIXTURE_PATH: apps/api/tests/fixtures/world_bank_rus_inflation.json
      AXIGNAL_DOCUMENT_FIXTURE_PATH: apps/api/tests/fixtures/world_bank_rer41_document.json
      AXIGNAL_DOCUMENT_PROPOSAL_FIXTURE_PATH: apps/api/tests/fixtures/world_bank_rer41_proposal.json
      AXIGNAL_RESEARCH_QUEUE_KEY: axignal:research:queue:ci
      AXIGNAL_PROPOSAL_QUEUE_KEY: axignal:proposal:queue:ci
      AXIGNAL_ADMISSION_QUEUE_KEY: axignal:admission:queue:ci
      AXIGNAL_IDENTITY_ASSERTION_SECRET: ci-identity-assertion-secret-with-at-least-32-bytes
    steps:
      - name: Checkout exact branch head 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 3
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee executable-spine-exact-head-3.txt

      - name: Upload exact-head identity 3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: executable-spine-exact-head-3-${{ env.AXIGNAL_EXACT_SHA }}
          path: executable-spine-exact-head-3.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install API and integration dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start disposable services
        run: docker compose up --build --detach --wait
      - name: Verify database extensions
        run: |
          docker compose exec -T postgres psql -U axignal -d axignal \
            -v ON_ERROR_STOP=1 \
            -c "SELECT extname FROM pg_extension WHERE extname IN ('postgis', 'vector', 'pgcrypto') ORDER BY extname;"
          count=$(docker compose exec -T postgres psql -U axignal -d axignal \
            -Atc "SELECT count(*) FROM pg_extension WHERE extname IN ('postgis', 'vector', 'pgcrypto');")
          test "$count" = "3"
      - name: Verify Valkey
        run: test "$(docker compose exec -T valkey valkey-cli ping)" = "PONG"
      - name: Rehearse cumulative migrations and snapshot restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_cumulative_migration_rehearsal.sh 2>&1 | tee cumulative-migration-rehearsal.log
      - name: Rehearse human-review migration and snapshot restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_human_review_migration_rehearsal.sh 2>&1 | tee human-review-migration-rehearsal.log
      - name: Run authenticated persistent research acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_persistent_research_spine.py 2>&1 | tee persistent-research-acceptance.log
      - name: Run persistent proposal-worker acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_persistent_proposal_worker.py 2>&1 | tee persistent-proposal-worker-acceptance.log
      - name: Run deterministic admission-runtime acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_deterministic_admission_runtime.py 2>&1 | tee deterministic-admission-acceptance.log
      - name: Reset disposable services for human-review isolation
        run: |
          docker compose down --volumes --remove-orphans
          docker compose up --build --detach --wait
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U axignal -d axignal >/dev/null 2>&1 \
              && test "$(docker compose exec -T postgres psql -U axignal -d axignal -Atc 'SELECT 1;' 2>/dev/null)" = "1"; then
              sleep 2
              if test "$(docker compose exec -T postgres psql -U axignal -d axignal -Atc 'SELECT 1;' 2>/dev/null)" = "1"; then
                break
              fi
            fi
            if test "$attempt" = "30"; then
              docker compose logs postgres
              exit 1
            fi
            sleep 1
          done
      - name: Run bounded human-review acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_bounded_human_review.py 2>&1 | tee bounded-human-review-acceptance.log
      - name: Upload persistent, migration and review diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persistent-research-diagnostics-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            cumulative-migration-rehearsal.log
            human-review-migration-rehearsal.log
            persistent-research-acceptance.log
            persistent-proposal-worker-acceptance.log
            deterministic-admission-acceptance.log
            bounded-human-review-acceptance.log
          if-no-files-found: error
          retention-days: 7
      - name: Destroy disposable services
        if: always()
        run: docker compose down --volumes --remove-orphans
