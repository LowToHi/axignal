name: F01 Catalogue Download Diagnostic

on:
  push:
    branches:
      - "agent/ax-gate7-f01-rights-technical-baseline-authority-v1"
    paths:
      - ".github/workflows/f01-catalogue-download-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch catalogue client implementation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://op.europa.eu/o/opportal-conceptDisplay/js/conceptDisplay.js' \
            --output conceptDisplay.js
          python - <<'PY'
          from pathlib import Path
          text = Path('conceptDisplay.js').read_text(errors='replace')
          for needle in ('tabPageRenderUrl', 'tabPageId', 'tabPageName'):
              print(f'### {needle}')
              start = 0
              found = False
              while True:
                  index = text.find(needle, start)
                  if index < 0:
                      break
                  found = True
                  print(text[max(0, index - 1200):index + 2200])
                  start = index + len(needle)
              if not found:
                  print('NOT_FOUND')
          PY
