name: F1 Controlled Study Protocol

on:
  push:
    branches:
      - main
  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: f1-controlled-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-lock:
    name: Frozen protocol and reproducible analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee f1-controlled-study-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1-controlled-study-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: f1-controlled-study-exact-head-1.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install project development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint study tooling
        run: |
          ruff check \
            scripts/verify_f1_controlled_study_protocol.py \
            scripts/analyse_f1_controlled_study.py \
            scripts/export_f1_controlled_study.py \
            scripts/verify_f1_controlled_study_runtime.py
      - name: Verify frozen protocol
        run: python scripts/verify_f1_controlled_study_protocol.py | tee f1-protocol-lock.json
      - name: Verify deterministic analysis with synthetic, non-human evidence
        run: |
          python scripts/analyse_f1_controlled_study.py \
            --input tests/fixtures/f1-controlled-study-synthetic-pass.json \
            --output f1-synthetic-analysis.json \
            --expect PASS_CANDIDATE
      - name: Upload protocol evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1-controlled-study-protocol-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            f1-protocol-lock.json
            f1-synthetic-analysis.json
            studies/f1/controlled-study-v1/manifest.json
            studies/f1/controlled-study-v1/manifest.sha256
          retention-days: 1

  analyst-boundary:
    name: Analyst authority, migration and pseudonymised export
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_VALIDATION_DATABASE_URL: postgresql://axignal_validation_runtime_login:axignal_validation_runtime@127.0.0.1:5432/axignal
      AXIGNAL_VALIDATION_ANALYST_DATABASE_URL: postgresql://axignal_validation_analyst_login:axignal_validation_analyst@127.0.0.1:5432/axignal
    steps:
      - name: Checkout exact branch head 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 2
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee f1-controlled-study-exact-head-2.txt

      - name: Upload exact-head identity 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1-controlled-study-exact-head-2-${{ env.AXIGNAL_EXACT_SHA }}
          path: f1-controlled-study-exact-head-2.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install project development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start disposable services
        run: docker compose up --build --detach --wait
      - name: Capture PostgreSQL initialization logs
        if: failure()
        run: docker compose logs postgres > f1-study-postgres-init.log 2>&1 || true
      - name: Rehearse migration and pre-063 restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_f1_controlled_study_migration_rehearsal.sh 2>&1 | tee f1-study-migration.log
      - name: Verify analyst boundary and export
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_f1_controlled_study_runtime.py 2>&1 | tee f1-study-runtime.json
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1-controlled-study-runtime-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            f1-study-postgres-init.log
            f1-study-migration.log
            f1-study-runtime.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Destroy disposable services
        if: always()
        run: docker compose down --volumes --remove-orphans
