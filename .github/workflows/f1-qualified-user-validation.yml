name: F1 Qualified-User Validation

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/validation.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_validation.py"
      - "apps/web/app/validation/**"
      - "apps/web/app/api/validation/**"
      - "apps/web/components/validation-harness*"
      - "apps/web/lib/server-auth.ts"
      - "infra/postgres/060-f1-qualified-user-validation.sql"
      - "infra/postgres/061-f1-validation-answer-key-boundary.sql"
      - "infra/postgres/Dockerfile"
      - "schemas/validation-*.schema.json"
      - "scripts/verify_f1_validation_*"
      - "tests/e2e/qualified-user-validation.spec.ts"
      - ".github/workflows/f1-qualified-user-validation.yml"
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: f1-qualified-user-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Validation API, schemas and scoring contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint validation boundary
        run: |
          ruff check \
            apps/api/src/axignal_api/validation.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/src/axignal_api/application.py \
            apps/api/tests/test_validation.py \
            scripts/verify_f1_validation_harness.py
      - name: Run validation unit tests
        run: pytest apps/api/tests/test_validation.py

  persistent-boundary:
    name: PostgreSQL authority, migration and reproducible metrics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_VALIDATION_DATABASE_URL: postgresql://axignal_validation_runtime_login:axignal_validation_runtime@127.0.0.1:5432/axignal
      AXIGNAL_VALIDATION_PARTICIPANT_SALT: validation-ci-participant-salt-with-at-least-32-bytes
      AXIGNAL_VALIDATION_ENABLED: "true"
      AXIGNAL_IDENTITY_ASSERTION_SECRET: validation-ci-identity-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start disposable services
        run: docker compose up --build --detach --wait
      - name: Capture PostgreSQL initialization logs
        if: failure()
        run: docker compose logs postgres > f1-postgres-init.log 2>&1 || true
      - name: Rehearse F1 migration and snapshot restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_f1_validation_migration_rehearsal.sh 2>&1 | tee f1-migration-rehearsal.log
      - name: Run F1 validation acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_f1_validation_harness.py 2>&1 | tee f1-validation-acceptance.log
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1-validation-diagnostics
          path: |
            f1-postgres-init.log
            f1-migration-rehearsal.log
            f1-validation-acceptance.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable services
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser-comparison:
    name: AXIGNAL and control content-equivalence surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AXIGNAL_VALIDATION_UI_ENABLED: "true"
      AXIGNAL_AUTH_REQUIRED: "true"
      AXIGNAL_AUTH_EMAIL: validation@example.test
      AXIGNAL_AUTH_SUBJECT: usr_validation_ci
      AXIGNAL_AUTH_TENANT_ID: 11111111-1111-4111-8111-111111111111
      AXIGNAL_AUTH_PASSWORD_SCRYPT: scrypt$00112233445566778899aabbccddeeff$8710ff207e94d85004d7f0184b6076ed28c3a43efd23ae60c90874b783e186aab9794c68ae15201d98511e421f4698b1eafb5f6a7c746835735c93b6cb8d39c1
      AXIGNAL_SESSION_SECRET: validation-ci-session-secret-with-at-least-32-bytes
      AXIGNAL_IDENTITY_ASSERTION_SECRET: validation-ci-identity-secret-with-at-least-32-bytes
      AXIGNAL_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/qualified-user-validation.spec.ts --project=chromium-desktop
