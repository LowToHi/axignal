name: F2 Runtime Closure

on:
  push:
    branches:
      - main
  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: f2-runtime-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: F2 modules, topology and redaction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee f2-runtime-closure-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f2-runtime-closure-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: f2-runtime-closure-exact-head-1.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint F2 boundary
        shell: bash
        run: |
          set -o pipefail
          ruff check --output-format=json \
            apps/api/src/axignal_api/object_store.py \
            apps/api/src/axignal_api/scheduler.py \
            apps/api/src/axignal_api/scheduler_service.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/src/axignal_api/telemetry.py \
            apps/api/tests/test_f2_runtime.py \
            scripts/verify_f2_runtime_closure.py \
            scripts/verify_runtime_topology.py | tee f2-ruff.json
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f2-ruff-diagnostics-${{ env.AXIGNAL_EXACT_SHA }}
          path: f2-ruff.json
          if-no-files-found: error
          retention-days: 7
      - name: Run bounded unit tests
        run: pytest apps/api/tests/test_f2_runtime.py
      - name: Verify process topology
        run: python scripts/verify_runtime_topology.py
      - name: Validate compose profiles
        run: |
          docker compose config >/dev/null
          docker compose --profile runtime config >/dev/null
          docker compose --profile observability config >/dev/null

  persistent-runtime:
    name: Scheduler, object store, telemetry and migration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_SCHEDULER_DATABASE_URL: postgresql://axignal_scheduler_login:axignal_scheduler@127.0.0.1:5432/axignal
      AXIGNAL_SCHEDULER_ENABLED: "true"
      AXIGNAL_VALKEY_URL: redis://127.0.0.1:6379/0
      AXIGNAL_SCHEDULER_QUEUE_KEY: axignal:scheduler:queue:f2-ci
      AXIGNAL_OBJECT_STORE_BACKEND: local
      AXIGNAL_OBJECT_STORE_ROOT: /tmp/axignal-f2-objects
      AXIGNAL_OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: axignal-f2-ci
    steps:
      - name: Checkout exact branch head 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 2
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee f2-runtime-closure-exact-head-2.txt

      - name: Upload exact-head identity 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f2-runtime-closure-exact-head-2-${{ env.AXIGNAL_EXACT_SHA }}
          path: f2-runtime-closure-exact-head-2.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start disposable dependencies
        run: docker compose up --build --detach --wait
      - name: Rehearse migration and snapshot restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_f2_migration_rehearsal.sh 2>&1 | tee f2-migration-rehearsal.log
      - name: Run F2 persistent acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_f2_runtime_closure.py 2>&1 | tee f2-runtime-acceptance.log
      - name: Start reproducible scheduler topology
        run: docker compose --profile runtime up --build --detach --wait scheduler
      - name: Verify scheduler health
        run: docker compose --profile runtime exec -T scheduler python -m axignal_api.scheduler_service --healthcheck
      - name: Upload F2 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f2-runtime-diagnostics-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            f2-migration-rehearsal.log
            f2-runtime-acceptance.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable services
        if: always()
        run: docker compose --profile runtime down --volumes --remove-orphans
