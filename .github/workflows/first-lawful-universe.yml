name: First Lawful Universe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/sources/ted-search-api-v3.v0.1.json"
      - "data/universes/**"
      - "docs/adr/ADR-012-european-public-procurement-first-universe.md"
      - "docs/adr/README.md"
      - "docs/contracts/11-hypothesis-register.md"
      - "docs/research/first-lawful-universe-selection-v0.1.md"
      - "docs/roadmap/06-current-execution-state.md"
      - "docs/roadmap/tasks/AX-F8-*.json"
      - "docs/sources/ted-search-api-v3.md"
      - "apps/api/src/axignal_api/connectors/ted.py"
      - "apps/api/tests/fixtures/ted_search_probe.json"
      - "apps/api/tests/test_ted_connector.py"
      - "scripts/verify_first_lawful_universe.py"
      - "scripts/verify_ted_live_source.py"
      - ".github/workflows/first-lawful-universe.yml"

  workflow_call:
permissions:
  contents: read

concurrency:
  group: first-lawful-universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-connector:
    name: Validate universe decision, ontology, source and connector
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install deterministic development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" jsonschema

      - name: Enforce lint
        run: |
          ruff check \
            apps/api/src/axignal_api/connectors/ted.py \
            apps/api/tests/test_ted_connector.py \
            scripts/verify_first_lawful_universe.py \
            scripts/verify_ted_live_source.py

      - name: Validate decision and contracts
        run: python scripts/verify_first_lawful_universe.py

      - name: Test bounded connector
        run: pytest apps/api/tests/test_ted_connector.py

  live-technical-probe:
    name: Execute non-personal official TED technical probe
    needs: contract-and-connector
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install connector runtime
        run: python -m pip install --upgrade pip && python -m pip install -e "."

      - name: Retrieve bounded TED projection
        run: python scripts/verify_ted_live_source.py

      - name: Upload non-sensitive probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ted-live-source-evidence-${{ github.sha }}
          path: ted-live-source-evidence.json
          if-no-files-found: error
          retention-days: 30
