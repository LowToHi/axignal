name: Format Persistent Spine

on:
  push:
    branches:
      - agent/persistent-research-spine-v0.1

permissions:
  contents: write

concurrency:
  group: format-persistent-spine
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Ruff fixes') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/persistent-research-spine-v0.1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install exact formatter family
        run: python -m pip install 'ruff>=0.12,<1'
      - name: Apply safe lint fixes and formatting
        run: |
          ruff check apps/api scripts --fix
          ruff format apps/api scripts
          ruff check apps/api scripts
      - name: Commit deterministic formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api scripts
          git commit -m 'Apply Ruff fixes to persistent spine'
          git push origin HEAD:agent/persistent-research-spine-v0.1
