name: G4b Ruff Repair

on:
  pull_request:
    branches:
      - "release/axignal-rc3a-27cfbd6"
    paths:
      - ".github/workflows/g4b-ruff-repair.yml"
  push:
    branches:
      - "agent/axignal-rc3b-critical-repository-coverage-v1"
    paths:
      - ".github/workflows/g4b-ruff-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4b-ruff-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/axignal-rc3b-critical-repository-coverage-v1
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply deterministic Ruff repair
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.16.1"
          ruff format \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repository_cursors.py
          ruff check --fix --unsafe-fixes \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repository_cursors.py
          ruff check \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repository_cursors.py
          python -m py_compile \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repository_cursors.py
      - name: Commit repair and remove ephemeral workflow
        run: |
          rm .github/workflows/g4b-ruff-repair.yml
          git config user.name "axignal-ci"
          git config user.email "axignal-ci@users.noreply.github.com"
          git add \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repository_cursors.py \
            .github/workflows/g4b-ruff-repair.yml
          if git diff --cached --quiet; then
            echo "No repair required"
            exit 0
          fi
          git commit -m "Repair G4b repository tests with Ruff 0.16.1"
          git push origin HEAD:agent/axignal-rc3b-critical-repository-coverage-v1
