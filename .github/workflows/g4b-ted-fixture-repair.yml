name: G4b TED Fixture Repair

on:
  pull_request:
    branches:
      - "release/axignal-rc3a-27cfbd6"
    paths:
      - ".github/workflows/g4b-ted-fixture-repair.yml"
  push:
    branches:
      - "agent/axignal-rc3b-critical-repository-coverage-v1"
    paths:
      - ".github/workflows/g4b-ted-fixture-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: g4b-ted-fixture-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/axignal-rc3b-critical-repository-coverage-v1
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Patch the exact TED fixture contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/test_critical_repositories_proposal_ted.py")
          text = path.read_text(encoding="utf-8")
          old = '        retrieval_key="key",\n        request_url="https://ted.test",'
          new = '        retrieval_key="key",\n        request_hash="sha256:ted-request",\n        request_url="https://ted.test",'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one TED fixture insertion point, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Validate lint, behavior and module floors
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          ruff format --check apps/api/tests/test_critical_repositories_proposal_ted.py
          ruff check \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repository_cursors.py
          pytest \
            apps/api/tests/test_critical_repositories_wrappers.py \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            apps/api/tests/test_critical_repository_cursors.py \
            --cov=axignal_api.admission_repository \
            --cov=axignal_api.billing_repository \
            --cov=axignal_api.entitlement_repository \
            --cov=axignal_api.identity_repository \
            --cov=axignal_api.organic_repository \
            --cov=axignal_api.proposal_repository \
            --cov=axignal_api.retention_repository \
            --cov=axignal_api.seat_repository \
            --cov=axignal_api.ted_repository \
            --cov-report=json:critical-repository-coverage.json
          python scripts/verify_critical_repository_coverage.py critical-repository-coverage.json
      - name: Commit verified repair and remove this workflow
        run: |
          rm .github/workflows/g4b-ted-fixture-repair.yml
          git config user.name "axignal-ci"
          git config user.email "axignal-ci@users.noreply.github.com"
          git add \
            apps/api/tests/test_critical_repositories_proposal_ted.py \
            .github/workflows/g4b-ted-fixture-repair.yml
          git commit -m "Complete TED repository fixture contract"
          git push origin HEAD:agent/axignal-rc3b-critical-repository-coverage-v1
