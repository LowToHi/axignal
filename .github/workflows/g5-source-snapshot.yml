name: G5 Source Snapshot

on:
  pull_request:
    branches:
      - "release/axignal-rc3-ad2d3ab"
    paths:
      - ".github/workflows/g5-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inventory G5 web surface
        run: |
          find apps/web apps/landing tests -type f -print | sort > g5-source-inventory.txt
          tar -czf g5-source-snapshot.tar.gz \
            apps/web \
            apps/landing \
            tests \
            package.json \
            pnpm-workspace.yaml \
            pnpm-lock.yaml \
            tsconfig.json \
            2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g5-source-snapshot
          path: |
            g5-source-inventory.txt
            g5-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 2
