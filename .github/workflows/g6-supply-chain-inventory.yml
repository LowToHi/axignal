name: G6 Supply Chain Reproducibility

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "data/supply-chain/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "infra/**/Dockerfile*"
      - "compose.yaml"
      - "infra/**/*.yml"
      - "infra/**/*.yaml"
      - ".github/workflows/**"
      - "scripts/verify_g6_supply_chain.py"
      - "scripts/image_filesystem_manifest.py"
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: g6-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-inputs:
    name: Locks, digests, actions and topology inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install the development graph from hashes
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            .

      - name: Lint G6 verification tooling
        run: ruff check scripts/verify_g6_supply_chain.py scripts/image_filesystem_manifest.py

      - name: Verify repository-wide immutable inputs
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_g6_supply_chain.py | tee g6-supply-chain-verification.json

      - name: Reject mutable OS package resolution in release images
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            'apt-get[[:space:]]+(update|install)|apk[[:space:]]+add|dnf[[:space:]]+install|yum[[:space:]]+install' \
            infra \
            --include='Dockerfile*'; then
            echo "Release Dockerfiles must derive all packages from immutable images or hashed locks"
            exit 1
          fi

      - name: Prove clean runtime lock installation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/axignal-runtime-lock
          /tmp/axignal-runtime-lock/bin/python -m pip install --upgrade "pip==26.1.2"
          /tmp/axignal-runtime-lock/bin/python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-runtime.lock
          /tmp/axignal-runtime-lock/bin/python -m pip check
          /tmp/axignal-runtime-lock/bin/python -m pip freeze --all | sort | tee runtime-freeze.txt

      - name: Verify every locked image digest remains addressable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > locked-image-references.txt
          import json
          from pathlib import Path

          payload = json.loads(Path("data/supply-chain/image-lock.v1.json").read_text())
          for image in payload["images"]:
              print(f"{image['reference']}@{image['digest']}")
          PY
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image" >/dev/null
            printf 'PASS\t%s\n' "$image"
          done < locked-image-references.txt | tee locked-image-availability.tsv

      - name: Validate Compose rendering and release-image interpolation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config > compose-root.rendered.yaml
          AXIGNAL_LANDING_IMAGE_REPOSITORY=registry.example.invalid/axignal/landing \
          AXIGNAL_LANDING_IMAGE_TAG="${GITHUB_SHA}" \
          AXIGNAL_LANDING_IMAGE_DIGEST=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          AXIGNAL_BUILD_SHA="${GITHUB_SHA}" \
            docker compose -f infra/landing/compose.yaml config > compose-landing.rendered.yaml
          grep -F \
            "registry.example.invalid/axignal/landing:${GITHUB_SHA}@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            compose-landing.rendered.yaml

      - name: Upload immutable-input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g6-immutable-input-evidence
          path: |
            g6-supply-chain-verification.json
            runtime-freeze.txt
            locked-image-references.txt
            locked-image-availability.tsv
            compose-root.rendered.yaml
            compose-landing.rendered.yaml
          if-no-files-found: ignore
          retention-days: 14

  reproducible-images:
    name: Double-build effective image manifests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    needs: immutable-inputs
    env:
      DOCKER_BUILDKIT: "1"
      G6_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "sE1UcqEPMP7P8nQTWYIUav+mBCOkc/NgMKGKSkXQz0s="
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Build every release image twice without cache
        shell: bash
        run: |
          set -euo pipefail
          for variant in a b; do
            docker build \
              --pull=false \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --tag "axignal-g6-runtime:${variant}" \
              --file infra/runtime/Dockerfile \
              .
            docker build \
              --pull=false \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --build-arg AXIGNAL_BUILD_SHA="${GITHUB_SHA}" \
              --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="${G6_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}" \
              --tag "axignal-g6-web:${variant}" \
              --file infra/pilot/Dockerfile.web \
              .
            docker build \
              --pull=false \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --build-arg AXIGNAL_BUILD_SHA="${GITHUB_SHA}" \
              --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="${G6_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}" \
              --tag "axignal-g6-landing:${variant}" \
              --file infra/landing/Dockerfile \
              .
            docker build \
              --pull=false \
              --no-cache \
              --provenance=false \
              --sbom=false \
              --tag "axignal-g6-postgres:${variant}" \
              infra/postgres
          done

      - name: Capture effective filesystem manifests
        shell: bash
        run: |
          set -euo pipefail
          capture_manifest() {
            local image="$1"
            local output="$2"
            shift 2
            local container
            container="$(docker create "$image")"
            trap 'docker rm -f "$container" >/dev/null 2>&1 || true' RETURN
            docker export "$container" | python scripts/image_filesystem_manifest.py "$@" --output "$output"
            docker rm "$container" >/dev/null
            trap - RETURN
          }

          for variant in a b; do
            capture_manifest "axignal-g6-runtime:${variant}" "runtime-${variant}.json" --prefix /app
            capture_manifest "axignal-g6-web:${variant}" "web-${variant}.json" --prefix /app
            capture_manifest "axignal-g6-landing:${variant}" "landing-${variant}.json" --prefix /app
            capture_manifest "axignal-g6-postgres:${variant}" "postgres-${variant}.json" \
              --prefix /docker-entrypoint-initdb.d \
              --prefix /usr/lib/postgresql/17/lib/vector.so \
              --prefix /usr/share/postgresql/17/extension
          done

      - name: Compare double-build manifests and runtime package graphs
        shell: bash
        run: |
          set -euo pipefail
          cmp runtime-a.json runtime-b.json
          cmp web-a.json web-b.json
          cmp landing-a.json landing-b.json
          cmp postgres-a.json postgres-b.json

          docker run --rm axignal-g6-runtime:a python -m pip freeze --all | sort > runtime-packages-a.txt
          docker run --rm axignal-g6-runtime:b python -m pip freeze --all | sort > runtime-packages-b.txt
          cmp runtime-packages-a.txt runtime-packages-b.txt

          python - <<'PY' | tee runtime-package-verification.json
          import json
          import re
          from pathlib import Path

          def normalise(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()

          expected = {}
          current = []
          for raw in Path("requirements/python-runtime.lock").read_text().splitlines():
              stripped = raw.strip()
              if not current and (not stripped or stripped.startswith("#")):
                  continue
              current.append(stripped)
              if stripped.endswith("\\"):
                  continue
              statement = " ".join(current)
              current = []
              match = re.match(r"^([A-Za-z0-9_.-]+)(?:\[[^]]+\])?==([^\s;\\]+)", statement)
              if match:
                  expected[normalise(match.group(1))] = match.group(2)

          actual = {}
          for raw in Path("runtime-packages-a.txt").read_text().splitlines():
              if "==" not in raw:
                  continue
              name, version = raw.split("==", 1)
              actual[normalise(name)] = version

          missing = {name: version for name, version in expected.items() if actual.get(name) != version}
          unexpected = {
              name: version
              for name, version in actual.items()
              if name not in expected and name not in {"pip", "setuptools"}
          }
          assert not missing, missing
          assert not unexpected, unexpected
          print(json.dumps({
              "schema": "axignal.g6-runtime-package-verification.v1",
              "status": "PASS",
              "expected_packages": len(expected),
              "actual_packages": len(actual),
              "tooling_packages": sorted(set(actual) - set(expected)),
          }, indent=2, sort_keys=True))
          PY

          python - <<'PY' | tee reproducibility-summary.json
          import json
          from pathlib import Path

          names = ("runtime", "web", "landing", "postgres")
          manifests = {}
          for name in names:
              left = json.loads(Path(f"{name}-a.json").read_text())
              right = json.loads(Path(f"{name}-b.json").read_text())
              assert left == right
              manifests[name] = {
                  "entries": left["entry_count"],
                  "sha256": left["manifest_sha256"],
              }
          print(json.dumps({
              "schema": "axignal.g6-image-reproducibility.v1",
              "status": "PASS",
              "manifests": manifests,
          }, indent=2, sort_keys=True))
          PY

      - name: Verify runtime imports
        run: |
          docker run --rm axignal-g6-runtime:a \
            python -c "import axignal_api.application, axignal_api.scheduler_service, axignal_api.worker"

      - name: Verify PostGIS and pgvector initialization
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name axignal-g6-postgres-runtime \
            --env POSTGRES_USER=axignal \
            --env POSTGRES_PASSWORD=g6-reproducibility-only \
            --env POSTGRES_DB=axignal \
            axignal-g6-postgres:a
          cleanup() {
            docker logs axignal-g6-postgres-runtime > postgres-runtime.log 2>&1 || true
            docker rm -f axignal-g6-postgres-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if docker exec axignal-g6-postgres-runtime pg_isready -U axignal -d axignal >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec axignal-g6-postgres-runtime \
            psql -U axignal -d axignal -Atc \
            "SELECT extname || '=' || extversion FROM pg_extension WHERE extname IN ('postgis', 'vector') ORDER BY extname" \
            | tee postgres-extension-versions.txt
          grep -q '^postgis=' postgres-extension-versions.txt
          grep -q '^vector=' postgres-extension-versions.txt

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g6-image-reproducibility-evidence
          path: |
            *-a.json
            *-b.json
            runtime-packages-a.txt
            runtime-packages-b.txt
            runtime-package-verification.json
            reproducibility-summary.json
            postgres-extension-versions.txt
            postgres-runtime.log
          if-no-files-found: ignore
          retention-days: 14
