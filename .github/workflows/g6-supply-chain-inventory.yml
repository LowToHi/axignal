name: G6 Supply Chain Inventory

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements/**"
      - "infra/**/Dockerfile*"
      - "compose.yaml"
      - "infra/pilot/**"
      - ".github/workflows/**"
      - "scripts/verify_g6_supply_chain.py"
  push:
    branches:
      - "agent/axignal-rc6-reproducible-supply-chain-v1"

permissions:
  contents: read

concurrency:
  group: g6-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Resolve Python locks and container digests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"
      - name: Install pinned lock generator
        run: python -m pip install "pip==26.2" "pip-tools==7.6.0"
      - name: Generate hash-locked Python dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p requirements
          pip-compile pyproject.toml \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements/python-runtime.lock
          pip-compile pyproject.toml \
            --extra=dev \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=requirements/python-dev.lock
      - name: Resolve immutable container image digests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/images.txt <<'IMAGES'
          python:3.13-slim
          node:22.14.0-alpine
          postgis/postgis:17-3.5
          postgres:17-alpine
          valkey/valkey:8-alpine
          caddy:2.10.0-alpine
          otel/opentelemetry-collector-contrib:0.130.0
          IMAGES
          : > /tmp/image-digests.tsv
          while IFS= read -r image; do
            output="$(docker buildx imagetools inspect "$image")"
            digest="$(printf '%s\n' "$output" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "could not resolve immutable digest for $image" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$image" "$digest" | tee -a /tmp/image-digests.tsv
          done < /tmp/images.txt
          python - <<'PY'
          import json
          from pathlib import Path

          images = []
          for line in Path("/tmp/image-digests.tsv").read_text().splitlines():
              reference, digest = line.split("\t", 1)
              images.append({"reference": reference, "digest": digest})
          payload = {
              "schema": "axignal.g6-supply-chain-inventory.v0.1",
              "python": "3.13.14",
              "pip": "26.2",
              "pip_tools": "7.6.0",
              "images": images,
          }
          Path("supply-chain-inventory.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Prove generated locks install with hashes
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/axignal-runtime-lock
          /tmp/axignal-runtime-lock/bin/python -m pip install --upgrade "pip==26.2"
          /tmp/axignal-runtime-lock/bin/python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/python-runtime.lock
          /tmp/axignal-runtime-lock/bin/python -m pip check
          /tmp/axignal-runtime-lock/bin/python -m pip freeze --all | sort > runtime-freeze.txt

          python -m venv /tmp/axignal-dev-lock
          /tmp/axignal-dev-lock/bin/python -m pip install --upgrade "pip==26.2"
          /tmp/axignal-dev-lock/bin/python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/python-dev.lock
          /tmp/axignal-dev-lock/bin/python -m pip check
          /tmp/axignal-dev-lock/bin/python -m pip freeze --all | sort > dev-freeze.txt
      - name: Upload inventory for reviewed pinning
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g6-supply-chain-inventory
          path: |
            requirements/python-runtime.lock
            requirements/python-dev.lock
            runtime-freeze.txt
            dev-freeze.txt
            supply-chain-inventory.json
          retention-days: 14
