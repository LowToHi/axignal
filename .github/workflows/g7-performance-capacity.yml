name: G7 Performance Load Soak and Capacity

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/concurrent_repository.py"
      - "apps/api/src/axignal_api/queue.py"
      - "apps/api/src/axignal_api/worker.py"
      - "apps/api/tests/test_worker_concurrency.py"
      - "data/acceptance/performance/**"
      - "infra/performance/**"
      - "scripts/run_g7_performance_campaign.py"
      - "scripts/run_g7_compose_campaign.sh"
      - "scripts/verify_g7_performance_contract.py"
      - "docs/runbooks/g7-performance-capacity.md"
      - ".github/workflows/g7-performance-capacity.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "apps/api/src/axignal_api/concurrent_repository.py"
      - "apps/api/src/axignal_api/queue.py"
      - "apps/api/src/axignal_api/worker.py"
      - "apps/api/tests/test_worker_concurrency.py"
      - "data/acceptance/performance/**"
      - "infra/performance/**"
      - "scripts/run_g7_performance_campaign.py"
      - "scripts/run_g7_compose_campaign.sh"
      - "scripts/verify_g7_performance_contract.py"
      - "docs/runbooks/g7-performance-capacity.md"
      - ".github/workflows/g7-performance-capacity.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Evidence profile to execute
        required: true
        type: choice
        default: CI_CHARACTERISATION
        options:
          - CI_CHARACTERISATION
          - PRODUCTION_REPRESENTATIVE
      production_soak_seconds:
        description: Production-representative soak duration; minimum 3600
        required: true
        type: string
        default: "3600"
      production_research_runs:
        description: Production-representative research runs; minimum 400
        required: true
        type: string
        default: "400"

permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: g7-performance-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract harness and concurrency integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee g7-contract-exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check

      - name: Validate harness contract and concurrency invariants
        run: |
          python -m compileall -q \
            apps/api/src/axignal_api/concurrent_repository.py \
            apps/api/src/axignal_api/queue.py \
            apps/api/src/axignal_api/worker.py \
            apps/api/tests/test_worker_concurrency.py \
            scripts/run_g7_performance_campaign.py \
            scripts/verify_g7_performance_contract.py
          ruff check \
            apps/api/src/axignal_api/concurrent_repository.py \
            apps/api/src/axignal_api/queue.py \
            apps/api/src/axignal_api/worker.py \
            apps/api/tests/test_worker_concurrency.py \
            scripts/run_g7_performance_campaign.py \
            scripts/verify_g7_performance_contract.py
          pytest apps/api/tests/test_worker_concurrency.py
          bash -n scripts/run_g7_compose_campaign.sh
          python scripts/verify_g7_performance_contract.py \
            | tee g7-contract.json

      - name: Upload contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g7-contract-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            g7-contract-exact-head.txt
            g7-contract.json
          if-no-files-found: error
          retention-days: 30

  ci-characterisation:
    name: Ephemeral CI characterisation
    if: github.event_name != 'workflow_dispatch' || inputs.profile == 'CI_CHARACTERISATION'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AXIGNAL_G7_PROFILE: CI_CHARACTERISATION
      AXIGNAL_G7_OUTPUT_DIR: artifacts/g7-ci
      AXIGNAL_G7_COMPOSE_PROJECT: axignal-g7-ci
      AXIGNAL_G7_WORKERS: "2"
      AXIGNAL_G7_HEALTH_REQUESTS: "200"
      AXIGNAL_G7_RESEARCH_RUNS: "12"
      AXIGNAL_G7_SOAK_SECONDS: "60"
      AXIGNAL_G7_SOAK_RPS: "2"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$AXIGNAL_G7_OUTPUT_DIR"
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee "$AXIGNAL_G7_OUTPUT_DIR/exact-head.txt"

      - name: Execute bounded load soak and capacity characterisation
        run: bash scripts/run_g7_compose_campaign.sh

      - name: Upload CI characterisation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g7-ci-characterisation-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/g7-ci
          if-no-files-found: error
          retention-days: 30

  production-representative:
    name: Declared-hardware production-representative campaign
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'PRODUCTION_REPRESENTATIVE'
    needs: contract
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 150
    env:
      AXIGNAL_G7_PROFILE: PRODUCTION_REPRESENTATIVE
      AXIGNAL_G7_OUTPUT_DIR: artifacts/g7-production
      AXIGNAL_G7_COMPOSE_PROJECT: axignal-g7-production
      AXIGNAL_G7_WORKERS: "4"
      AXIGNAL_G7_HEALTH_REQUESTS: "5000"
      AXIGNAL_G7_RESEARCH_RUNS: ${{ inputs.production_research_runs }}
      AXIGNAL_G7_SOAK_SECONDS: ${{ inputs.production_soak_seconds }}
      AXIGNAL_G7_SOAK_RPS: "2"
      AXIGNAL_G7_HEALTH_CONCURRENCY: "50"
      AXIGNAL_G7_RESEARCH_CONCURRENCY: "20"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$AXIGNAL_G7_OUTPUT_DIR"
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee "$AXIGNAL_G7_OUTPUT_DIR/exact-head.txt"

      - name: Execute declared-hardware production-representative campaign
        run: bash scripts/run_g7_compose_campaign.sh

      - name: Upload production-representative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g7-production-representative-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/g7-production
          if-no-files-found: error
          retention-days: 90
