name: Gate 7 Consolidated Engineering Authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/acceptance/**"
      - "data/contracts/**"
      - "apps/api/src/axignal_api/concurrent_repository.py"
      - "apps/api/src/axignal_api/persistent_research.py"
      - "apps/api/src/axignal_api/persistent_ted_research.py"
      - "apps/api/src/axignal_api/queue.py"
      - "apps/api/src/axignal_api/worker.py"
      - "apps/api/src/axignal_api/o01_contact_policy.py"
      - "apps/api/src/axignal_api/o01_source_admission_authority.py"
      - "apps/api/src/axignal_api/procurement_domain.py"
      - "apps/api/tests/test_worker_concurrency.py"
      - "apps/api/tests/test_o01_*.py"
      - "apps/api/tests/test_procurement_domain_contracts.py"
      - "scripts/verify_gate7_*.py"
      - "scripts/verify_o01_domain_contracts.py"
      - "scripts/extract_gate7_o01_source_admission_authority.py"
      - "docs/acceptance/Gate-7-consolidated-engineering-v1.md"
      - "docs/acceptance/Gate-7-O01-TED-source-admission-v0.2.md"
      - ".github/workflows/gate7-consolidated-engineering.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "data/acceptance/**"
      - "data/contracts/**"
      - "apps/api/src/axignal_api/concurrent_repository.py"
      - "apps/api/src/axignal_api/persistent_research.py"
      - "apps/api/src/axignal_api/persistent_ted_research.py"
      - "apps/api/src/axignal_api/queue.py"
      - "apps/api/src/axignal_api/worker.py"
      - "apps/api/src/axignal_api/o01_contact_policy.py"
      - "apps/api/src/axignal_api/o01_source_admission_authority.py"
      - "apps/api/src/axignal_api/procurement_domain.py"
      - "apps/api/tests/test_worker_concurrency.py"
      - "apps/api/tests/test_o01_*.py"
      - "apps/api/tests/test_procurement_domain_contracts.py"
      - "scripts/verify_gate7_*.py"
      - "scripts/verify_o01_domain_contracts.py"
      - "scripts/extract_gate7_o01_source_admission_authority.py"
      - "docs/acceptance/Gate-7-consolidated-engineering-v1.md"
      - "docs/acceptance/Gate-7-O01-TED-source-admission-v0.2.md"
      - ".github/workflows/gate7-consolidated-engineering.yml"

permissions:
  contents: read
  issues: read

concurrency:
  group: gate7-consolidated-engineering-${{ github.ref }}
  cancel-in-progress: true

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  ADMISSION_MANIFEST: data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-authority-manifest.v0.2.json
  ADMISSION_CONTRACT: data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-contract.v0.2.json
  ADMISSION_CLOSURE: data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-closure.v0.2.json
  CAMPAIGN_CLOSURE: data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-closure.v0.6-r4.json
  CAMPAIGN_REGISTRY: data/acceptance/campaign-results/AX-LIB-O01-TED-QALAG-ML-CONTROLS-v0.6-r4.json
  RESULT_DIR: artifacts/gate7-consolidated

jobs:
  consolidated-authority:
    name: Single-head Gate 7 engineering authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze exact head and tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$RESULT_DIR"
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee "$RESULT_DIR/exact-head.txt"

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
          check-latest: false

      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Validate consolidated implementation
        env:
          PYTHONPATH: apps/api/src
        run: |
          python -m compileall -q \
            apps/api/src/axignal_api/concurrent_repository.py \
            apps/api/src/axignal_api/o01_contact_policy.py \
            apps/api/src/axignal_api/o01_source_admission_authority.py \
            apps/api/src/axignal_api/procurement_domain.py \
            apps/api/src/axignal_api/queue.py \
            apps/api/src/axignal_api/worker.py \
            apps/api/tests/test_worker_concurrency.py \
            apps/api/tests/test_o01_contact_policy.py \
            apps/api/tests/test_o01_source_admission_authority.py \
            apps/api/tests/test_procurement_domain_contracts.py \
            scripts/verify_gate7_consolidation.py \
            scripts/verify_gate7_source_rights_v0_2.py \
            scripts/verify_gate7_o01_source_admission_contract_v0_2.py \
            scripts/extract_gate7_o01_source_admission_authority.py
          python -m ruff check \
            apps/api/src/axignal_api/concurrent_repository.py \
            apps/api/src/axignal_api/o01_contact_policy.py \
            apps/api/src/axignal_api/o01_source_admission_authority.py \
            apps/api/src/axignal_api/procurement_domain.py \
            apps/api/src/axignal_api/queue.py \
            apps/api/src/axignal_api/worker.py \
            apps/api/tests/test_worker_concurrency.py \
            apps/api/tests/test_o01_contact_policy.py \
            apps/api/tests/test_o01_source_admission_authority.py \
            apps/api/tests/test_procurement_domain_contracts.py \
            scripts/verify_gate7_consolidation.py \
            scripts/verify_gate7_source_rights_v0_2.py \
            scripts/verify_gate7_o01_source_admission_contract_v0_2.py \
            scripts/extract_gate7_o01_source_admission_authority.py
          python -m pytest -q \
            apps/api/tests/test_worker_concurrency.py \
            apps/api/tests/test_o01_contact_policy.py \
            apps/api/tests/test_o01_source_admission_authority.py \
            apps/api/tests/test_procurement_domain_contracts.py

      - name: Verify source history and admitted state
        run: |
          set -euo pipefail
          python scripts/verify_gate7_source_snapshots.py \
            | tee "$RESULT_DIR/source-snapshot-integrity.json"
          python scripts/verify_gate7_source_rights_v0_2.py \
            | tee "$RESULT_DIR/source-rights-admission-reconciliation.json"
          python scripts/verify_gate7_o01_source_admission_contract_v0_2.py \
            --manifest "$ADMISSION_MANIFEST" \
            --contract "$ADMISSION_CONTRACT" \
            --closure "$CAMPAIGN_CLOSURE" \
            --registry "$CAMPAIGN_REGISTRY" \
            | tee "$RESULT_DIR/o01-source-admission-contract.json"
          python scripts/verify_o01_domain_contracts.py \
            | tee "$RESULT_DIR/o01-domain-contracts.json"

      - name: Reconstruct seven current human authorities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/extract_gate7_o01_source_admission_authority.py \
            --manifest "$ADMISSION_MANIFEST" \
            --closure "$CAMPAIGN_CLOSURE" \
            --output "$RESULT_DIR/o01-source-admission-result.json" \
            --require-admitted

      - name: Materialise current Gate 7 report
        env:
          AXIGNAL_EVIDENCE_HEAD_SHA: ${{ env.AXIGNAL_EXACT_SHA }}
          AXIGNAL_REQUIRE_GATE7_PASS: "false"
          AXIGNAL_GATE7_EVIDENCE_DIR: ${{ env.RESULT_DIR }}
        run: |
          python scripts/verify_gate7_global_coverage.py \
            | tee "$RESULT_DIR/gate7-console.json"

      - name: Verify current consolidated authority
        run: |
          python scripts/verify_gate7_consolidation.py \
            --output "$RESULT_DIR/consolidation-attestation.json"
          cp \
            data/acceptance/gate7/AX-G7-consolidated-engineering-contract.v1.json \
            "$RESULT_DIR/"

      - name: Enforce exact current boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/gate7-consolidated")
          attestation = json.loads(
              (root / "consolidation-attestation.json").read_text()
          )
          admission = json.loads(
              (root / "o01-source-admission-result.json").read_text()
          )
          rights = json.loads(
              (root / "source-rights-admission-reconciliation.json").read_text()
          )
          summary = json.loads((root / "gate7-summary.json").read_text())

          assert attestation["status"] == "PASS"
          assert attestation["output"] == "GATE7_CONSOLIDATED_ENGINEERING_PASS"
          assert attestation["exact_head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert attestation["historical_contract_boundary_preserved"] is True
          assert attestation["stack_consolidated"] is True
          assert attestation["single_exact_head"] is True
          assert attestation["ci_failing"] == 0
          assert attestation["stale_head_evidence"] == 0
          assert attestation["unresolved_conflicts"] == 0
          assert attestation["active_sources"] == 1
          assert attestation["product_admitted_sources"] == 1
          assert attestation["source_admission_authority"] is True
          assert attestation["ted_source_state"] == "PRODUCT_ADMITTED"
          assert attestation["o01_canonical_state"] == "IN_REVIEW"
          assert attestation["o01_claim_decision"] == "PENDING"
          assert attestation["bounded_claim_contribution"] is False
          assert attestation["global_coverage_claim_authorised"] is False
          assert attestation["gate7_decision"] == "IN_PROGRESS"
          assert attestation["public_launch"] == "NO_GO"

          assert admission["status"] == "PASS"
          assert admission["output"] == "O01_TED_SOURCE_ADMISSION_PASS"
          assert admission["bounded_claim_contribution"] is False
          assert rights["status"] == "PASS"
          assert rights["source_state"] == "PRODUCT_ADMITTED"
          assert rights["claim_contribution"] is False
          assert summary["status"] == "PASS"
          assert summary["gate_decision"] == "IN_PROGRESS"
          assert summary["public_launch_authorised"] is False
          PY

      - name: Freeze authority inputs
        run: |
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
            sha256sum "$ADMISSION_MANIFEST"
            sha256sum "$ADMISSION_CONTRACT"
            sha256sum "$ADMISSION_CLOSURE"
            sha256sum "$CAMPAIGN_CLOSURE"
            sha256sum "$CAMPAIGN_REGISTRY"
            sha256sum data/acceptance/library-coverage/AX-LIB-O01.json
            sha256sum data/acceptance/gate7/AX-G7-consolidated-engineering-contract.v1.json
          } > "$RESULT_DIR/exact-provenance.txt"
          find "$RESULT_DIR" \
            -type f \
            ! -name payload.sha256 \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$RESULT_DIR/payload.sha256"

      - name: Reject sensitive material
        run: |
          set -euo pipefail
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            "$RESULT_DIR"
          ! grep -R -E \
            '"(buyer-email|buyer-tel|organisation-tel-buyer|buyer-contact-point)"[[:space:]]*:' \
            "$RESULT_DIR"

      - name: Upload consolidated Gate 7 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate7-consolidated-engineering-${{ env.AXIGNAL_EXACT_SHA }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 30
