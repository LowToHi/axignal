name: Gate 7 Global Coverage Sources and Multilingual Acceptance

on:
  workflow_dispatch:
    inputs:
      require_gate_pass:
        description: Fail unless Gate 7 has complete accepted evidence
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "data/acceptance/**"
      - "data/foundations/**"
      - "data/procurement/**"
      - "data/grants/**"
      - "data/regulatory/**"
      - "data/infrastructure/**"
      - "data/corporate/**"
      - "data/sovereign-macro/**"
      - "data/trade-supply-chain/**"
      - "data/energy-climate/**"
      - "data/innovation-ip/**"
      - "apps/api/src/axignal_api/o01_contact_policy.py"
      - "apps/api/src/axignal_api/o01_approval_renewal.py"
      - "apps/api/tests/test_o01_contact_policy.py"
      - "apps/api/tests/test_o01_approval_renewal.py"
      - "apps/api/tests/test_o01_typed_authority_extraction.py"
      - "schemas/global-coverage-source-language-*.schema.json"
      - "scripts/verify_gate7_global_coverage.py"
      - "scripts/verify_gate7_source_snapshots.py"
      - "scripts/verify_gate7_source_rights.py"
      - "scripts/verify_gate7_o01_campaign_contract.py"
      - "scripts/verify_gate7_o01_legal_privacy_reconciliation.py"
      - "scripts/verify_gate7_o01_renewal.py"
      - "scripts/extract_gate7_o01_typed_authority.py"
      - "scripts/prepare_gate7_o01_renewal.py"
      - "scripts/materialize_gate7_o01_approval_manifest.py"
      - "docs/acceptance/Gate-7-global-coverage-sources-multilingual-v0.1.md"
      - ".github/workflows/gate7-global-coverage-source-language.yml"
      - ".github/workflows/o01-approval-renewal.yml"

  workflow_call:
    inputs:
      require_gate_pass:
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: gate7-global-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-source-language:
    name: Coverage, source admission and multilingual journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          mkdir -p artifacts/gate7
          printf 'exact_head_sha=%s\n' "$actual_sha" \
            | tee exact-head.txt artifacts/gate7/exact-head.txt
          printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" \
            | tee -a artifacts/gate7/exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install frozen development graph
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Verify implementation quality
        run: |
          python -m compileall -q \
            apps/api/src/axignal_api/o01_contact_policy.py \
            apps/api/src/axignal_api/o01_approval_renewal.py \
            apps/api/tests/test_o01_contact_policy.py \
            apps/api/tests/test_o01_approval_renewal.py \
            apps/api/tests/test_o01_typed_authority_extraction.py \
            scripts/verify_gate7_global_coverage.py \
            scripts/verify_gate7_source_snapshots.py \
            scripts/verify_gate7_source_rights.py \
            scripts/verify_gate7_o01_campaign_contract.py \
            scripts/verify_gate7_o01_legal_privacy_reconciliation.py \
            scripts/verify_gate7_o01_renewal.py \
            scripts/extract_gate7_o01_typed_authority.py \
            scripts/prepare_gate7_o01_renewal.py \
            scripts/materialize_gate7_o01_approval_manifest.py
          ruff check \
            apps/api/src/axignal_api/o01_contact_policy.py \
            apps/api/src/axignal_api/o01_approval_renewal.py \
            apps/api/tests/test_o01_contact_policy.py \
            apps/api/tests/test_o01_approval_renewal.py \
            apps/api/tests/test_o01_typed_authority_extraction.py \
            scripts/verify_gate7_global_coverage.py \
            scripts/verify_gate7_source_snapshots.py \
            scripts/verify_gate7_source_rights.py \
            scripts/verify_gate7_o01_campaign_contract.py \
            scripts/verify_gate7_o01_legal_privacy_reconciliation.py \
            scripts/verify_gate7_o01_renewal.py \
            scripts/extract_gate7_o01_typed_authority.py \
            scripts/prepare_gate7_o01_renewal.py \
            scripts/materialize_gate7_o01_approval_manifest.py

      - name: Execute contextual policy and renewal tests
        run: |
          pytest -q \
            apps/api/tests/test_o01_contact_policy.py \
            apps/api/tests/test_o01_approval_renewal.py \
            apps/api/tests/test_o01_typed_authority_extraction.py

      - name: Verify repository source snapshots
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_source_snapshots.py \
            | tee artifacts/gate7/source-snapshot-integrity.json

      - name: Verify O01 legal and rights historical fail-closed policy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_source_rights.py \
            | tee artifacts/gate7/source-rights-policy.json

      - name: Verify O01 contextual Legal and Privacy reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_legal_privacy_reconciliation.py \
            | tee artifacts/gate7/o01-legal-privacy-reconciliation.json

      - name: Verify O01 approval-renewal contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_renewal.py \
            | tee artifacts/gate7/o01-approval-renewal-contract.json

      - name: Materialise O01 exact-head approval manifest
        shell: bash
        run: |
          set -euo pipefail
          AXIGNAL_EXACT_SHA="$AXIGNAL_EXACT_SHA" \
            python scripts/materialize_gate7_o01_approval_manifest.py \
            | tee artifacts/gate7/o01-approval-manifest-result.json
          cp artifacts/o01-legal-privacy/approval-manifest.v0.2.json \
            artifacts/gate7/approval-manifest.v0.2.json
          cp artifacts/o01-legal-privacy/approval-manifest.v0.2.sha256 \
            artifacts/gate7/approval-manifest.v0.2.sha256

      - name: Materialise deterministic O01 renewal package
        shell: bash
        run: |
          set -euo pipefail
          AXIGNAL_RENEWAL_PREPARATION=1 \
          AXIGNAL_EXACT_SHA="$AXIGNAL_EXACT_SHA" \
            python scripts/prepare_gate7_o01_renewal.py \
              --now '2026-08-01T12:00:00Z' \
              --output-dir "$GITHUB_WORKSPACE/artifacts/gate7/o01-renewal" \
            | tee artifacts/gate7/o01-approval-renewal-result.json
          cmp \
            artifacts/gate7/approval-manifest.v0.2.json \
            artifacts/o01-legal-privacy/approval-manifest.v0.2.json
          cmp \
            artifacts/gate7/approval-manifest.v0.2.sha256 \
            artifacts/o01-legal-privacy/approval-manifest.v0.2.sha256

      - name: Verify O01 evidence campaign remains blocked
        shell: bash
        run: |
          set -euo pipefail
          AXIGNAL_EXACT_SHA="$AXIGNAL_EXACT_SHA" \
            python scripts/verify_gate7_o01_campaign_contract.py \
            | tee artifacts/gate7/o01-campaign-contract.json

      - name: Materialise and verify Gate 7 report
        shell: bash
        run: |
          set -euo pipefail
          require_pass=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.require_gate_pass }}" = "true" ]; then
            require_pass=true
          fi
          AXIGNAL_EVIDENCE_HEAD_SHA="$AXIGNAL_EXACT_SHA" \
          AXIGNAL_REQUIRE_GATE7_PASS="$require_pass" \
          AXIGNAL_GATE7_EVIDENCE_DIR=artifacts/gate7 \
            python scripts/verify_gate7_global_coverage.py \
            | tee artifacts/gate7/gate7-console.json

      - name: Enforce launch, renewal and claim boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("artifacts/gate7/gate7-summary.json").read_text())
          snapshots = json.loads(
              Path("artifacts/gate7/source-snapshot-integrity.json").read_text()
          )
          rights = json.loads(
              Path("artifacts/gate7/source-rights-policy.json").read_text()
          )
          reconciliation = json.loads(
              Path("artifacts/gate7/o01-legal-privacy-reconciliation.json").read_text()
          )
          renewal_contract = json.loads(
              Path("artifacts/gate7/o01-approval-renewal-contract.json").read_text()
          )
          renewal_result = json.loads(
              Path("artifacts/gate7/o01-approval-renewal-result.json").read_text()
          )
          renewal_package = json.loads(
              Path("artifacts/gate7/o01-renewal/renewal-package.v0.1.json").read_text()
          )
          manifest_result = json.loads(
              Path("artifacts/gate7/o01-approval-manifest-result.json").read_text()
          )
          manifest = json.loads(
              Path("artifacts/gate7/approval-manifest.v0.2.json").read_text()
          )
          campaign = json.loads(
              Path("artifacts/gate7/o01-campaign-contract.json").read_text()
          )

          assert snapshots["status"] == "PASS"
          assert snapshots["source_snapshots_checked"] >= 4

          assert rights["status"] == "PASS"
          assert rights["source_state"] == "CANDIDATE"
          assert rights["legal_admission"] == "MISSING"
          assert rights["rights_admission"] == "MISSING"
          assert rights["privacy_data_rights_approval"] == "MISSING"
          assert rights["claim_contribution"] is False
          assert rights["controls"]["personal_data_blocked"] is True
          assert rights["controls"]["third_party_content_blocked"] is True
          assert rights["controls"]["public_api_redistribution_denied"] is True
          assert rights["controls"]["model_training_denied"] is True

          assert reconciliation["status"] == "PASS"
          assert reconciliation["output"] == "O01_LEGAL_PRIVACY_RECONCILIATION_PASS"
          assert reconciliation["contact_policy"] == {
              "AMBIGUOUS_PERSONAL": "LINK_ONLY",
              "BLOCKED": "BLOCK",
              "FUNCTIONAL_NON_PERSONAL": "ALLOW",
              "INSTITUTIONAL": "ALLOW",
              "PROFESSIONAL_PERSONAL": "CONTEXTUAL",
          }
          assert reconciliation["legal_decision"] == "MISSING"
          assert reconciliation["privacy_data_rights_decision"] == "MISSING"
          assert reconciliation["campaign_status"] == "BLOCKED"
          assert reconciliation["execution_authorised"] is False
          assert reconciliation["external_request_budget"] == 0
          assert reconciliation["source_state"] == "CANDIDATE"
          assert reconciliation["product_admitted"] is False
          assert reconciliation["public_claim_contribution"] is False

          assert renewal_contract["status"] == "PASS"
          assert renewal_contract["output"] == "O01_APPROVAL_RENEWAL_CONTRACT_PASS"
          assert renewal_contract["mode"] == "SEMI_AUTOMATIC"
          assert renewal_contract["automatic_signature"] is False
          assert renewal_contract["automatic_expiry_extension"] is False
          assert renewal_contract["grace_period_seconds"] == 0
          assert renewal_contract["campaign_status"] == "BLOCKED"
          assert renewal_contract["execution_authorised"] is False
          assert renewal_contract["external_request_budget"] == 0

          assert renewal_result["status"] == "PASS"
          assert renewal_result["output"] == "O01_APPROVAL_RENEWAL_PACKAGE_READY"
          assert renewal_result["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert renewal_result["change_class"] == "BASELINE_REQUIRED"
          assert renewal_result["authority_status"] == "MISSING"
          assert renewal_result["new_typed_decisions_required"] is True
          assert renewal_result["execution_authorised"] is False
          assert renewal_result["external_request_budget"] == 0
          assert renewal_result["human_decisions_required"] == [
              "LEGAL",
              "PRIVACY_DATA_RIGHTS",
          ]

          assert renewal_package["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert renewal_package["status"] == "READY_FOR_TYPED_DECISIONS"
          assert renewal_package["approval_target"] == {
              "head_sha": os.environ["AXIGNAL_EXACT_SHA"],
              "manifest_digest": renewal_result["approval_manifest_digest"],
          }
          assert renewal_package["delta"]["change_class"] == "BASELINE_REQUIRED"
          assert renewal_package["renewal"]["new_typed_decisions_required"] is True
          assert renewal_package["renewal"]["automatic_approval"] is False
          assert renewal_package["renewal"]["automatic_signature"] is False
          assert renewal_package["renewal"]["automatic_expiry_extension"] is False
          assert renewal_package["renewal"]["grace_period_seconds"] == 0
          assert renewal_package["campaign_effect"]["campaign_status"] == "BLOCKED"
          assert renewal_package["campaign_effect"]["execution_authorised"] is False
          assert renewal_package["campaign_effect"]["external_request_budget"] == 0
          assert renewal_package["campaign_effect"]["source_state"] == "CANDIDATE"
          assert renewal_package["campaign_effect"]["product_admitted"] is False
          assert renewal_package["campaign_effect"]["public_claim_contribution"] is False
          assert renewal_package["campaign_effect"]["public_launch_authorised"] is False

          assert manifest_result["status"] == "PASS"
          assert manifest_result["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert manifest_result["manifest_status"] == "READY_FOR_TYPED_DECISIONS"
          assert manifest_result["renewal_maximum_expiry_source"] == "CURRENT_RENEWAL_EVIDENCE_PACKAGE"
          assert manifest["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert manifest["status"] == "READY_FOR_TYPED_DECISIONS"
          assert manifest["renewal_contract"]["task_id"] == "AX-GE2E-G7-O01-T04"
          assert manifest["renewal_contract"]["decision_manifest_digest"] == "THIS_MANIFEST_DIGEST"
          assert manifest["renewal_contract"]["maximum_expiry_source"] == "CURRENT_RENEWAL_EVIDENCE_PACKAGE"
          assert manifest["renewal_contract"]["automatic_signature"] is False
          assert manifest["renewal_contract"]["automatic_expiry_extension"] is False
          assert manifest["legal_decision"] == "MISSING"
          assert manifest["privacy_data_rights_decision"] == "MISSING"
          assert manifest["campaign_status"] == "BLOCKED"
          assert manifest["execution_authorised"] is False
          assert manifest["external_request_budget"] == 0
          assert manifest["source_state"] == "CANDIDATE"
          assert manifest["product_admitted"] is False
          assert manifest["public_claim_contribution"] is False
          assert manifest["public_launch_authorised"] is False

          assert campaign["status"] == "PASS"
          assert campaign["contract_head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert campaign["campaign_status"] == "BLOCKED"
          assert campaign["execution_authorised"] is False
          assert campaign["external_request_budget"] == 0
          assert campaign["source_state"] == "CANDIDATE"
          assert campaign["languages"] == ["de", "en", "es", "fr", "it", "pt"]
          assert campaign["kill_switch_rehearsal"] == "NOT_EXECUTED"
          assert campaign["rollback_rehearsal"] == "NOT_EXECUTED"
          assert campaign["claim_contribution"] is False

          assert summary["status"] == "PASS"
          assert summary["evidence_head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert summary["libraries"] == 16
          assert summary["adversarial_checks"] >= 4
          assert summary["public_launch_authorised"] is False
          if summary["gate_decision"] != "PASS":
              assert summary["global_coverage_authorised"] is False
              assert summary["multilingual_authorised"] is False
              assert summary["all_sources_admitted"] is False
          PY

      - name: Reject sensitive evidence and machine signatures
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            artifacts/gate7
          ! grep -R -E '"signature"[[:space:]]*:[[:space:]]*"[^\"]+"' \
            artifacts/gate7

      - name: Upload Gate 7 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate7-global-coverage-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/gate7
          if-no-files-found: error
          retention-days: 30
