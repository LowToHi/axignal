name: Human Review Acceptance

on:
  pull_request:
    paths:
      - "apps/**"
      - "infra/postgres/**"
      - "scripts/verify_bounded_human_review.py"
      - "scripts/verify_human_review_migration_rehearsal.sh"
      - "tests/e2e/human-review.spec.ts"
      - "schemas/human-review-case.schema.json"
      - ".github/workflows/human-review-acceptance.yml"
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: human-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-boundary:
    name: PostgreSQL authority, migration and review acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_PROPOSAL_DATABASE_URL: postgresql://axignal_proposal_worker:axignal_proposal_worker@127.0.0.1:5432/axignal
      AXIGNAL_ADMISSION_DATABASE_URL: postgresql://axignal_admission_runtime_login:axignal_admission_runtime@127.0.0.1:5432/axignal
      AXIGNAL_HUMAN_REVIEW_DATABASE_URL: postgresql://axignal_human_reviewer_login:axignal_human_reviewer@127.0.0.1:5432/axignal
      AXIGNAL_HUMAN_REVIEWER_SUBJECTS: usr_human_review_ci
      AXIGNAL_VALKEY_URL: redis://127.0.0.1:6379/0
      AXIGNAL_PERSISTENT_RESEARCH_ENABLED: "true"
      AXIGNAL_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_WORLD_BANK_FIXTURE_PATH: apps/api/tests/fixtures/world_bank_rus_inflation.json
      AXIGNAL_DOCUMENT_FIXTURE_PATH: apps/api/tests/fixtures/world_bank_rer41_document.json
      AXIGNAL_DOCUMENT_PROPOSAL_FIXTURE_PATH: apps/api/tests/fixtures/world_bank_rer41_proposal.json
      AXIGNAL_RESEARCH_QUEUE_KEY: axignal:research:queue:human-review-ci
      AXIGNAL_PROPOSAL_QUEUE_KEY: axignal:proposal:queue:human-review-ci
      AXIGNAL_ADMISSION_QUEUE_KEY: axignal:admission:queue:human-review-ci
      AXIGNAL_IDENTITY_ASSERTION_SECRET: ci-identity-assertion-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start disposable services
        run: docker compose up --build --detach --wait
      - name: Capture PostgreSQL initialization logs
        if: failure()
        run: docker compose logs postgres > postgres-init.log 2>&1 || true
      - name: Rehearse migration and snapshot restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_human_review_migration_rehearsal.sh 2>&1 | tee human-review-migration.log
      - name: Run bounded human-review acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_bounded_human_review.py 2>&1 | tee bounded-human-review.log
      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: human-review-diagnostics
          path: |
            postgres-init.log
            human-review-migration.log
            bounded-human-review.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable services
        if: always()
        run: docker compose down --volumes --remove-orphans

  browser-boundary:
    name: Distinct proposal, deterministic and human-review layers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/human-review.spec.ts --project=chromium-desktop
