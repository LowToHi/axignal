name: Bootstrap AXIGNAL Landing

on:
  push:
    branches: ["agent/landing-globe-v1"]
    paths:
      - ".github/workflows/landing-bootstrap.yml"

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Materialise reviewed implementation payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/axignal-payload.b64
          for blob in \
            3fbce5c50ce0f223eb8f7be1b845d0e5ccd01b5f \
            12dbd5551d9312705c950f90a8394be2cddcf037 \
            6dd9f6947835c9a3c112bdfe17f18aa07cc6c9d6 \
            7fd7a349c1b94a412e6c38bbc6c7746e896915d3 \
            cfcf2a43e608195dfe835106410f8aa430dffec2 \
            80cd84d913c77392f2bdfc234b6631b7e346a2cc \
            15097c06714a186c435b63fc0027f0abd47f4269 \
            eb042893ff96f8109e814f7e5e53d45bd72cb5d9 \
            2e4606dc32ab7f27270cd7df1f8505ba34c889d3
          do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode >> /tmp/axignal-payload.b64
          done
          base64 --decode /tmp/axignal-payload.b64 > /tmp/axignal-landing-payload.tar.gz
          test "$(sha256sum /tmp/axignal-landing-payload.tar.gz | cut -d' ' -f1)" = "1b0424dd7c83dc1849f56f817a6cdaa7d71fb2ea4f3db0382938b47c28457b26"
          tar -xzf /tmp/axignal-landing-payload.tar.gz -C .
          mkdir -p apps/landing/public/brand
          cp apps/web/public/brand/axignal-logo-dark.svg apps/landing/public/brand/axignal-logo-dark.svg

      - name: Resolve and lock landing dependencies
        continue-on-error: true
        shell: bash
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Format implementation
        continue-on-error: true
        shell: bash
        run: |
          pnpm exec prettier --write \
            .env.example \
            .github/workflows/landing-foundation.yml \
            apps/landing/package.json \
            apps/landing/app \
            apps/landing/components \
            apps/landing/lib \
            docs/roadmap/17-landing-globe-implementation.md \
            playwright.landing.config.ts \
            tests/landing/landing.spec.ts
          python -m pip install --upgrade pip ruff==0.12.12
          ruff format scripts/verify_landing_implementation.py
          ruff check --fix scripts/verify_landing_implementation.py

      - name: Validate implementation before handoff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_landing_foundation.py
          python scripts/verify_landing_implementation.py
          pnpm --filter @axignal/landing typecheck
          pnpm --filter @axignal/landing build
          git diff --check

      - name: Commit implementation and remove bootstrap
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/landing-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Implement AXIGNAL landing Globe"
          git push origin HEAD:agent/landing-globe-v1
