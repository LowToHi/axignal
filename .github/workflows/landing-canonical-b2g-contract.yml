name: Landing Canonical B2G Contract

on:
  pull_request:
    paths:
      - "apps/landing/**"
      - "tests/landing/**"
      - "scripts/verify_landing_implementation.py"
      - "skills/axignal-cinematic-webgl-scroll/**"
      - "skills/axignal-gsap-ui-ux/**"
      - ".github/workflows/landing-canonical-b2g-contract.yml"
  push:
    branches:
      - codex/landing-b2g-international
    paths:
      - "apps/landing/**"
      - "tests/landing/**"
      - "scripts/verify_landing_implementation.py"
      - "skills/axignal-cinematic-webgl-scroll/**"
      - "skills/axignal-gsap-ui-ux/**"
      - ".github/workflows/landing-canonical-b2g-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: landing-canonical-b2g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-static:
    name: Contract, typecheck, build and audits
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee landing-exact-head.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical landing contract tests
        run: pnpm --filter @axignal/landing test

      - name: Run strict landing typecheck
        run: pnpm --filter @axignal/landing typecheck

      - name: Run production build
        run: pnpm --filter @axignal/landing build

      - name: Verify landing implementation contract
        run: python3 scripts/verify_landing_implementation.py

      - name: Audit GSAP motion contract
        run: node skills/axignal-gsap-ui-ux/scripts/audit-gsap-motion.mjs

      - name: Audit WebGL Globe contract
        run: node skills/axignal-cinematic-webgl-scroll/scripts/audit-webgl-globe.mjs

      - name: Emit contractual markers
        shell: bash
        run: |
          set -euo pipefail
          {
            echo LANDING_CANONICAL_B2G_COPY_PASS
            echo LANDING_PUBLIC_TED_ABSENT_PASS
            echo LANDING_PRICE_BOOK_RECONCILIATION_PASS
            echo LANDING_B2G_TRIAL_INTAKE_PASS
            echo LANDING_STATIC_EXACT_HEAD_PASS
          } | tee landing-contract-markers.txt

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-static-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            landing-exact-head.txt
            landing-contract-markers.txt
          if-no-files-found: error
          retention-days: 30

  browser-matrix:
    name: Globe, desktop, mobile and reduced motion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee landing-browser-exact-head.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install immutable dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build landing
        run: pnpm --filter @axignal/landing build

      - name: Start exact build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @axignal/landing start > landing-server.log 2>&1 &
          echo $! > landing-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat landing-server.log
          exit 1

      - name: Run desktop, mobile and reduced-motion browser contract
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --config=tests/landing/playwright.config.ts 2>&1 | tee landing-browser.log

      - name: Emit exact-head matrix marker
        if: success()
        run: echo LANDING_EXACT_HEAD_MATRIX_PASS | tee landing-browser-markers.txt

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-browser-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            landing-browser-exact-head.txt
            landing-browser.log
            landing-browser-markers.txt
            landing-server.log
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30
