name: Landing Globe Foundation

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "docs/landing/**"
      - "apps/web/public/brand/**"
      - "scripts/verify_landing_foundation.py"
      - "scripts/acquire_globe_assets.py"
      - ".github/workflows/landing-foundation.yml"
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff==0.12.12
      - name: Lint asset tooling
        run: ruff check scripts/verify_landing_foundation.py scripts/acquire_globe_assets.py
      - name: Validate foundation contracts
        run: python scripts/verify_landing_foundation.py | tee landing-foundation.json
      - name: Verify acquisition plan without network
        run: python scripts/acquire_globe_assets.py --output /tmp/axignal-globe-assets --dry-run | tee asset-acquisition-plan.json
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: landing-globe-foundation-evidence
          path: |
            landing-foundation.json
            asset-acquisition-plan.json
          retention-days: 14
