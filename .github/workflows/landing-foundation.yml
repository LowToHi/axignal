name: Landing Globe

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "docs/landing/**"
      - "docs/roadmap/16-landing-globe-foundation.md"
      - "docs/roadmap/17-landing-globe-production.md"
      - "apps/landing/**"
      - "tests/landing/**"
      - "playwright.landing.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/verify_landing_foundation.py"
      - "scripts/verify_landing_implementation.py"
      - "scripts/acquire_globe_assets.py"
      - ".github/workflows/landing-foundation.yml"
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: landing-globe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee landing-foundation-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-foundation-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: landing-foundation-exact-head-1.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python validation tools
        run: python -m pip install --upgrade pip ruff==0.12.12
      - name: Lint landing validation tooling
        run: ruff check scripts/verify_landing_foundation.py scripts/verify_landing_implementation.py scripts/acquire_globe_assets.py
      - name: Validate landing contracts
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_landing_foundation.py | tee landing-foundation.json
          python scripts/verify_landing_implementation.py | tee landing-implementation.json
      - name: Verify acquisition plan without network
        run: python scripts/acquire_globe_assets.py --output /tmp/axignal-globe-assets --dry-run | tee asset-acquisition-plan.json
      - name: Typecheck landing
        run: pnpm --filter @axignal/landing typecheck
      - name: Build landing
        run: pnpm --filter @axignal/landing build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run landing browser contract
        run: pnpm exec playwright test -c playwright.landing.config.ts
      - name: Upload landing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-globe-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            landing-foundation.json
            landing-implementation.json
            asset-acquisition-plan.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
