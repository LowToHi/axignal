name: Landing Lock Bootstrap

on:
  push:
    branches:
      - agent/landing-globe-production-v0.1

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/landing-globe-production-v0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Generate deterministic lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/landing-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/landing-lock-bootstrap.yml
          git commit -m "Update landing dependency lockfile"
          git push origin HEAD:agent/landing-globe-production-v0.1
