name: O01 Approval Renewal Preparation

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      online_terms_check:
        description: Fetch and verify current official TED and EUR-Lex sources
        required: true
        type: boolean
        default: true
  pull_request:
    paths:
      - "apps/api/src/axignal_api/o01_approval_renewal.py"
      - "apps/api/tests/test_o01_approval_renewal.py"
      - "data/acceptance/approvals/AX-LIB-O01-approval-renewal-policy.v0.1.json"
      - "data/acceptance/fixtures/o01-renewal/**"
      - "scripts/prepare_gate7_o01_renewal.py"
      - "scripts/verify_gate7_o01_renewal.py"
      - "scripts/materialize_gate7_o01_approval_manifest.py"
      - ".github/workflows/o01-approval-renewal.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "apps/api/src/axignal_api/o01_approval_renewal.py"
      - "apps/api/tests/test_o01_approval_renewal.py"
      - "data/acceptance/approvals/AX-LIB-O01-approval-renewal-policy.v0.1.json"
      - "data/acceptance/fixtures/o01-renewal/**"
      - "scripts/prepare_gate7_o01_renewal.py"
      - "scripts/verify_gate7_o01_renewal.py"
      - "scripts/materialize_gate7_o01_approval_manifest.py"
      - ".github/workflows/o01-approval-renewal.yml"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: o01-approval-renewal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renewal-preparation:
    name: Refresh evidence and prepare typed renewal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p artifacts/o01-renewal
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee artifacts/o01-renewal/exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install frozen development graph
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Compile and lint renewal boundary
        run: |
          python -m compileall -q \
            apps/api/src/axignal_api/o01_approval_renewal.py \
            apps/api/tests/test_o01_approval_renewal.py \
            scripts/prepare_gate7_o01_renewal.py \
            scripts/verify_gate7_o01_renewal.py \
            scripts/materialize_gate7_o01_approval_manifest.py
          ruff check \
            apps/api/src/axignal_api/o01_approval_renewal.py \
            apps/api/tests/test_o01_approval_renewal.py \
            scripts/prepare_gate7_o01_renewal.py \
            scripts/verify_gate7_o01_renewal.py \
            scripts/materialize_gate7_o01_approval_manifest.py

      - name: Execute renewal unit tests
        run: |
          pytest -q \
            apps/api/tests/test_o01_approval_renewal.py \
            apps/api/tests/test_o01_contact_policy.py

      - name: Verify renewal contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_renewal.py \
            | tee artifacts/o01-renewal/renewal-contract.json

      - name: Recover previous retained renewal package
        id: previous
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/o01-renewal/previous
          artifact_id="$({
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false) | select(.name | startswith("o01-approval-renewal-"))] | sort_by(.created_at) | reverse | .[0].id // empty'
          } || true)"
          if [ -z "$artifact_id" ]; then
            echo 'package=' >> "$GITHUB_OUTPUT"
            echo 'No previous retained renewal package was found.'
            exit 0
          fi
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/o01-previous-renewal.zip
          unzip -q /tmp/o01-previous-renewal.zip \
            -d artifacts/o01-renewal/previous
          package="$(find artifacts/o01-renewal/previous -name 'renewal-package.v0.1.json' -type f | head -n 1)"
          if [ -z "$package" ]; then
            echo 'package=' >> "$GITHUB_OUTPUT"
            echo 'Previous artifact contained no renewal package.'
            exit 0
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Recovered previous package from artifact ${artifact_id}."

      - name: Prepare exact-head renewal package
        id: prepare
        shell: bash
        env:
          PREVIOUS_PACKAGE: ${{ steps.previous.outputs.package }}
        run: |
          set -euo pipefail
          args=(
            --output-dir "$GITHUB_WORKSPACE/artifacts/o01-renewal/current"
          )
          if [ -n "${PREVIOUS_PACKAGE:-}" ]; then
            args+=(--previous-package "$PREVIOUS_PACKAGE")
          fi
          decisions='data/acceptance/approvals/AX-LIB-O01-current-authority.v0.1.json'
          if [ -f "$decisions" ]; then
            args+=(--current-decisions "$decisions")
          fi
          online=false
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            online=true
          elif [ "${{ github.event_name }}" = 'workflow_dispatch' ] && \
               [ "${{ inputs.online_terms_check }}" = 'true' ]; then
            online=true
          fi
          if [ "$online" = true ]; then
            args+=(--online)
          else
            args+=(--now '2026-08-01T12:00:00Z')
          fi
          AXIGNAL_RENEWAL_PREPARATION=1 \
          AXIGNAL_EXACT_SHA="$AXIGNAL_EXACT_SHA" \
            python scripts/prepare_gate7_o01_renewal.py "${args[@]}" \
            | tee artifacts/o01-renewal/renewal-result.json

      - name: Enforce non-authoritative renewal boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(
              Path("artifacts/o01-renewal/renewal-contract.json").read_text()
          )
          result = json.loads(
              Path("artifacts/o01-renewal/renewal-result.json").read_text()
          )
          package = json.loads(
              Path("artifacts/o01-renewal/current/renewal-package.v0.1.json").read_text()
          )
          assert contract["status"] == "PASS"
          assert contract["output"] == "O01_APPROVAL_RENEWAL_CONTRACT_PASS"
          assert contract["mode"] == "SEMI_AUTOMATIC"
          assert contract["automatic_signature"] is False
          assert contract["automatic_expiry_extension"] is False
          assert contract["grace_period_seconds"] == 0
          assert result["status"] == "PASS"
          assert result["output"] == "O01_APPROVAL_RENEWAL_PACKAGE_READY"
          assert result["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert result["execution_authorised"] is False
          assert result["external_request_budget"] == 0
          assert result["human_decisions_required"] == [
              "LEGAL",
              "PRIVACY_DATA_RIGHTS",
          ]
          assert package["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert package["renewal"]["new_typed_decisions_required"] is True
          assert package["renewal"]["automatic_approval"] is False
          assert package["renewal"]["automatic_signature"] is False
          assert package["renewal"]["automatic_expiry_extension"] is False
          assert package["renewal"]["grace_period_seconds"] == 0
          assert package["campaign_effect"]["campaign_status"] == "BLOCKED"
          assert package["campaign_effect"]["execution_authorised"] is False
          assert package["campaign_effect"]["external_request_budget"] == 0
          assert package["campaign_effect"]["source_state"] == "CANDIDATE"
          assert package["campaign_effect"]["product_admitted"] is False
          assert package["campaign_effect"]["public_claim_contribution"] is False
          assert package["campaign_effect"]["public_launch_authorised"] is False
          PY
          ! grep -R -E \
            '"signature"[[:space:]]*:[[:space:]]*"[^\"]+"|sk_(live|test)_|rk_(live|test)_|whsec_' \
            artifacts/o01-renewal

      - name: Emit deduplicated renewal notification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/o01-renewal-comment.md
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/o01-renewal/renewal-result.json").read_text()
          )
          package = json.loads(
              Path("artifacts/o01-renewal/current/renewal-package.v0.1.json").read_text()
          )
          marker = package["notification"]["deduplication_key"]
          print(f"<!-- axignal-o01-renewal:{marker} -->")
          print("## O01 semi-automatic approval renewal")
          print()
          print("```text")
          print(f"head_sha           {result['head_sha']}")
          print(f"change_class       {result['change_class']}")
          print(f"authority_status   {result['authority_status']}")
          print(f"renewal_phase      {result['renewal_phase']}")
          print(f"maximum_expiry     {result['maximum_expiry']}")
          print("execution           BLOCKED")
          print("external budget     0")
          print("human decisions     LEGAL + PRIVACY_DATA_RIGHTS")
          print("```")
          print()
          print("The evidence package and unsigned decision templates were generated automatically. No signature, approval, expiry extension, TED admission or campaign authority was created by the workflow.")
          PY
          marker="$(head -n 1 /tmp/o01-renewal-comment.md)"
          existing="$({
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/issues/103/comments" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
              | head -n 1
          } || true)"
          if [ -z "$existing" ]; then
            gh issue comment 103 --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/o01-renewal-comment.md
          else
            echo "Renewal notification already exists as comment ${existing}."
          fi

      - name: Upload renewal evidence and unsigned templates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: o01-approval-renewal-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-renewal
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on unavailable or changed official terms
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result='artifacts/o01-renewal/renewal-result.json'
          test -f "$result"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", "FAIL"))' "$result")"
          if [ "$status" != 'PASS' ]; then
            cat "$result"
            exit 1
          fi
          change_class="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["change_class"])' "$result")"
          authority_status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["authority_status"])' "$result")"
          case "$change_class" in
            EVIDENCE_UNAVAILABLE|MATERIAL_TERMS_CHANGE)
              echo "Renewal blocked by ${change_class}."
              exit 1
              ;;
          esac
          if [ "$authority_status" = 'EXPIRED' ]; then
            echo 'Renewal blocked because current typed authority is expired.'
            exit 1
          fi
