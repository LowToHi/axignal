name: O01 Campaign Human Authority v0.2

on:
  workflow_dispatch:
    inputs:
      require_authorised:
        description: Fail unless both current human decisions authorise v0.2
        required: true
        type: boolean
        default: false
  issue_comment:
    types: [created, edited]
  pull_request:
    paths:
      - "data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.2.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.2.json"
      - "scripts/verify_gate7_o01_campaign_authority_contract_v0_2.py"
      - ".github/workflows/o01-campaign-authority-v0.2.yml"
  push:
    branches: [main, "agent/**"]
    paths:
      - "data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.2.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.2.json"
      - "scripts/verify_gate7_o01_campaign_authority_contract_v0_2.py"
      - ".github/workflows/o01-campaign-authority-v0.2.yml"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: o01-campaign-authority-v0-2-${{ github.ref }}
  cancel-in-progress: true

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  MANIFEST_PATH: data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.2.json
  ARTIFACT_DIR: artifacts/o01-campaign-authority-v0.2

jobs:
  authority:
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.number == 124 ||
      github.event.issue.number == 125
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact evaluator head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze evaluator target and contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$ARTIFACT_DIR"
          target="$(jq -r '.target.head_sha' "$MANIFEST_PATH")"
          target_tree="$(jq -r '.target.git_tree_sha' "$MANIFEST_PATH")"
          contract="$(jq -r '.authorised_scope.execution_contract_path' "$MANIFEST_PATH")"
          expected="$(jq -r '.authorised_scope.execution_contract_sha256' "$MANIFEST_PATH")"
          test "$(git rev-parse "${target}^{tree}")" = "$target_tree"
          git merge-base --is-ancestor "$target" HEAD
          actual="sha256:$(sha256sum "$contract" | awk '{print $1}')"
          test "$actual" = "$expected"
          printf 'evaluator_head_sha=%s\ntarget_head_sha=%s\nexecution_contract_sha256=%s\n' \
            "$(git rev-parse HEAD)" "$target" "$actual" \
            | tee "$ARTIFACT_DIR/exact-head.txt"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Validate frozen authority implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .
          python -m compileall -q \
            apps/api/src/axignal_api/o01_campaign_authority.py \
            scripts/extract_gate7_o01_campaign_authority.py \
            scripts/verify_gate7_o01_campaign_authority_contract_v0_2.py
          ruff check \
            apps/api/src/axignal_api/o01_campaign_authority.py \
            scripts/extract_gate7_o01_campaign_authority.py \
            scripts/verify_gate7_o01_campaign_authority_contract_v0_2.py
          pytest -q apps/api/tests/test_o01_campaign_authority.py
          python scripts/verify_gate7_o01_campaign_authority_contract_v0_2.py \
            | tee "$ARTIFACT_DIR/contract-result.json"

      - name: Verify retained O01-A official evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(jq -r '.official_evidence.artifact_id' "$MANIFEST_PATH")"
          artifact_digest="$(jq -r '.official_evidence.artifact_digest' "$MANIFEST_PATH")"
          baseline_digest="$(jq -r '.official_evidence.baseline_digest' "$MANIFEST_PATH")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
            > "$ARTIFACT_DIR/baseline-artifact-metadata.json"
          jq -e --arg digest "$artifact_digest" \
            '.expired == false and .digest == $digest' \
            "$ARTIFACT_DIR/baseline-artifact-metadata.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
            > /tmp/o01-v02-baseline.zip
          mkdir -p "$ARTIFACT_DIR/official-baseline"
          unzip -q /tmp/o01-v02-baseline.zip -d "$ARTIFACT_DIR/official-baseline"
          baseline="$(find "$ARTIFACT_DIR/official-baseline" \
            -name 'official-online-baseline.v0.1.json' -type f | head -n 1)"
          test -n "$baseline"
          actual="sha256:$(sha256sum "$baseline" | awk '{print $1}')"
          test "$actual" = "$baseline_digest"

      - name: Evaluate current human decisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/124/comments?per_page=100" \
            --slurp | jq '[.[][]]' > "$ARTIFACT_DIR/legal-comments.json"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/125/comments?per_page=100" \
            --slurp | jq '[.[][]]' > "$ARTIFACT_DIR/privacy-comments.json"
          args=(
            --manifest "$MANIFEST_PATH"
            --legal-comments "$ARTIFACT_DIR/legal-comments.json"
            --privacy-comments "$ARTIFACT_DIR/privacy-comments.json"
            --output-dir "$ARTIFACT_DIR/current"
          )
          if [ "${{ github.event_name }}" = workflow_dispatch ] \
            && [ "${{ inputs.require_authorised }}" = true ]; then
            args+=(--require-authorised)
          fi
          python scripts/extract_gate7_o01_campaign_authority.py "${args[@]}" \
            | tee "$ARTIFACT_DIR/result.json"

      - name: Enforce permanent boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARTIFACT_DIR/current/result.v0.1.json"
          RESULT="$ARTIFACT_DIR/current/result.v0.1.json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT"]).read_text())
          boundary = result["authority_boundary"]
          assert boundary["ted_product_admitted"] is False
          assert boundary["public_claims_authorised"] is False
          assert boundary["public_redistribution_authorised"] is False
          assert boundary["contact_marketing_authorised"] is False
          assert boundary["model_training_authorised"] is False
          assert boundary["bid_submission_authorised"] is False
          assert boundary["public_launch"] == "NO_GO"
          if result["execution_authorised"]:
              assert result["output"] == "O01_CAMPAIGN_AUTHORISED"
              assert result["head_match"] is True
              assert result["manifest_match"] is True
              assert result["signatures_human"] is True
              assert result["expiry_within_evidence"] is True
          else:
              assert result["output"] == "O01_CAMPAIGN_AUTHORITY_BLOCKED"
          PY
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            "$ARTIFACT_DIR"

      - name: Upload v0.2 authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-campaign-authority-v0-2-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-campaign-authority-v0.2
          if-no-files-found: error
          retention-days: 30
