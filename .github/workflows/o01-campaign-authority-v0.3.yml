name: O01 Campaign Human Authority v0.3

on:
  pull_request:
    paths:
      - "data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.3.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.3.delta.json"
      - "scripts/verify_gate7_o01_v0_3_delta_contract.py"
      - "docs/acceptance/O01-B-v0.3-human-authority-request.md"
      - "docs/acceptance/O01-C-v0.3-telephone-field-remediation.md"
      - ".github/workflows/o01-campaign-authority-v0.3.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.3.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.3.delta.json"
      - "scripts/verify_gate7_o01_v0_3_delta_contract.py"
      - "docs/acceptance/O01-B-v0.3-human-authority-request.md"
      - "docs/acceptance/O01-C-v0.3-telephone-field-remediation.md"
      - ".github/workflows/o01-campaign-authority-v0.3.yml"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: o01-campaign-authority-v0-3-${{ github.ref }}
  cancel-in-progress: true

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  MANIFEST_PATH: data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.3.json
  RESULT_DIR: artifacts/o01-campaign-authority-v0.3

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .
      - name: Freeze target and contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$RESULT_DIR"
          target="$(jq -r '.target.head_sha' "$MANIFEST_PATH")"
          target_tree="$(jq -r '.target.git_tree_sha' "$MANIFEST_PATH")"
          base_contract="$(jq -r '.target.base_contract_path' "$MANIFEST_PATH")"
          base_digest="$(jq -r '.target.base_contract_sha256' "$MANIFEST_PATH")"
          delta_contract="$(jq -r '.target.delta_contract_path' "$MANIFEST_PATH")"
          delta_digest="$(jq -r '.target.delta_contract_sha256' "$MANIFEST_PATH")"
          test "$(git rev-parse "${target}^{tree}")" = "$target_tree"
          git merge-base --is-ancestor "$target" HEAD
          test "sha256:$(sha256sum "$base_contract" | awk '{print $1}')" = "$base_digest"
          test "sha256:$(sha256sum "$delta_contract" | awk '{print $1}')" = "$delta_digest"
          test "sha256:$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')" = \
            "sha256:74ed362c8b856d586139062095c57a6d9a8944012bb9429dc4bb121ed6960d6d"
          {
            printf 'evaluator_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'evaluator_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'target_head_sha=%s\n' "$target"
            printf 'target_tree_sha=%s\n' "$target_tree"
            printf 'base_contract_sha256=%s\n' "$base_digest"
            printf 'delta_contract_sha256=%s\n' "$delta_digest"
            printf 'manifest_sha256=%s\n' "sha256:$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')"
          } | tee "$RESULT_DIR/exact-head.txt"
      - name: Validate exact v0.3 delta
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/verify_gate7_o01_v0_3_delta_contract.py \
            scripts/extract_gate7_o01_campaign_authority.py
          ruff check --ignore E501 \
            scripts/verify_gate7_o01_v0_3_delta_contract.py
          ruff check scripts/extract_gate7_o01_campaign_authority.py
          python scripts/verify_gate7_o01_v0_3_delta_contract.py \
            --materialized-output "$RESULT_DIR/materialized-execution-contract.v0.3.json" \
            | tee "$RESULT_DIR/delta-contract-result.json"
      - name: Verify retained official evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(jq -r '.official_evidence.artifact_id' "$MANIFEST_PATH")"
          digest="$(jq -r '.official_evidence.artifact_digest' "$MANIFEST_PATH")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
            > "$RESULT_DIR/official-evidence-artifact.json"
          jq -e --arg digest "$digest" \
            '.expired == false and .digest == $digest' \
            "$RESULT_DIR/official-evidence-artifact.json"
      - name: Verify canonical telephone diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(jq -r '.remediation_evidence.artifact_id' "$MANIFEST_PATH")"
          digest="$(jq -r '.remediation_evidence.artifact_digest' "$MANIFEST_PATH")"
          member_digest="$(jq -r '.remediation_evidence.result_member_sha256' "$MANIFEST_PATH")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
            > "$RESULT_DIR/diagnostic-artifact.json"
          jq -e --arg digest "$digest" \
            '.expired == false and .digest == $digest' \
            "$RESULT_DIR/diagnostic-artifact.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
            > /tmp/o01-v0-3-diagnostic.zip
          mkdir -p "$RESULT_DIR/diagnostic"
          unzip -q /tmp/o01-v0-3-diagnostic.zip -d "$RESULT_DIR/diagnostic"
          result="$(find "$RESULT_DIR/diagnostic" \
            -name 'contact-projection-diagnostic.v0.1.json' -type f | head -n 1)"
          test -n "$result"
          test "sha256:$(sha256sum "$result" | awk '{print $1}')" = "$member_digest"
          jq -e \
            '.classification == "CANONICAL_TELEPHONE_REPLACEMENT_CONFIRMED" and .unsupported_fields == ["buyer-tel"] and .canonical_telephone_field == "organisation-tel-buyer" and .canonical_telephone_field_accepted == true and .corrected_full_projection_accepted == true and .controls_pass == true and .raw_response_retained == false and .contact_values_retained == false and .fabricated_evidence == 0' \
            "$result"
      - name: Evaluate current human decisions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/124/comments?per_page=100" \
            --slurp | jq '[.[][]]' > "$RESULT_DIR/legal-comments.json"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/125/comments?per_page=100" \
            --slurp | jq '[.[][]]' > "$RESULT_DIR/privacy-comments.json"
          python scripts/extract_gate7_o01_campaign_authority.py \
            --manifest "$MANIFEST_PATH" \
            --legal-comments "$RESULT_DIR/legal-comments.json" \
            --privacy-comments "$RESULT_DIR/privacy-comments.json" \
            --output-dir "$RESULT_DIR/current" \
            | tee "$RESULT_DIR/result.json"
      - name: Enforce permanent boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT_DIR/current/result.v0.1.json"
          RESULT="$RESULT_DIR/current/result.v0.1.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RESULT"]).read_text())
          boundary = result["authority_boundary"]
          assert boundary["ted_product_admitted"] is False
          assert boundary["public_claims_authorised"] is False
          assert boundary["public_redistribution_authorised"] is False
          assert boundary["contact_marketing_authorised"] is False
          assert boundary["model_training_authorised"] is False
          assert boundary["bid_submission_authorised"] is False
          assert boundary["public_launch"] == "NO_GO"
          if result["execution_authorised"]:
              assert result["output"] == "O01_CAMPAIGN_AUTHORISED"
              assert result["head_match"] is True
              assert result["manifest_match"] is True
              assert result["signatures_human"] is True
              assert result["expiry_within_evidence"] is True
          else:
              assert result["output"] == "O01_CAMPAIGN_AUTHORITY_BLOCKED"
          PY
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            "$RESULT_DIR"
      - name: Upload v0.3 authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-campaign-authority-v0-3-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-campaign-authority-v0.3
          if-no-files-found: error
          retention-days: 30
