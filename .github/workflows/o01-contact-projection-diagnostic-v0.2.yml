name: O01 Contact Projection Diagnostic v0.2

on:
  pull_request:
    paths:
      - "scripts/diagnose_o01_contact_projection.py"
      - ".github/workflows/o01-contact-projection-diagnostic-v0.2.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "scripts/diagnose_o01_contact_projection.py"
      - ".github/workflows/o01-contact-projection-diagnostic-v0.2.yml"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: o01-contact-projection-diagnostic-v0-2-${{ github.ref }}
  cancel-in-progress: true

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CONTRACT_PATH: data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.2.json
  MANIFEST_PATH: data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.2.json
  RESULT_DIR: artifacts/o01-contact-projection-diagnostic-v0.2

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .
      - name: Freeze diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          test "sha256:$(sha256sum "$CONTRACT_PATH" | awk '{print $1}')" = \
            "sha256:f86672f2925343fccc61ebe0cb1085a470bbb54d062f1f936eed9347854ff3a3"
          test "sha256:$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')" = \
            "sha256:e608b2d464c005aab5efff6f2e9689b7cd29c78941a1f45336eab91b87d58de6"
          mkdir -p "$RESULT_DIR"
          {
            printf 'diagnostic_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'diagnostic_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'contract_sha256=%s\n' "sha256:$(sha256sum "$CONTRACT_PATH" | awk '{print $1}')"
            printf 'manifest_sha256=%s\n' "sha256:$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')"
          } | tee "$RESULT_DIR/exact-head.txt"
      - name: Validate diagnostic implementation
        run: |
          python -m compileall -q scripts/diagnose_o01_contact_projection.py
          ruff check scripts/diagnose_o01_contact_projection.py
      - name: Verify retained official evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id="$(jq -r '.official_evidence.artifact_id' "$MANIFEST_PATH")"
          digest="$(jq -r '.official_evidence.artifact_digest' "$MANIFEST_PATH")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
            > "$RESULT_DIR/official-evidence-artifact.json"
          jq -e --arg digest "$digest" \
            '.expired == false and .digest == $digest' \
            "$RESULT_DIR/official-evidence-artifact.json"
      - name: Materialize current human authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/124/comments?per_page=100" \
            --slurp | jq '[.[][]]' > /tmp/o01-legal-comments.json
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/125/comments?per_page=100" \
            --slurp | jq '[.[][]]' > /tmp/o01-privacy-comments.json
          python scripts/extract_gate7_o01_campaign_authority.py \
            --manifest "$MANIFEST_PATH" \
            --legal-comments /tmp/o01-legal-comments.json \
            --privacy-comments /tmp/o01-privacy-comments.json \
            --output-dir "$RESULT_DIR/current-authority" \
            --require-authorised \
            | tee "$RESULT_DIR/current-authority-result.json"
          jq -e \
            '.execution_authorised == true and .legal == "APPROVED_CURRENT" and .privacy_data_rights == "APPROVED_CURRENT" and .signatures_human == true and .head_match == true and .manifest_match == true' \
            "$RESULT_DIR/current-authority/result.v0.1.json"
      - name: Diagnose contact projection compatibility
        run: |
          python scripts/diagnose_o01_contact_projection.py \
            --contract "$CONTRACT_PATH" \
            --authority-envelope "$RESULT_DIR/current-authority/campaign-authority-envelope.v0.1.json" \
            --output "$RESULT_DIR/contact-projection-diagnostic.v0.1.json" \
            | tee "$RESULT_DIR/console-result.json"
      - name: Enforce diagnostic boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RESULT_DIR/contact-projection-diagnostic.v0.1.json"
          jq -e \
            '.status == "PASS" and .raw_response_retained == false and .contact_values_retained == false and .campaign_evidence_contribution == false and .public_claim_contribution == false and .source_state == "CANDIDATE" and .fabricated_evidence == 0 and .network_requests_used <= .network_requests_maximum' \
            "$RESULT_DIR/contact-projection-diagnostic.v0.1.json"
          ! grep -R -E \
            '([A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}|sk_(live|test)_|rk_(live|test)_|whsec_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' \
            "$RESULT_DIR" -i
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-contact-projection-diagnostic-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-contact-projection-diagnostic-v0.2
          if-no-files-found: error
          retention-days: 30
