name: O01 Domain Contracts and Contact Channels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/contracts/AX-GE2E-G7-O01-T02-domain-contracts.v0.1.json"
      - "apps/api/src/axignal_api/procurement_domain.py"
      - "apps/api/tests/test_procurement_domain_contracts.py"
      - "apps/api/src/axignal_api/deepseek_proposals.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/src/axignal_api/proposal_worker.py"
      - "apps/api/tests/test_deepseek_v4_flash_proposals.py"
      - "scripts/verify_o01_domain_contracts.py"
      - ".github/workflows/o01-domain-contracts.yml"

  workflow_call:
permissions:
  contents: read

concurrency:
  group: o01-domain-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p artifacts/o01-domain-contracts
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee artifacts/o01-domain-contracts/exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install frozen development graph
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Verify implementation quality
        run: |
          python -m compileall -q \
            apps/api/src/axignal_api/procurement_domain.py \
            apps/api/src/axignal_api/deepseek_proposals.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/src/axignal_api/proposal_worker.py \
            apps/api/tests/test_procurement_domain_contracts.py \
            apps/api/tests/test_deepseek_v4_flash_proposals.py \
            scripts/verify_o01_domain_contracts.py
          ruff check \
            apps/api/src/axignal_api/procurement_domain.py \
            apps/api/src/axignal_api/deepseek_proposals.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/src/axignal_api/proposal_worker.py \
            apps/api/tests/test_procurement_domain_contracts.py \
            apps/api/tests/test_deepseek_v4_flash_proposals.py \
            scripts/verify_o01_domain_contracts.py

      - name: Run executable domain and model contracts
        run: |
          pytest \
            apps/api/tests/test_procurement_domain_contracts.py \
            apps/api/tests/test_deepseek_v4_flash_proposals.py

      - name: Verify O01 contractual boundary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_o01_domain_contracts.py \
            | tee artifacts/o01-domain-contracts/domain-contracts.json

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-domain-contracts-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-domain-contracts
          if-no-files-found: error
          retention-days: 30
