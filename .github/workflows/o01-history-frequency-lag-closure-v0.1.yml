name: O01 History Frequency Lag Closure v0.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-closure.v0.1.json"
      - "scripts/verify_gate7_o01_history_frequency_lag_closure.py"
      - ".github/workflows/o01-history-frequency-lag-closure-v0.1.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-closure.v0.1.json"
      - "scripts/verify_gate7_o01_history_frequency_lag_closure.py"
      - ".github/workflows/o01-history-frequency-lag-closure-v0.1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: o01-history-frequency-lag-closure-${{ github.ref }}
  cancel-in-progress: false

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CLOSURE_PATH: data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-closure.v0.1.json
  RESULT_DIR: artifacts/o01-history-frequency-lag-closure-v0.1/current

jobs:
  closure:
    name: Verify durable O01-E closure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact closure head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Retain exact closure provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$RESULT_DIR"
          {
            printf 'head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'closure_sha256=sha256:%s\n' "$(sha256sum "$CLOSURE_PATH" | awk '{print $1}')"
            printf 'ted_network_requests_emitted=0\n'
          } > "$RESULT_DIR/exact-closure-provenance.txt"

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
          check-latest: false

      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check

      - name: Validate closure verifier and record
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/verify_gate7_o01_history_frequency_lag_closure.py
          python -m ruff check \
            scripts/verify_gate7_o01_history_frequency_lag_closure.py
          python scripts/verify_gate7_o01_history_frequency_lag_closure.py \
            --closure "$CLOSURE_PATH" \
            --output "$RESULT_DIR/closure-result.json"
          jq -e \
            '.status == "PASS" and .output == "O01_HISTORY_FREQUENCY_LAG_CLOSURE_PASS" and .phase_closed == true and .measurement_artifact_id == 8840746749 and .repair_artifact_id == 8841114156 and .historical_boundary == "2016-08-02" and .search_presence_ratio == 1 and .package_presence_ratio == 1 and .publication_to_axignal_p95_seconds <= 32430 and .o01_canonical_state == "ACCEPTED" and .o01_claim_decision == "DENIED" and .source_state == "PRODUCT_ADMITTED" and .claim_contribution == false and .gate7_decision == "IN_PROGRESS" and .public_launch == "NO_GO" and .active_request_files == []' \
            "$RESULT_DIR/closure-result.json" >/dev/null

      - name: Revalidate retained artifacts in GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          measurement_id="$(jq -r '.measurement.artifact_id' "$CLOSURE_PATH")"
          measurement_digest="$(jq -r '.measurement.artifact_digest' "$CLOSURE_PATH")"
          repair_id="$(jq -r '.verification_repair.artifact_id' "$CLOSURE_PATH")"
          repair_digest="$(jq -r '.verification_repair.artifact_digest' "$CLOSURE_PATH")"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${measurement_id}" \
            > "$RESULT_DIR/measurement-artifact-metadata.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${repair_id}" \
            > "$RESULT_DIR/repair-artifact-metadata.json"

          jq -e \
            --argjson expected_id "$measurement_id" \
            --arg expected_digest "$measurement_digest" \
            '.id == $expected_id and .expired == false and .digest == $expected_digest and .workflow_run.id == 30771690223 and .workflow_run.head_sha == "134fae19b78693164a797f8938ee2451656a70e4"' \
            "$RESULT_DIR/measurement-artifact-metadata.json" >/dev/null
          jq -e \
            --argjson expected_id "$repair_id" \
            --arg expected_digest "$repair_digest" \
            '.id == $expected_id and .expired == false and .digest == $expected_digest and .workflow_run.id == 30772939221 and .workflow_run.head_sha == "ed84e5ecaad9b89b3f60d8ae1f1a304127582839"' \
            "$RESULT_DIR/repair-artifact-metadata.json" >/dev/null

      - name: Assert closure boundary
        run: |
          set -euo pipefail
          jq -e \
            '.status == "PASS" and .phase_closed == true and .integrity.thresholds_relaxed == false and .integrity.measurement_mutated == false and .integrity.source_files_mutated == false and .integrity.network_replay_for_repair == false and .integrity.one_shot_requests_retired == true and .decision.o01_canonical_state == "ACCEPTED" and .decision.o01_claim_decision == "DENIED" and .decision.source_contributes_to_public_claim == false and .decision.gate7_decision == "IN_PROGRESS" and .decision.public_launch == "NO_GO" and .permanent_boundaries.gate7_closed == false and .permanent_boundaries.public_launch == "NO_GO"' \
            "$CLOSURE_PATH" >/dev/null
          ! find data/acceptance/campaigns -maxdepth 1 -type f \
            \( -name 'AX-LIB-O01-history-frequency-lag-execution-request*.json' \
            -o -name 'AX-LIB-O01-history-frequency-lag-verification-repair-request*.json' \) \
            -print -quit | grep -q .

      - name: Record final closure hashes
        run: |
          set -euo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'ted_network_requests_emitted=0\n'
            sha256sum "$CLOSURE_PATH"
            sha256sum "$RESULT_DIR"/*.json
          } > "$RESULT_DIR/exact-closure-hashes.txt"

      - name: Upload durable O01-E closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-history-frequency-lag-closure-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-history-frequency-lag-closure-v0.1
          if-no-files-found: error
          retention-days: 30
