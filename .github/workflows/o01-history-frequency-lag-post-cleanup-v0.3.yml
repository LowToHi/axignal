name: O01 History Frequency Lag Final Clean-Head Attestation v0.3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/o01-history-frequency-lag-post-cleanup-v0.3.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/o01-history-frequency-lag-post-cleanup-v0.3.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: o01-history-frequency-lag-post-cleanup-v0-3-${{ github.ref }}
  cancel-in-progress: false

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CLOSURE_PATH: data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-closure.v0.1.json
  RESULT_DIR: artifacts/o01-history-frequency-lag-post-cleanup-v0.3/current

jobs:
  attest:
    name: Final clean-head O01-E attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact clean head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact clean boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          test ! -e README_DO_NOT_USE.tmp
          ! find data/acceptance/campaigns -maxdepth 1 -type f \
            \( -name 'AX-LIB-O01-history-frequency-lag-execution-request*.json' \
            -o -name 'AX-LIB-O01-history-frequency-lag-verification-repair-request*.json' \) \
            -print -quit | grep -q .
          mkdir -p "$RESULT_DIR"
          {
            printf 'head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'closure_sha256=sha256:%s\n' "$(sha256sum "$CLOSURE_PATH" | awk '{print $1}')"
            printf 'auxiliary_file_present=false\n'
            printf 'active_one_shot_requests=0\n'
            printf 'ted_network_requests_emitted=0\n'
          } > "$RESULT_DIR/final-clean-head-provenance.txt"

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
          check-latest: false

      - name: Revalidate O01-E closure
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_history_frequency_lag_closure.py \
            --closure "$CLOSURE_PATH" \
            --output "$RESULT_DIR/closure-result.json"
          jq -e \
            '.status == "PASS" and .phase_closed == true and .o01_canonical_state == "ACCEPTED" and .o01_claim_decision == "DENIED" and .source_state == "PRODUCT_ADMITTED" and .claim_contribution == false and .gate7_decision == "IN_PROGRESS" and .public_launch == "NO_GO" and .active_request_files == []' \
            "$RESULT_DIR/closure-result.json" >/dev/null

      - name: Revalidate closure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/8841159119" \
            > "$RESULT_DIR/closure-artifact-metadata.json"
          jq -e \
            '.id == 8841159119 and .expired == false and .digest == "sha256:a25826b5458547d89d6f3a8374a532f1d4e38e5052e7c95da3f59dab991707ea" and .workflow_run.id == 30773064599 and .workflow_run.head_sha == "fc5b3528a9999e75bb3564f2e551c2119df910d5"' \
            "$RESULT_DIR/closure-artifact-metadata.json" >/dev/null

      - name: Record final clean-head hashes
        run: |
          set -euo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'auxiliary_file_present=false\n'
            printf 'active_one_shot_requests=0\n'
            printf 'ted_network_requests_emitted=0\n'
            sha256sum "$CLOSURE_PATH"
            sha256sum "$RESULT_DIR"/*.json
          } > "$RESULT_DIR/final-clean-head-hashes.txt"

      - name: Upload final clean-head attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-history-frequency-lag-final-clean-head-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-history-frequency-lag-post-cleanup-v0.3
          if-no-files-found: error
          retention-days: 30
