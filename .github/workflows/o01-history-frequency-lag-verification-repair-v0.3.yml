name: O01 History Frequency Lag Verification Repair v0.3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-verification-repair-plan.v0.1.json"
      - "data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-verification-repair-request.v0.3.json"
      - "scripts/verify_gate7_o01_retained_evidence_v8.py"
      - "scripts/verify_gate7_o01_retained_evidence_v10.py"
      - "apps/api/tests/test_o01_retained_evidence_verifier.py"
      - "apps/api/tests/test_o01_retained_evidence_schema_adapter.py"
      - ".github/workflows/o01-history-frequency-lag-verification-repair-v0.3.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-verification-repair-plan.v0.1.json"
      - "data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-verification-repair-request.v0.3.json"
      - "scripts/verify_gate7_o01_retained_evidence_v8.py"
      - "scripts/verify_gate7_o01_retained_evidence_v10.py"
      - "apps/api/tests/test_o01_retained_evidence_verifier.py"
      - "apps/api/tests/test_o01_retained_evidence_schema_adapter.py"
      - ".github/workflows/o01-history-frequency-lag-verification-repair-v0.3.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: o01-history-verification-repair-v0-3-${{ github.ref }}
  cancel-in-progress: false

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  AXIGNAL_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  AXIGNAL_SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  PLAN_PATH: data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-verification-repair-plan.v0.1.json
  REQUEST_PATH: data/acceptance/campaigns/AX-LIB-O01-history-frequency-lag-verification-repair-request.v0.3.json
  RESULT_DIR: artifacts/o01-history-frequency-lag-verification-repair-v0.3/current

jobs:
  validate:
    name: Validate schema-aware repair v0.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      execute_repair: ${{ steps.request.outputs.execute }}
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Retain zero-network static provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$RESULT_DIR"
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'ted_network_requests_emitted=0\n'
            printf 'source_artifact_downloads=0\n'
          } > "$RESULT_DIR/static-provenance.txt"

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
          check-latest: false

      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check

      - name: Validate verifier, adapter and repair plan
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/verify_gate7_o01_retained_evidence_v8.py \
            scripts/verify_gate7_o01_retained_evidence_v10.py \
            apps/api/tests/test_o01_retained_evidence_verifier.py \
            apps/api/tests/test_o01_retained_evidence_schema_adapter.py
          python -m ruff check \
            scripts/verify_gate7_o01_retained_evidence_v10.py \
            apps/api/tests/test_o01_retained_evidence_verifier.py \
            apps/api/tests/test_o01_retained_evidence_schema_adapter.py
          python -m pytest -q \
            apps/api/tests/test_o01_retained_evidence_verifier.py \
            apps/api/tests/test_o01_retained_evidence_schema_adapter.py
          python - <<'PY' > "$RESULT_DIR/repair-plan-contract.json"
          import json
          from pathlib import Path
          from verify_gate7_o01_retained_evidence_v8 import verify_plan

          path = Path(
              "data/acceptance/campaigns/"
              "AX-LIB-O01-history-frequency-lag-verification-repair-plan.v0.1.json"
          )
          plan = json.loads(path.read_text(encoding="utf-8"))
          verify_plan(plan)
          print(json.dumps({
              "status": "PASS",
              "output": "O01_HISTORY_VERIFICATION_REPAIR_PLAN_PASS",
              "source_artifact_id": plan["source_campaign"]["artifact_id"],
              "source_artifact_digest": plan["source_campaign"]["artifact_digest"],
              "schema_adapter": "PUBLISHED_HYPHENATED_KEY_TO_INTERNAL_ALIAS",
              "source_files_mutated": False,
              "ted_network_requests_authorised": 0,
              "source_artifact_downloads_authorised": 1,
              "claim_contribution": False,
              "gate7_closed": False,
              "public_launch": "NO_GO",
          }, indent=2, sort_keys=True))
          PY

      - name: Determine exact one-shot repair request
        id: request
        run: |
          set -euo pipefail
          execute=false
          parent_sha="$(git rev-parse HEAD^)"
          parent_tree="$(git show -s --format=%T HEAD^)"
          plan_sha="sha256:$(sha256sum "$PLAN_PATH" | awk '{print $1}')"
          source_id="$(jq -r '.source_campaign.artifact_id' "$PLAN_PATH")"
          source_digest="$(jq -r '.source_campaign.artifact_digest' "$PLAN_PATH")"
          if [[ -f "$REQUEST_PATH" ]]; then
            mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
            test "${#changed[@]}" -eq 1
            test "${changed[0]}" = "$REQUEST_PATH"
            if git cat-file -e "HEAD^:$REQUEST_PATH" 2>/dev/null; then
              echo "Repair request already existed in parent" >&2
              exit 1
            fi
            jq -e \
              --arg parent "$parent_sha" \
              --arg tree "$parent_tree" \
              --arg plan "$plan_sha" \
              --arg branch "$AXIGNAL_SOURCE_BRANCH" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg source_digest "$source_digest" \
              --argjson source_id "$source_id" \
              '.schema_version == "axignal.o01-history-frequency-lag-verification-repair-request/v0.3" and .execute == true and .one_shot == true and .controller_parent_sha == $parent and .controller_parent_tree_sha == $tree and .plan_sha256 == $plan and .source_branch == $branch and .repository == $repository and .source_artifact_id == $source_id and .source_artifact_digest == $source_digest and .source_artifact_downloads == 1 and .ted_network_requests == 0 and .measurement_mutation == false and .source_file_mutation == false and .threshold_relaxation == false and .claim_contribution == false and .gate7_closed == false and .public_launch == "NO_GO"' \
              "$REQUEST_PATH" >/dev/null
            test "$AXIGNAL_SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$AXIGNAL_SOURCE_BRANCH" = "agent/ax-gate7-o01-e-history-frequency-lag"
            execute=true
          fi
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          jq -n \
            --argjson execute "$execute" \
            --arg parent "$parent_sha" \
            --arg parent_tree "$parent_tree" \
            --arg plan "$plan_sha" \
            --arg source_digest "$source_digest" \
            --argjson source_id "$source_id" \
            '{execute_repair: $execute, parent_sha: $parent, parent_tree_sha: $parent_tree, plan_sha256: $plan, source_artifact_id: $source_id, source_artifact_digest: $source_digest, ted_network_requests_before_repair: 0}' \
            > "$RESULT_DIR/execution-selection.json"

      - name: Upload static repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-history-verification-repair-v0-3-static-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-history-frequency-lag-verification-repair-v0.3
          if-no-files-found: error
          retention-days: 30

  repair:
    name: Verify immutable O01-E artifact v0.3
    needs: validate
    if: needs.validate.outputs.execute_repair == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize fail-closed repair provenance
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          {
            printf 'head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'parent_sha=%s\n' "$(git rev-parse HEAD^)"
            printf 'parent_tree_sha=%s\n' "$(git show -s --format=%T HEAD^)"
            printf 'plan_sha256=sha256:%s\n' "$(sha256sum "$PLAN_PATH" | awk '{print $1}')"
            printf 'request_sha256=sha256:%s\n' "$(sha256sum "$REQUEST_PATH" | awk '{print $1}')"
            printf 'stage=PRE_ARTIFACT_PREFLIGHT\n'
            printf 'ted_network_requests_emitted=0\n'
            printf 'source_artifact_downloads=0\n'
          } > "$RESULT_DIR/repair-provenance.txt"

      - name: Revalidate exact repair request
        run: |
          set -euo pipefail
          parent_sha="$(git rev-parse HEAD^)"
          parent_tree="$(git show -s --format=%T HEAD^)"
          plan_sha="sha256:$(sha256sum "$PLAN_PATH" | awk '{print $1}')"
          source_id="$(jq -r '.source_campaign.artifact_id' "$PLAN_PATH")"
          source_digest="$(jq -r '.source_campaign.artifact_digest' "$PLAN_PATH")"
          jq -e \
            --arg parent "$parent_sha" \
            --arg tree "$parent_tree" \
            --arg plan "$plan_sha" \
            --arg source_digest "$source_digest" \
            --argjson source_id "$source_id" \
            '.execute == true and .one_shot == true and .controller_parent_sha == $parent and .controller_parent_tree_sha == $tree and .plan_sha256 == $plan and .source_artifact_id == $source_id and .source_artifact_digest == $source_digest and .source_artifact_downloads == 1 and .ted_network_requests == 0 and .source_file_mutation == false' \
            "$REQUEST_PATH" >/dev/null
          sed -i 's/stage=PRE_ARTIFACT_PREFLIGHT/stage=PRE_ARTIFACT_PREFLIGHT_PASS/' \
            "$RESULT_DIR/repair-provenance.txt"

      - name: Download exact retained campaign artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_id="$(jq -r '.source_campaign.artifact_id' "$PLAN_PATH")"
          expected_digest="$(jq -r '.source_campaign.artifact_digest' "$PLAN_PATH")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_id}" \
            > "$RESULT_DIR/source-artifact-metadata.json"
          jq -e \
            --arg expected_digest "$expected_digest" \
            --argjson source_id "$source_id" \
            '.id == $source_id and .expired == false and .digest == $expected_digest' \
            "$RESULT_DIR/source-artifact-metadata.json" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_id}/zip" \
            > "$RUNNER_TEMP/o01-source-artifact.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/o01-source-artifact.zip" | awk '{print $1}')" = "$expected_digest"
          printf 'source_artifact_downloads=1\n' >> "$RESULT_DIR/repair-provenance.txt"

      - name: Extract source artifact safely
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/o01-source"
          unzip -Z1 "$RUNNER_TEMP/o01-source-artifact.zip" \
            | tee "$RESULT_DIR/source-artifact-members.txt"
          ! grep -E '(^/|(^|/)\.\.(/|$)|\\)' "$RESULT_DIR/source-artifact-members.txt"
          unzip -q "$RUNNER_TEMP/o01-source-artifact.zip" -d "$RUNNER_TEMP/o01-source"
          test -d "$RUNNER_TEMP/o01-source/current"
          test "$(find "$RUNNER_TEMP/o01-source/current" -maxdepth 1 -type f | wc -l)" -eq 15

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
          check-latest: false

      - name: Verify retained evidence with schema adapter
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_retained_evidence_v10.py \
            --plan "$PLAN_PATH" \
            --artifact-metadata "$RESULT_DIR/source-artifact-metadata.json" \
            --evidence-dir "$RUNNER_TEMP/o01-source/current" \
            --output "$RESULT_DIR/verification-repair-result.json"
          jq -e \
            '.status == "PASS" and .output == "O01_HISTORY_FREQUENCY_LAG_RETAINED_EVIDENCE_PASS" and .source_artifact_id == 8840746749 and .source_members_exact == true and .measurement_status == "PASS" and .repair_ted_network_requests == 0 and .calendar_counts == {"2025":252,"2026":254} and .history_boundary == "2016-08-02" and .history_day_before_total == 0 and .search_presence_ratio == 1 and .package_presence_ratio == 1 and .publication_to_axignal_p95_seconds <= 32430 and .o01_metrics_closed == true and .recommended_canonical_state == "ACCEPTED" and .recommended_claim_decision == "DENIED" and .verifier_schema_adapter.published_key == "direct_first-seen-timestamp-claimed" and .verifier_schema_adapter.source_files_mutated == false and .claim_contribution == false and .gate7_closed == false and .public_launch == "NO_GO"' \
            "$RESULT_DIR/verification-repair-result.json" >/dev/null
          ! find "$RESULT_DIR" -type f \( -iname '*.xls' -o -iname '*.xlsx' -o -iname '*.xml' -o -iname '*.gz' -o -iname '*raw*' \) -print -quit | grep -q .

      - name: Record exact repair provenance
        run: |
          set -euo pipefail
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'source_artifact_id=%s\n' "$(jq -r '.source_campaign.artifact_id' "$PLAN_PATH")"
            printf 'source_artifact_digest=%s\n' "$(jq -r '.source_campaign.artifact_digest' "$PLAN_PATH")"
            printf 'source_files_mutated=false\n'
            printf 'ted_network_requests_emitted=0\n'
            sha256sum "$PLAN_PATH"
            sha256sum "$REQUEST_PATH"
            sha256sum "$RESULT_DIR"/*.json
          } > "$RESULT_DIR/exact-repair-provenance.txt"

      - name: Upload retained verification repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-history-frequency-lag-verification-repair-v0-3-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-history-frequency-lag-verification-repair-v0.3
          if-no-files-found: error
          retention-days: 30
