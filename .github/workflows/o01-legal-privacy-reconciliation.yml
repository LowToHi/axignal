name: O01 Legal Privacy Contextual Reconciliation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/o01_contact_policy.py"
      - "apps/api/tests/test_o01_contact_policy.py"
      - "data/acceptance/legal/AX-LIB-O01-TED-contact-policy-reconciliation.v0.2.json"
      - "data/acceptance/approvals/AX-LIB-O01-legal-privacy-approval-request.v0.2.json"
      - "data/contracts/AX-GE2E-G7-O01-T02-domain-contracts.v0.1.json"
      - "scripts/verify_gate7_o01_legal_privacy_reconciliation.py"
      - "scripts/materialize_gate7_o01_approval_manifest.py"
      - ".github/workflows/o01-legal-privacy-reconciliation.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "apps/api/src/axignal_api/o01_contact_policy.py"
      - "apps/api/tests/test_o01_contact_policy.py"
      - "data/acceptance/legal/AX-LIB-O01-TED-contact-policy-reconciliation.v0.2.json"
      - "data/acceptance/approvals/AX-LIB-O01-legal-privacy-approval-request.v0.2.json"
      - "data/contracts/AX-GE2E-G7-O01-T02-domain-contracts.v0.1.json"
      - "scripts/verify_gate7_o01_legal_privacy_reconciliation.py"
      - "scripts/materialize_gate7_o01_approval_manifest.py"
      - ".github/workflows/o01-legal-privacy-reconciliation.yml"

permissions:
  contents: read

concurrency:
  group: o01-legal-privacy-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legal-privacy-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p artifacts/o01-legal-privacy
          {
            printf 'exact_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'git_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee artifacts/o01-legal-privacy/exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install frozen development graph
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Compile and lint reconciliation boundary
        run: |
          python -m compileall -q \
            apps/api/src/axignal_api/o01_contact_policy.py \
            apps/api/tests/test_o01_contact_policy.py \
            scripts/verify_gate7_o01_legal_privacy_reconciliation.py \
            scripts/materialize_gate7_o01_approval_manifest.py
          ruff check \
            apps/api/src/axignal_api/o01_contact_policy.py \
            apps/api/tests/test_o01_contact_policy.py \
            scripts/verify_gate7_o01_legal_privacy_reconciliation.py \
            scripts/materialize_gate7_o01_approval_manifest.py

      - name: Execute contextual contact policy tests
        run: |
          pytest \
            apps/api/tests/test_procurement_domain_contracts.py \
            apps/api/tests/test_o01_contact_policy.py

      - name: Verify legal and privacy reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_legal_privacy_reconciliation.py \
            | tee artifacts/o01-legal-privacy/reconciliation.json

      - name: Materialise exact-head approval manifest
        shell: bash
        run: |
          set -euo pipefail
          AXIGNAL_EXACT_SHA="$AXIGNAL_EXACT_SHA" \
            python scripts/materialize_gate7_o01_approval_manifest.py \
            | tee artifacts/o01-legal-privacy/manifest-result.json

      - name: Enforce authority and campaign boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reconciliation = json.loads(
              Path("artifacts/o01-legal-privacy/reconciliation.json").read_text()
          )
          manifest_result = json.loads(
              Path("artifacts/o01-legal-privacy/manifest-result.json").read_text()
          )
          manifest = json.loads(
              Path("artifacts/o01-legal-privacy/approval-manifest.v0.2.json").read_text()
          )

          assert reconciliation["status"] == "PASS"
          assert reconciliation["output"] == "O01_LEGAL_PRIVACY_RECONCILIATION_PASS"
          assert reconciliation["contact_policy"] == {
              "AMBIGUOUS_PERSONAL": "LINK_ONLY",
              "BLOCKED": "BLOCK",
              "FUNCTIONAL_NON_PERSONAL": "ALLOW",
              "INSTITUTIONAL": "ALLOW",
              "PROFESSIONAL_PERSONAL": "CONTEXTUAL",
          }
          assert reconciliation["legal_decision"] == "MISSING"
          assert reconciliation["privacy_data_rights_decision"] == "MISSING"
          assert reconciliation["campaign_status"] == "BLOCKED"
          assert reconciliation["execution_authorised"] is False
          assert reconciliation["external_request_budget"] == 0
          assert reconciliation["source_state"] == "CANDIDATE"
          assert reconciliation["product_admitted"] is False
          assert reconciliation["public_claim_contribution"] is False

          assert manifest_result["status"] == "PASS"
          assert manifest_result["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert manifest["head_sha"] == os.environ["AXIGNAL_EXACT_SHA"]
          assert manifest["status"] == "READY_FOR_TYPED_DECISIONS"
          assert manifest["legal_decision"] == "MISSING"
          assert manifest["privacy_data_rights_decision"] == "MISSING"
          assert manifest["campaign_status"] == "BLOCKED"
          assert manifest["execution_authorised"] is False
          assert manifest["external_request_budget"] == 0
          assert manifest["source_state"] == "CANDIDATE"
          assert manifest["product_admitted"] is False
          assert manifest["public_claim_contribution"] is False
          assert manifest["public_launch_authorised"] is False
          PY

      - name: Reject secrets and signatures in evidence
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' \
            artifacts/o01-legal-privacy
          ! grep -R -E '"signature"[[:space:]]*:[[:space:]]*"[^\"]+"' \
            artifacts/o01-legal-privacy

      - name: Upload exact-head reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-legal-privacy-reconciliation-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-legal-privacy
          if-no-files-found: error
          retention-days: 30
