name: O01 Quality Coverage and Lag Campaign v0.4

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/gate7_o01_*.py"
      - "apps/api/src/axignal_api/o01_quality_*.py"
      - "apps/api/tests/test_gate7_o01_*.py"
      - "apps/api/tests/test_o01_quality_*.py"
      - "data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.4.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.3.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.4.delta.json"
      - "data/acceptance/campaigns/AX-LIB-O01-real-quality-coverage-lag-execution-request.v0.4.json"
      - "scripts/*gate7_o01*v0_4*"
      - ".github/workflows/o01-quality-coverage-lag-campaign-v0.4.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "apps/api/src/axignal_api/gate7_o01_*.py"
      - "apps/api/src/axignal_api/o01_quality_*.py"
      - "apps/api/tests/test_gate7_o01_*.py"
      - "apps/api/tests/test_o01_quality_*.py"
      - "data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.4.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.3.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-execution-contract.v0.4.delta.json"
      - "data/acceptance/campaigns/AX-LIB-O01-real-quality-coverage-lag-execution-request.v0.4.json"
      - "scripts/*gate7_o01*v0_4*"
      - ".github/workflows/o01-quality-coverage-lag-campaign-v0.4.yml"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: o01-quality-coverage-lag-v0-4-${{ github.ref }}
  cancel-in-progress: false

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  AXIGNAL_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  AXIGNAL_SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  AUTHORITY_MANIFEST: data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.4.json
  REQUEST_PATH: data/acceptance/campaigns/AX-LIB-O01-real-quality-coverage-lag-execution-request.v0.4.json
  PLAN_PATH: artifacts/o01-quality-coverage-lag-v0.4/materialized-plan.v0.4.json
  RESULT_DIR: artifacts/o01-quality-coverage-lag-v0.4/current
  RAW_TMP_DIR: /tmp/axignal-o01-v0-4-raw-responses
  KILL_SWITCH_PATH: /tmp/axignal-o01-v0-4.kill

jobs:
  validate:
    name: Validate frozen O01 v0.4 controller
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      execute_real_campaign: ${{ steps.request.outputs.execute }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .
      - name: Validate exact scope delta and materialized plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$(dirname "$PLAN_PATH")" "$RESULT_DIR"
          python -m compileall -q \
            scripts/materialize_gate7_o01_quality_coverage_lag_plan_v0_4.py \
            scripts/run_gate7_o01_quality_coverage_lag_campaign_v0_4.py \
            scripts/verify_gate7_o01_quality_coverage_lag_contract_v0_4.py \
            scripts/verify_gate7_o01_v0_4_scope_contract.py
          ruff check \
            scripts/materialize_gate7_o01_quality_coverage_lag_plan_v0_4.py \
            scripts/run_gate7_o01_quality_coverage_lag_campaign_v0_4.py \
            scripts/verify_gate7_o01_quality_coverage_lag_contract_v0_4.py \
            scripts/verify_gate7_o01_v0_4_scope_contract.py
          pytest -q \
            apps/api/tests/test_gate7_o01_multilingual.py \
            apps/api/tests/test_gate7_o01_runtime.py \
            apps/api/tests/test_o01_quality_controls.py \
            apps/api/tests/test_o01_quality_campaign.py
          python scripts/verify_gate7_o01_v0_4_scope_contract.py \
            --materialized-output "$RESULT_DIR/materialized-execution-contract.v0.4.json" \
            | tee "$RESULT_DIR/scope-contract-result.json"
          python scripts/materialize_gate7_o01_quality_coverage_lag_plan_v0_4.py \
            --output "$PLAN_PATH" | tee "$RESULT_DIR/plan-materialization-result.json"
          python scripts/verify_gate7_o01_quality_coverage_lag_contract_v0_4.py \
            --plan "$PLAN_PATH" | tee "$RESULT_DIR/plan-contract-result.json"
      - name: Determine whether the exact one-shot request is current
        id: request
        shell: bash
        run: |
          set -euo pipefail
          execute=false
          request_present=false
          request_parent=null
          current_parent="$(git rev-parse HEAD^)"
          if [[ -f "$REQUEST_PATH" ]]; then
            request_present=true
            request_parent="$(jq -r '.controller_parent_sha' "$REQUEST_PATH")"
          fi
          if [[ "$request_present" == true \
             && "$AXIGNAL_SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" \
             && "$AXIGNAL_SOURCE_BRANCH" == "agent/ax-gate7-o01-v04-all-scope-campaign" \
             && "$request_parent" == "$current_parent" ]] \
             && jq -e '.execute == true and .one_shot == true and .source_scope == "ALL"' "$REQUEST_PATH" >/dev/null; then
            execute=true
          fi
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          jq -n \
            --argjson execute "$execute" \
            --arg event "${{ github.event_name }}" \
            --arg source_repository "$AXIGNAL_SOURCE_REPOSITORY" \
            --arg source_branch "$AXIGNAL_SOURCE_BRANCH" \
            --argjson request_present "$request_present" \
            --arg request_parent "$request_parent" \
            --arg current_parent "$current_parent" \
            '{execute_real_campaign: $execute, event: $event, source_repository: $source_repository, source_branch: $source_branch, request_present: $request_present, request_parent: $request_parent, current_parent: $current_parent}' \
            | tee "$RESULT_DIR/execution-selection.json"
      - name: Upload static validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-quality-coverage-lag-v0-4-static-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-quality-coverage-lag-v0.4
          if-no-files-found: error
          retention-days: 30

  real-campaign-v0-4:
    name: Execute one-shot authorised TED campaign v0.4
    needs: validate
    if: needs.validate.outputs.execute_real_campaign == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .
      - name: Execute exact one-shot campaign controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_gate7_o01_campaign_ci_v0_4.sh
      - name: Enforce privacy and permanent authority boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -d "$RAW_TMP_DIR"
          test ! -e "$RESULT_DIR/raw-responses.tar.gz"
          if [ -f "$RESULT_DIR/sanitised-sample-inventory.v0.1.jsonl" ]; then
            ! grep -E '"(buyer-email|buyer-tel|organisation-tel-buyer|buyer-contact-point)"[[:space:]]*:' \
              "$RESULT_DIR/sanitised-sample-inventory.v0.1.jsonl"
          fi
          if [ -f "$RESULT_DIR/notification-ledger.v0.1.jsonl" ]; then
            jq -e -s 'all(.[]; .external_delivery_authorised == false)' \
              "$RESULT_DIR/notification-ledger.v0.1.jsonl"
          fi
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            "$RESULT_DIR" --exclude='raw-responses.cms'
          if [ -f "$RESULT_DIR/final-result.json" ]; then
            jq -e \
              '.authority_boundary.source_state == "CANDIDATE" and .authority_boundary.product_admitted == false and .authority_boundary.public_claims_authorised == false and .authority_boundary.public_redistribution_authorised == false and .authority_boundary.contact_marketing_authorised == false and .authority_boundary.model_training_authorised == false and .authority_boundary.bid_submission_authorised == false and .authority_boundary.public_launch == "NO_GO"' \
              "$RESULT_DIR/final-result.json"
          fi
      - name: Publish campaign summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULT_DIR/final-result.json" ]; then
            {
              echo '## O01-C v0.4 real campaign'
              echo '```json'
              jq '{output, source_scope, sample_count, criteria, thresholds: .thresholds.checks, authority_boundary}' \
                "$RESULT_DIR/final-result.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload retained O01-C v0.4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-quality-coverage-lag-v0-4-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-quality-coverage-lag-v0.4
          if-no-files-found: error
          retention-days: 30
