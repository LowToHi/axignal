name: O01 Quality Coverage and Lag Campaign

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/o01_quality_*.py"
      - "apps/api/tests/test_o01_quality_campaign.py"
      - "data/acceptance/campaigns/AX-LIB-O01-real-quality-coverage-lag-plan.v0.1.json"
      - "data/acceptance/keys/o01-evidence-recipient-cert.pem"
      - "scripts/run_gate7_o01_quality_coverage_lag_campaign.py"
      - "scripts/verify_gate7_o01_quality_coverage_lag_contract.py"
      - "scripts/decrypt_gate7_o01_raw_responses.sh"
      - "docs/runbooks/o01-quality-coverage-lag-campaign.md"
      - ".github/workflows/o01-quality-coverage-lag-campaign.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "apps/api/src/axignal_api/o01_quality_*.py"
      - "apps/api/tests/test_o01_quality_campaign.py"
      - "data/acceptance/campaigns/AX-LIB-O01-real-quality-coverage-lag-plan.v0.1.json"
      - "data/acceptance/keys/o01-evidence-recipient-cert.pem"
      - "scripts/run_gate7_o01_quality_coverage_lag_campaign.py"
      - "scripts/verify_gate7_o01_quality_coverage_lag_contract.py"
      - "scripts/decrypt_gate7_o01_raw_responses.sh"
      - "docs/runbooks/o01-quality-coverage-lag-campaign.md"
      - ".github/workflows/o01-quality-coverage-lag-campaign.yml"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: o01-quality-coverage-lag-${{ github.ref }}
  cancel-in-progress: true

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PLAN_PATH: data/acceptance/campaigns/AX-LIB-O01-real-quality-coverage-lag-plan.v0.1.json
  AUTHORITY_MANIFEST: data/acceptance/approvals/AX-LIB-O01-campaign-authority-manifest.v0.1.json
  RESULT_DIR: artifacts/o01-quality-coverage-lag/current
  RAW_TMP_DIR: /tmp/axignal-o01-raw-responses

jobs:
  real-campaign:
    name: Execute frozen real TED evidence campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Freeze controller, evaluator and campaign target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          mkdir -p "$RESULT_DIR"
          evaluator="$(jq -r '.authority.evaluator_head_sha' "$PLAN_PATH")"
          evaluator_tree="$(jq -r '.authority.evaluator_tree_sha' "$PLAN_PATH")"
          target="$(jq -r '.authority.target_head_sha' "$PLAN_PATH")"
          target_tree="$(jq -r '.authority.target_tree_sha' "$PLAN_PATH")"
          test "$(git rev-parse "${evaluator}^{tree}")" = "$evaluator_tree"
          test "$(git rev-parse "${target}^{tree}")" = "$target_tree"
          git merge-base --is-ancestor "$target" "$evaluator"
          git merge-base --is-ancestor "$evaluator" HEAD
          {
            printf 'controller_head_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'controller_tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'evaluator_head_sha=%s\n' "$evaluator"
            printf 'evaluator_tree_sha=%s\n' "$evaluator_tree"
            printf 'target_head_sha=%s\n' "$target"
            printf 'target_tree_sha=%s\n' "$target_tree"
          } | tee "$RESULT_DIR/exact-head.txt"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"

      - name: Bootstrap exact pip
        run: python -m pip install --upgrade "pip==26.1.2"

      - name: Install frozen development graph
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Validate frozen plan and campaign implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            apps/api/src/axignal_api/o01_quality_*.py \
            apps/api/tests/test_o01_quality_campaign.py \
            scripts/run_gate7_o01_quality_coverage_lag_campaign.py \
            scripts/verify_gate7_o01_quality_coverage_lag_contract.py
          ruff check \
            apps/api/src/axignal_api/o01_quality_*.py \
            apps/api/tests/test_o01_quality_campaign.py \
            scripts/run_gate7_o01_quality_coverage_lag_campaign.py \
            scripts/verify_gate7_o01_quality_coverage_lag_contract.py
          pytest -q apps/api/tests/test_o01_quality_campaign.py
          python scripts/verify_gate7_o01_quality_coverage_lag_contract.py \
            --plan "$PLAN_PATH" \
            | tee "$RESULT_DIR/plan-contract-result.json"

      - name: Verify frozen O01-B authority artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.authority.authority_artifact_id' "$PLAN_PATH")"
          expected_digest="$(jq -r '.authority.authority_artifact_digest' "$PLAN_PATH")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
            > "$RESULT_DIR/authority-artifact-metadata.json"
          jq -e --arg digest "$expected_digest" \
            '.expired == false and .digest == $digest' \
            "$RESULT_DIR/authority-artifact-metadata.json"

      - name: Recover and verify fresh authority-bound official baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_artifact_id="$(jq -r '.official_evidence.artifact_id' "$AUTHORITY_MANIFEST")"
          baseline_artifact_digest="$(jq -r '.official_evidence.artifact_digest' "$AUTHORITY_MANIFEST")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${baseline_artifact_id}" \
            > "$RESULT_DIR/baseline-artifact-metadata.json"
          jq -e --arg digest "$baseline_artifact_digest" \
            '.expired == false and .digest == $digest' \
            "$RESULT_DIR/baseline-artifact-metadata.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${baseline_artifact_id}/zip" \
            > /tmp/o01-authority-baseline.zip
          mkdir -p "$RESULT_DIR/official-baseline"
          unzip -q /tmp/o01-authority-baseline.zip -d "$RESULT_DIR/official-baseline"
          baseline="$(find "$RESULT_DIR/official-baseline" -name 'official-online-baseline.v0.1.json' -type f | head -n 1)"
          test -n "$baseline"
          BASELINE_PATH="$baseline" python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from pathlib import Path

          manifest = json.loads(Path(os.environ["AUTHORITY_MANIFEST"]).read_text())
          baseline_path = Path(os.environ["BASELINE_PATH"])
          baseline = json.loads(baseline_path.read_text())
          evidence = manifest["official_evidence"]
          target = manifest["target"]
          actual_digest = "sha256:" + hashlib.sha256(baseline_path.read_bytes()).hexdigest()
          assert actual_digest == evidence["baseline_digest"]
          assert baseline["baseline_payload_digest"] == evidence["baseline_payload_digest"]
          assert baseline["exact_head_sha"] == target["head_sha"]
          assert baseline["git_tree_sha"] == target["git_tree_sha"]
          assert baseline["official_online_baseline"] == "PRESENT"
          assert baseline["official_terms_available"] is True
          assert baseline["evidence_expiry"] == evidence["evidence_expires_at"]
          assert baseline["generated_at"] == evidence["observed_at"]
          observed_at = datetime.fromisoformat(evidence["observed_at"].replace("Z", "+00:00"))
          evidence_expiry = datetime.fromisoformat(evidence["evidence_expires_at"].replace("Z", "+00:00"))
          now = datetime.now(UTC)
          assert observed_at <= now < evidence_expiry
          assert now - observed_at <= timedelta(hours=24)
          documents = baseline["documents"]
          assert len(documents) == 3
          for document in documents.values():
              assert document["status"] == "PASS"
              assert document["critical_anchors_present"] == document["critical_anchors_expected"]
          result = {
              "status": "PASS",
              "output": "O01_AUTHORITY_BOUND_OFFICIAL_BASELINE_CURRENT",
              "live_recheck_performed": False,
              "baseline_digest": actual_digest,
              "baseline_payload_digest": baseline["baseline_payload_digest"],
              "observed_at": evidence["observed_at"],
              "evidence_expires_at": evidence["evidence_expires_at"],
              "age_limit_hours": 24,
              "documents_verified": len(documents),
              "authority_manifest_reference": "sha256:" + hashlib.sha256(
                  Path(os.environ["AUTHORITY_MANIFEST"]).read_bytes()
              ).hexdigest(),
          }
          Path(os.environ["RESULT_DIR"], "official-baseline-preflight.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Materialize current human authority envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/124/comments?per_page=100" \
            --slurp | jq '[.[][]]' > /tmp/o01-legal-comments.json
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/issues/125/comments?per_page=100" \
            --slurp | jq '[.[][]]' > /tmp/o01-privacy-comments.json
          python scripts/extract_gate7_o01_campaign_authority.py \
            --manifest "$AUTHORITY_MANIFEST" \
            --legal-comments /tmp/o01-legal-comments.json \
            --privacy-comments /tmp/o01-privacy-comments.json \
            --output-dir "$RESULT_DIR/current-authority" \
            --require-authorised \
            | tee "$RESULT_DIR/current-authority-result.json"
          jq -e \
            '.execution_authorised == true and .output == "O01_CAMPAIGN_AUTHORISED" and .legal == "APPROVED_CURRENT" and .privacy_data_rights == "APPROVED_CURRENT" and .head_match == true and .manifest_match == true and .signatures_human == true and .expiry_within_evidence == true' \
            "$RESULT_DIR/current-authority/result.v0.1.json"
          test -f "$RESULT_DIR/current-authority/campaign-authority-envelope.v0.1.json"

      - name: Execute real frozen TED campaign
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RAW_TMP_DIR"
          python scripts/run_gate7_o01_quality_coverage_lag_campaign.py \
            --plan "$PLAN_PATH" \
            --authority-envelope "$RESULT_DIR/current-authority/campaign-authority-envelope.v0.1.json" \
            --raw-dir "$RAW_TMP_DIR" \
            --output-dir "$RESULT_DIR" \
            | tee "$RESULT_DIR/campaign-run-result.json"

      - name: Seal allowlisted raw Search API responses
        shell: bash
        run: |
          set -euo pipefail
          test -d "$RAW_TMP_DIR"
          raw_file_count="$(find "$RAW_TMP_DIR" -type f | wc -l | tr -d ' ')"
          raw_bytes="$(du -sb "$RAW_TMP_DIR" | awk '{print $1}')"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$RAW_TMP_DIR" . | gzip -n > /tmp/o01-raw-responses.tar.gz
          plaintext_sha="sha256:$(sha256sum /tmp/o01-raw-responses.tar.gz | awk '{print $1}')"
          openssl cms -encrypt \
            -binary -aes256 \
            -in /tmp/o01-raw-responses.tar.gz \
            -outform DER \
            -out "$RESULT_DIR/raw-responses.cms" \
            data/acceptance/keys/o01-evidence-recipient-cert.pem
          openssl cms -cmsout \
            -inform DER \
            -in "$RESULT_DIR/raw-responses.cms" \
            -print > /dev/null
          ciphertext_sha="sha256:$(sha256sum "$RESULT_DIR/raw-responses.cms" | awk '{print $1}')"
          fingerprint="$(openssl x509 \
            -in data/acceptance/keys/o01-evidence-recipient-cert.pem \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          RAW_FILE_COUNT="$raw_file_count" \
          RAW_BYTES="$raw_bytes" \
          PLAINTEXT_SHA="$plaintext_sha" \
          CIPHERTEXT_SHA="$ciphertext_sha" \
          FINGERPRINT="$fingerprint" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_dir = Path(os.environ["RESULT_DIR"])
          payload = {
              "status": "SEALED",
              "format": "CMS_ENVELOPED_DATA",
              "content_encryption": "AES-256-CBC",
              "ciphertext_file": "raw-responses.cms",
              "ciphertext_sha256": os.environ["CIPHERTEXT_SHA"],
              "plaintext_archive_sha256": os.environ["PLAINTEXT_SHA"],
              "plaintext_file_count": int(os.environ["RAW_FILE_COUNT"]),
              "plaintext_directory_bytes": int(os.environ["RAW_BYTES"]),
              "plaintext_removed": True,
              "plaintext_uploaded": False,
              "cms_structure_verified": True,
              "recipient_certificate_sha256_fingerprint": os.environ["FINGERPRINT"],
              "contact_values_in_plaintext_projection": False,
              "full_notice_payloads_retrieved": False,
          }
          (result_dir / "raw-retention.v0.1.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm -rf "$RAW_TMP_DIR" /tmp/o01-raw-responses.tar.gz
          test ! -e "$RAW_TMP_DIR"

      - name: Evaluate frozen thresholds and final criteria
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_gate7_o01_quality_coverage_lag_contract.py \
            --plan "$PLAN_PATH" \
            --result-dir "$RESULT_DIR" \
            | tee "$RESULT_DIR/final-result.json"

      - name: Enforce privacy and public-authority boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -d "$RAW_TMP_DIR"
          test ! -e "$RESULT_DIR/raw-responses.tar.gz"
          test ! -e "$RESULT_DIR/raw"
          if [ -f "$RESULT_DIR/sanitised-sample-inventory.v0.1.jsonl" ]; then
            ! grep -E '"(buyer-email|buyer-tel|buyer-contact-point)"[[:space:]]*:' \
              "$RESULT_DIR/sanitised-sample-inventory.v0.1.jsonl"
          fi
          if [ -f "$RESULT_DIR/notification-ledger.v0.1.jsonl" ]; then
            jq -e -s 'all(.[]; .external_delivery_authorised == false)' \
              "$RESULT_DIR/notification-ledger.v0.1.jsonl"
          fi
          ! grep -R -E \
            'sk_(live|test)_|rk_(live|test)_|whsec_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            "$RESULT_DIR" \
            --exclude='raw-responses.cms'
          if [ -f "$RESULT_DIR/final-result.json" ]; then
            jq -e \
              '.authority_boundary.source_state == "CANDIDATE" and .authority_boundary.product_admitted == false and .authority_boundary.public_claims_authorised == false and .authority_boundary.public_redistribution_authorised == false and .authority_boundary.contact_marketing_authorised == false and .authority_boundary.model_training_authorised == false and .authority_boundary.bid_submission_authorised == false and .authority_boundary.public_launch == "NO_GO"' \
              "$RESULT_DIR/final-result.json"
          fi

      - name: Publish campaign summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULT_DIR/final-result.json" ]; then
            {
              echo '## O01-C real quality, coverage and lag campaign'
              echo
              echo '```json'
              jq '{output, sample_count, criteria, thresholds: .thresholds.checks, authority_boundary}' \
                "$RESULT_DIR/final-result.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload retained O01-C evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: o01-quality-coverage-lag-${{ env.AXIGNAL_EXACT_SHA }}
          path: artifacts/o01-quality-coverage-lag
          if-no-files-found: error
          retention-days: 30
