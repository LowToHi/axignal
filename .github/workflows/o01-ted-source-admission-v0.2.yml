name: O01 TED Source Admission v0.2

on:
  pull_request:
    paths:
      - ".github/workflows/o01-ted-source-admission-v0.2.yml"
      - "apps/api/src/axignal_api/o01_source_admission_authority.py"
      - "apps/api/tests/test_o01_source_admission_authority.py"
      - "data/acceptance/campaign-results/AX-LIB-O01-TED-QALAG-ML-CONTROLS-v0.6-r4.json"
      - "data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-contract.v0.2.json"
      - "data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-authority-manifest.v0.2.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-closure.v0.6-r4.json"
      - "schemas/o01-source-admission-authority-manifest.schema.json"
      - "scripts/extract_gate7_o01_source_admission_authority.py"
      - "scripts/sign_gate7_o01_source_admission_decision.py"
      - "scripts/verify_gate7_o01_source_admission_contract_v0_2.py"
  push:
    branches:
      - "agent/ax-gate7-o01-source-admission-v2"
    paths:
      - ".github/workflows/o01-ted-source-admission-v0.2.yml"
      - "apps/api/src/axignal_api/o01_source_admission_authority.py"
      - "apps/api/tests/test_o01_source_admission_authority.py"
      - "data/acceptance/campaign-results/AX-LIB-O01-TED-QALAG-ML-CONTROLS-v0.6-r4.json"
      - "data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-contract.v0.2.json"
      - "data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-authority-manifest.v0.2.json"
      - "data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-closure.v0.6-r4.json"
      - "schemas/o01-source-admission-authority-manifest.schema.json"
      - "scripts/extract_gate7_o01_source_admission_authority.py"
      - "scripts/sign_gate7_o01_source_admission_decision.py"
      - "scripts/verify_gate7_o01_source_admission_contract_v0_2.py"
  workflow_dispatch:
    inputs:
      require_admitted:
        description: Fail unless all seven current human approvals admit TED
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: read

concurrency:
  group: o01-ted-source-admission-v0-2-${{ github.ref }}
  cancel-in-progress: true

env:
  AXIGNAL_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MANIFEST: data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-authority-manifest.v0.2.json
  CONTRACT: data/acceptance/source-admission/AX-LIB-O01-TED-source-admission-contract.v0.2.json
  CLOSURE: data/acceptance/campaigns/AX-LIB-O01-quality-coverage-lag-closure.v0.6-r4.json
  CAMPAIGN_REGISTRY: data/acceptance/campaign-results/AX-LIB-O01-TED-QALAG-ML-CONTROLS-v0.6-r4.json
  RESULT_DIR: artifacts/o01-ted-source-admission-v0.2

jobs:
  validate-and-evaluate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.14
          check-latest: false

      - name: Install frozen development graph
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements/python-dev.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation .

      - name: Assert exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$AXIGNAL_EXACT_SHA"
          git rev-parse 'HEAD^{tree}' | tee exact-tree.txt

      - name: Validate implementation and tests
        env:
          PYTHONPATH: apps/api/src
        run: |
          python -m ruff check \
            apps/api/src/axignal_api/o01_source_admission_authority.py \
            apps/api/tests/test_o01_source_admission_authority.py \
            scripts/extract_gate7_o01_source_admission_authority.py \
            scripts/sign_gate7_o01_source_admission_decision.py \
            scripts/verify_gate7_o01_source_admission_contract_v0_2.py
          python -m pytest -q apps/api/tests/test_o01_source_admission_authority.py
          python -m json.tool "$CONTRACT" >/dev/null
          python -m json.tool "$CAMPAIGN_REGISTRY" >/dev/null
          python -m json.tool schemas/o01-source-admission-authority-manifest.schema.json >/dev/null

      - name: Detect frozen manifest
        id: manifest
        run: |
          mkdir -p "$RESULT_DIR"
          if test -f "$MANIFEST"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"PENDING_MANIFEST","output":"O01_TED_SOURCE_ADMISSION_NOT_EVALUATED","source_state":"CANDIDATE","bounded_claim_contribution":false,"public_launch":"NO_GO"}' > "$RESULT_DIR/result.json"
          fi

      - name: Verify frozen admission contract
        if: steps.manifest.outputs.present == 'true'
        run: |
          python scripts/verify_gate7_o01_source_admission_contract_v0_2.py \
            --manifest "$MANIFEST" \
            --contract "$CONTRACT" \
            --closure "$CLOSURE" \
            | tee "$RESULT_DIR/contract-result.json"

      - name: Evaluate seven human authorities
        if: steps.manifest.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_ADMITTED: ${{ inputs.require_admitted || 'false' }}
        run: |
          args=(
            --manifest "$MANIFEST"
            --closure "$CLOSURE"
            --output "$RESULT_DIR/result.json"
          )
          if test "$REQUIRE_ADMITTED" = "true"; then
            args+=(--require-admitted)
          fi
          python scripts/extract_gate7_o01_source_admission_authority.py "${args[@]}"

      - name: Enforce permanent boundary
        if: steps.manifest.outputs.present == 'true'
        run: |
          jq -e '
            .bounded_claim_contribution == false and
            .global_coverage_claim_authorised == false and
            .public_launch == "NO_GO" and
            .permanent_boundary.public_redistribution_authorised == false and
            .permanent_boundary.contact_marketing_authorised == false and
            .permanent_boundary.model_training_authorised == false and
            .permanent_boundary.bid_submission_authorised == false and
            .permanent_boundary.external_notification_delivery_authorised == false and
            .permanent_boundary.gate7_closed == false
          ' "$RESULT_DIR/result.json"

      - name: Record exact provenance
        run: |
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
            echo "manifest_present=${{ steps.manifest.outputs.present }}"
            if test -f "$MANIFEST"; then sha256sum "$MANIFEST"; fi
            sha256sum "$CONTRACT"
            sha256sum "$CLOSURE"
            sha256sum "$CAMPAIGN_REGISTRY"
          } > "$RESULT_DIR/exact-provenance.txt"

      - name: Upload retained admission evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o01-ted-source-admission-v0-2-${{ env.AXIGNAL_EXACT_SHA }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 30
