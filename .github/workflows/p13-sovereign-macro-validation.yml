name: P13 Sovereign Macro Validation

on:
  pull_request:
    paths:
      - ".github/workflows/p13-sovereign-macro-validation.yml"
      - "data/sovereign-macro/**"
      - "docs/sovereign-macro/**"
      - "schemas/sovereign-macro-strategy-workspace-*.schema.json"
      - "scripts/p13_sovereign_macro_reference.py"
      - "scripts/verify_p13_sovereign_macro_strategy_workspace.py"
      - "scripts/verify_p13_rollback.py"
  push:
    branches:
      - "agent/ax-ge2e-p13-sovereign-macro-strategy-workspace-v1.4"
    paths:
      - ".github/workflows/p13-sovereign-macro-validation.yml"
      - "data/sovereign-macro/**"
      - "docs/sovereign-macro/**"
      - "schemas/sovereign-macro-strategy-workspace-*.schema.json"
      - "scripts/p13_sovereign_macro_reference.py"
      - "scripts/verify_p13_sovereign_macro_strategy_workspace.py"
      - "scripts/verify_p13_rollback.py"

permissions:
  contents: read

jobs:
  validate-p13:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P13 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install "jsonschema>=4,<5"

      - name: Validate P13 Sovereign Macro Library and Strategy Workspace
        run: python scripts/verify_p13_sovereign_macro_strategy_workspace.py

      - name: Rehearse byte-exact P13 rollback to frozen P12
        run: python scripts/verify_p13_rollback.py
