name: P14 Trade Supply Chain Validation

on:
  pull_request:
    paths:
      - ".github/workflows/p14-trade-supply-chain-validation.yml"
      - "data/trade-supply-chain/**"
      - "docs/trade-supply-chain/**"
      - "schemas/trade-supply-chain-workspace-*.schema.json"
      - "scripts/p14_trade_supply_reference.py"
      - "scripts/verify_p14_trade_supply_chain_workspace.py"
      - "scripts/verify_p14_rollback.py"
  push:
    branches:
      - "agent/ax-ge2e-p14-trade-supply-chain-workspace-v1.4"
    paths:
      - ".github/workflows/p14-trade-supply-chain-validation.yml"
      - "data/trade-supply-chain/**"
      - "docs/trade-supply-chain/**"
      - "schemas/trade-supply-chain-workspace-*.schema.json"
      - "scripts/p14_trade_supply_reference.py"
      - "scripts/verify_p14_trade_supply_chain_workspace.py"
      - "scripts/verify_p14_rollback.py"

permissions:
  contents: read

jobs:
  validate-p14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P14 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install "jsonschema>=4,<5"

      - name: Validate P14 Trade and Supply Chain Workspace
        run: python scripts/verify_p14_trade_supply_chain_workspace.py

      - name: Rehearse byte-exact P14 rollback to frozen P13
        run: python scripts/verify_p14_rollback.py
