name: P15 Energy Climate Transition Validation

on:
  pull_request:
    paths:
      - ".github/workflows/p15-energy-climate-transition-validation.yml"
      - "data/energy-climate/**"
      - "docs/energy-climate/**"
      - "schemas/energy-climate-transition-workspace-*.schema.json"
      - "scripts/p15_energy_climate_reference.py"
      - "scripts/verify_p15_energy_climate_transition_workspace.py"
      - "scripts/verify_p15_rollback.py"
  push:
    branches:
      - "agent/ax-ge2e-p15-energy-climate-transition-workspace-v1.4"
    paths:
      - ".github/workflows/p15-energy-climate-transition-validation.yml"
      - "data/energy-climate/**"
      - "docs/energy-climate/**"
      - "schemas/energy-climate-transition-workspace-*.schema.json"
      - "scripts/p15_energy_climate_reference.py"
      - "scripts/verify_p15_energy_climate_transition_workspace.py"
      - "scripts/verify_p15_rollback.py"

permissions:
  contents: read

jobs:
  validate-p15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P15 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install "jsonschema>=4,<5"

      - name: Validate P15 Energy and Climate Transition Workspace
        run: python scripts/verify_p15_energy_climate_transition_workspace.py

      - name: Rehearse byte-exact P15 rollback to frozen P14
        run: python scripts/verify_p15_rollback.py
