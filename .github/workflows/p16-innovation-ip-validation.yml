name: P16 Innovation IP Validation

on:
  push:
    branches:
      - "agent/ax-ge2e-p16-innovation-ip-workspace-v1.4"
    paths:
      - ".github/workflows/p16-innovation-ip-validation.yml"
      - "data/innovation-ip/**"
      - "docs/innovation-ip/**"
      - "schemas/innovation-ip-workspace-*.schema.json"
      - "scripts/p16_innovation_ip_reference.py"
      - "scripts/verify_p16_innovation_ip_workspace.py"
      - "scripts/verify_p16_rollback.py"

  workflow_call:
permissions:
  contents: read

jobs:
  validate-p16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P16 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install "jsonschema>=4,<5"

      - name: Validate P16 Innovation and IP Workspace
        run: python scripts/verify_p16_innovation_ip_workspace.py

      - name: Rehearse byte-exact P16 rollback to frozen P15
        run: python scripts/verify_p16_rollback.py
