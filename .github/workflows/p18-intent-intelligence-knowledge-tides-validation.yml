name: P18 Intent Intelligence and Knowledge Tides Validation

on:
  pull_request:
  push:
    branches:
      - "agent/ax-ge2e-p18-intent-intelligence-knowledge-tides-v1.4"

permissions:
  contents: read

jobs:
  validate-p18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema ruff

      - name: Enforce P18 lint
        run: >-
          ruff check
          scripts/p18_intent_tides_reference.py
          scripts/verify_p18_intent_intelligence_knowledge_tides.py
          scripts/verify_p18_rollback.py

      - name: Compile P18 scripts
        run: >-
          python -m py_compile
          scripts/p18_intent_tides_reference.py
          scripts/verify_p18_intent_intelligence_knowledge_tides.py
          scripts/verify_p18_rollback.py

      - name: Validate P18 intent intelligence and Knowledge Tides
        run: >-
          python
          scripts/verify_p18_intent_intelligence_knowledge_tides.py

      - name: Rehearse byte-exact P18 rollback
        run: python scripts/verify_p18_rollback.py
