name: P19 Scenarios Calibration and Outcomes Validation

on:
  pull_request:
  push:
    branches:
      - "agent/ax-ge2e-p19-scenarios-calibration-outcomes-v1.4"

permissions:
  contents: read

jobs:
  validate-p19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema ruff

      - name: Enforce P19 lint
        run: >-
          ruff check
          scripts/p19_scenarios_reference.py
          scripts/verify_p19_scenarios_calibration_outcomes.py
          scripts/verify_p19_rollback.py

      - name: Compile P19 scripts
        run: >-
          python -m py_compile
          scripts/p19_scenarios_reference.py
          scripts/verify_p19_scenarios_calibration_outcomes.py
          scripts/verify_p19_rollback.py

      - name: Validate P19 scenarios, calibration and outcomes
        run: python scripts/verify_p19_scenarios_calibration_outcomes.py

      - name: Rehearse byte-exact P19 rollback
        run: python scripts/verify_p19_rollback.py
