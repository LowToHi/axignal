name: P20 Enterprise API Private Data Validation

on:
  push:
    branches:
      - "agent/ax-ge2e-p20-enterprise-api-private-data-v1.4"
  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-p20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee p20-enterprise-api-private-data-validation-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p20-enterprise-api-private-data-validation-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: p20-enterprise-api-private-data-validation-exact-head-1.txt
          if-no-files-found: error
          retention-days: 30
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema ruff

      - name: Enforce P20 lint
        run: >-
          ruff check
          scripts/p20_enterprise_reference.py
          scripts/verify_p20_enterprise_api_private_data.py
          scripts/verify_p20_rollback.py
          scripts/verify_p19_rollback.py

      - name: Compile P20 scripts
        run: >-
          python -m py_compile
          scripts/p20_enterprise_reference.py
          scripts/verify_p20_enterprise_api_private_data.py
          scripts/verify_p20_rollback.py
          scripts/verify_p19_rollback.py

      - name: Validate P20 enterprise, API and private data
        run: python scripts/verify_p20_enterprise_api_private_data.py

      - name: Rehearse byte-exact P20 rollback
        run: python scripts/verify_p20_rollback.py
