name: P20 Enterprise API Private Data Validation

on:
  pull_request:
  push:
    branches:
      - "agent/ax-ge2e-p20-enterprise-api-private-data-v1.4"

permissions:
  contents: read

jobs:
  validate-p20:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema ruff

      - name: Enforce P20 lint
        run: >-
          ruff check
          scripts/p20_enterprise_reference.py
          scripts/verify_p20_enterprise_api_private_data.py
          scripts/verify_p20_rollback.py
          scripts/verify_p19_rollback.py

      - name: Compile P20 scripts
        run: >-
          python -m py_compile
          scripts/p20_enterprise_reference.py
          scripts/verify_p20_enterprise_api_private_data.py
          scripts/verify_p20_rollback.py
          scripts/verify_p19_rollback.py

      - name: Validate P20 enterprise, API and private data
        run: python scripts/verify_p20_enterprise_api_private_data.py

      - name: Rehearse byte-exact P20 rollback
        run: python scripts/verify_p20_rollback.py
