name: P21 Commercial Runtime Pricing Stripe Validation

on:
  pull_request:
    paths:
      - "data/commercial/**"
      - "docs/commercial/**"
      - "schemas/commercial-runtime-pricing-stripe-*.json"
      - "scripts/p21_commercial_reference.py"
      - "scripts/verify_p21_commercial_runtime.py"
      - "scripts/verify_p21_rollback.py"
      - "scripts/verify_p20_rollback.py"
      - ".github/workflows/p21-commercial-runtime-pricing-stripe-validation.yml"
  push:
    branches:
      - "agent/ax-ge2e-p21-commercial-runtime-pricing-stripe-v1.4"

permissions:
  contents: read

jobs:
  validate-p21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema ruff
      - name: Enforce P21 lint
        run: |
          ruff check scripts/p21_commercial_reference.py \
            scripts/verify_p21_commercial_runtime.py \
            scripts/verify_p21_rollback.py \
            scripts/verify_p20_rollback.py
      - name: Compile P21 scripts
        run: |
          python -m py_compile scripts/p21_commercial_reference.py \
            scripts/verify_p21_commercial_runtime.py \
            scripts/verify_p21_rollback.py \
            scripts/verify_p20_rollback.py
      - name: Validate P21 commercial runtime
        run: python scripts/verify_p21_commercial_runtime.py
      - name: Rehearse byte-exact P21 rollback
        run: python scripts/verify_p21_rollback.py
