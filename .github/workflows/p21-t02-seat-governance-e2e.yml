name: P21-T02 Seat Governance E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/commercial/seat-governance-runtime.v0.1.json"
      - "docs/commercial/P21-T02-seat-governance-e2e-v0.1.md"
      - "infra/postgres/110-seat-governance.sql"
      - "infra/postgres/Dockerfile"
      - "infra/pilot/compose.seat-test.yaml"
      - "apps/api/src/axignal_api/identity.py"
      - "apps/api/src/axignal_api/seat_*.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_seat_*.py"
      - "apps/web/app/api/organisation/seats/**"
      - "apps/web/app/accept-invitation/**"
      - "apps/web/components/accept-invitation-client.tsx"
      - "apps/web/components/seat-governance-bridge*"
      - "apps/web/lib/seat-server.ts"
      - "apps/web/lib/server-auth.ts"
      - "apps/web/app/page.tsx"
      - "scripts/verify_p21_t02_seat_governance.py"
      - "scripts/verify_seat_governance_e2e.py"
      - "tests/e2e/seat-governance.spec.ts"
      - ".github/workflows/p21-t02-seat-governance-e2e.yml"

  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: p21-t02-seat-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seat-governance:
    name: Pricing, seats, members, roles, security and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AXIGNAL_PILOT_ENV_FILE: /tmp/axignal-seat-governance-ci.env
      AXIGNAL_PILOT_COMPOSE_FILE: infra/pilot/compose.yaml
      AXIGNAL_PILOT_COMPOSE_EDGE_FILE: infra/pilot/remote/compose.shared-traefik.yaml
      AXIGNAL_BILLING_TEST_COMPOSE_FILE: infra/pilot/compose.billing-test.yaml
      AXIGNAL_SEAT_TEST_COMPOSE_FILE: infra/pilot/compose.seat-test.yaml
      AXIGNAL_PLAYWRIGHT_EXTERNAL_SERVER: "true"
      AXIGNAL_PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee p21-exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Install frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify seat contract
        run: python scripts/verify_p21_t02_seat_governance.py

      - name: Enforce focused lint and API tests
        run: |
          ruff check \
            apps/api/src/axignal_api/identity.py \
            apps/api/src/axignal_api/seat_config.py \
            apps/api/src/axignal_api/seat_delivery.py \
            apps/api/src/axignal_api/seat_repository.py \
            apps/api/src/axignal_api/seat_routes.py \
            apps/api/src/axignal_api/application.py \
            apps/api/tests/test_seat_delivery.py \
            apps/api/tests/test_seat_routes.py \
            scripts/verify_p21_t02_seat_governance.py \
            scripts/verify_seat_governance_e2e.py
          pytest \
            apps/api/tests/test_seat_delivery.py \
            apps/api/tests/test_seat_routes.py

      - name: Typecheck and build real product shell
        run: |
          pnpm typecheck
          pnpm build

      - name: Create isolated seat-governance environment
        shell: bash
        run: |
          cat > "$AXIGNAL_PILOT_ENV_FILE" <<'ENV'
          AXIGNAL_BUILD_SHA=${{ env.AXIGNAL_EXACT_SHA }}
          AXIGNAL_PILOT_SITE_ADDRESS=:80
          AXIGNAL_PILOT_CADDY_SITE_ADDRESS=:80
          AXIGNAL_PILOT_EDGE_MODE=shared-traefik
          AXIGNAL_PILOT_BIND_ADDRESS=127.0.0.1
          AXIGNAL_PILOT_HTTP_PORT=18080
          AXIGNAL_PILOT_HTTPS_PORT=18443
          AXIGNAL_POSTGRES_DB=axignal
          AXIGNAL_POSTGRES_USER=axignal
          AXIGNAL_POSTGRES_PASSWORD=ci-admin-password-not-for-deployment
          AXIGNAL_PROPOSAL_DB_PASSWORD=ci-proposal-password-not-for-deployment
          AXIGNAL_ADMISSION_DB_PASSWORD=ci-admission-password-not-for-deployment
          AXIGNAL_HUMAN_REVIEW_DB_PASSWORD=ci-review-password-not-for-deployment
          AXIGNAL_VALIDATION_DB_PASSWORD=ci-validation-password-not-for-deployment
          AXIGNAL_VALIDATION_ANALYST_DB_PASSWORD=ci-analyst-password-not-for-deployment
          AXIGNAL_SCHEDULER_DB_PASSWORD=ci-scheduler-password-not-for-deployment
          AXIGNAL_AUTH_EMAIL=pilot@example.test
          AXIGNAL_AUTH_SUBJECT=usr_pilot_ci
          AXIGNAL_AUTH_TENANT_ID=11111111-1111-4111-8111-111111111111
          AXIGNAL_AUTH_PASSWORD_SCRYPT='scrypt$00112233445566778899aabbccddeeff$c90f8bf5f5c77a981b682204633909aba0e58fe328cb71c9c357399c5ca92ea4a088a494b462b96f17efb7360ac400648f893f36fa31d4ec996236784dcbee94'
          AXIGNAL_SESSION_SECRET=ci-session-secret-with-at-least-32-bytes
          AXIGNAL_AXENT_ENCRYPTION_KEY=ci-axent-encryption-key-not-for-deployment-32-bytes
          AXIGNAL_IDENTITY_ASSERTION_SECRET=ci-identity-secret-with-at-least-32-bytes
          AXIGNAL_VALIDATION_PARTICIPANT_SALT=ci-participant-salt-with-at-least-32-bytes
          AXIGNAL_OTEL_ENABLED=false
          ENV

      - name: Start billing and seat topology
        shell: bash
        run: |
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            -f "$AXIGNAL_SEAT_TEST_COMPOSE_FILE" config >/dev/null
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            -f "$AXIGNAL_SEAT_TEST_COMPOSE_FILE" \
            up --build --detach --wait
          curl --fail --silent http://127.0.0.1:18080/api/health \
            | tee p21-web-health.json >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path("p21-web-health.json").read_text())
          assert health["buildSha"] == os.environ["AXIGNAL_EXACT_SHA"], health
          PY

      - name: Execute database seat-governance E2E
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          compose=(
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE"
            -f "$AXIGNAL_PILOT_COMPOSE_FILE"
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE"
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE"
            -f "$AXIGNAL_SEAT_TEST_COMPOSE_FILE"
          )
          set +e
          "${compose[@]}" exec -T api sh -c '
            rm -rf /tmp/seat-evidence
            mkdir -p /tmp/seat-evidence
            cat > /tmp/verify-seat-governance-e2e.py
            AXIGNAL_SEAT_EVIDENCE_DIR=/tmp/seat-evidence \
              python /tmp/verify-seat-governance-e2e.py
          ' < scripts/verify_seat_governance_e2e.py \
            2>&1 | tee artifacts/seat-governance-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            "${compose[@]}" cp \
              api:/tmp/seat-evidence/seat-governance-e2e.json \
              artifacts/seat-governance-e2e.json
          fi
          exit "$status"

      - name: Execute browser seat lifecycle
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test \
            tests/e2e/seat-governance.spec.ts \
            --project=chromium-desktop

      - name: Verify evidence boundary
        shell: bash
        run: |
          ! grep -R -E 'sk_(live|test)_|rk_(live|test)_|whsec_|smtp_password|raw_invitation_token' artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path("artifacts/seat-governance-e2e.json").read_text())
          assert evidence["status"] == "PASS"
          assert evidence["professional_fourth_seat"] == "BLOCKED"
          assert evidence["team_sixteenth_seat"] == "BLOCKED_CONCURRENTLY"
          assert evidence["concurrent_last_seat_successes"] == 1
          assert evidence["downgrade_over_capacity"] == "BLOCKED"
          assert evidence["last_owner_revocation"] == "BLOCKED"
          assert evidence["cross_tenant_visibility"] == "BLOCKED_BY_RLS"
          assert evidence["external_stripe_calls"] == 0
          assert evidence["commercial_activation_authorised"] is False
          PY

      - name: Upload seat-governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seat-governance-e2e-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            p21-exact-head.txt
            p21-web-health.json
            artifacts/seat-governance-e2e.json
            artifacts/seat-governance-e2e.log
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            -f "$AXIGNAL_SEAT_TEST_COMPOSE_FILE" logs --no-color

      - name: Stop disposable services
        if: always()
        run: |
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            -f "$AXIGNAL_BILLING_TEST_COMPOSE_FILE" \
            -f "$AXIGNAL_SEAT_TEST_COMPOSE_FILE" down -v
