name: P23 Final UX Landing Copy and Marketing Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/experience/**"
      - "docs/experience/**"
      - "scripts/p23_experience_reference.py"
      - "scripts/verify_p23_final_ux_landing_copy_marketing.py"
      - ".github/workflows/p23-final-ux-landing-copy-marketing-validation.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "data/experience/**"
      - "docs/experience/**"
      - "scripts/p23_experience_reference.py"
      - "scripts/verify_p23_final_ux_landing_copy_marketing.py"
      - ".github/workflows/p23-final-ux-landing-copy-marketing-validation.yml"

permissions:
  contents: read

concurrency:
  group: p23-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compile bounded reference and verifier
        run: python -m py_compile scripts/p23_experience_reference.py scripts/verify_p23_final_ux_landing_copy_marketing.py
      - name: Validate P23 contract
        run: python scripts/verify_p23_final_ux_landing_copy_marketing.py | tee p23-experience-evidence.json
      - name: Reject premature publication and misleading copy
        run: |
          ! grep -R '"public_site_authorised": true' data/experience
          ! grep -R '"public_campaigns_authorised": true' data/experience
          ! grep -R '"paid_media_authorised": true' data/experience
          ! grep -R -i -E 'guaranteed truth|zero hallucinations|100 percent accurate|replace your analysts' data/experience docs/experience
      - name: Reject live secrets
        run: '! grep -R -E "(sk_live_|rk_live_|whsec_[A-Za-z0-9]{20,})" data/experience docs/experience scripts/p23_experience_reference.py scripts/verify_p23_final_ux_landing_copy_marketing.py'
      - name: Upload non-sensitive evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p23-final-ux-landing-copy-marketing-${{ github.sha }}
          path: p23-experience-evidence.json
          if-no-files-found: error
          retention-days: 30
