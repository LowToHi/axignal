name: P23-T02 Message Copy Validation E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/landing/**"
      - "data/experience/message-copy-validation-e2e-runtime.v0.1.json"
      - "data/experience/b2g-landing-copy-e2e-runtime.v0.1.json"
      - "data/commercial/commercial-runtime-pricing-stripe-runtime.v0.1.json"
      - "docs/experience/P23-T02-message-copy-validation-e2e-v0.1.md"
      - "docs/experience/P23-T03-b2g-landing-copy-e2e-v0.1.md"
      - "scripts/verify_p23_t02_message_copy_validation_e2e.py"
      - "scripts/verify_p23_t03_b2g_landing_copy_e2e.py"
      - "tests/landing/**"
      - "playwright.landing.config.ts"
      - ".github/workflows/p23-t02-message-copy-validation-e2e.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "apps/landing/**"
      - "data/experience/message-copy-validation-e2e-runtime.v0.1.json"
      - "data/experience/b2g-landing-copy-e2e-runtime.v0.1.json"
      - "data/commercial/commercial-runtime-pricing-stripe-runtime.v0.1.json"
      - "docs/experience/P23-T02-message-copy-validation-e2e-v0.1.md"
      - "docs/experience/P23-T03-b2g-landing-copy-e2e-v0.1.md"
      - "scripts/verify_p23_t02_message_copy_validation_e2e.py"
      - "scripts/verify_p23_t03_b2g_landing_copy_e2e.py"
      - "tests/landing/**"
      - "playwright.landing.config.ts"
      - ".github/workflows/p23-t02-message-copy-validation-e2e.yml"

permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: p23-t02-message-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Historical message contract and active landing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee p23-t02-message-copy-validation-e2e-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p23-t02-message-copy-validation-e2e-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: p23-t02-message-copy-validation-e2e-exact-head-1.txt
          if-no-files-found: error
          retention-days: 30
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify historical contract and B2G supersession
        run: |
          python -m json.tool data/experience/message-copy-validation-e2e-runtime.v0.1.json >/dev/null
          python -m json.tool data/experience/b2g-landing-copy-e2e-runtime.v0.1.json >/dev/null
          python -m py_compile scripts/verify_p23_t02_message_copy_validation_e2e.py
          python scripts/verify_p23_t02_message_copy_validation_e2e.py \
            | tee p23-t02-message-copy-evidence.json
      - name: Typecheck real landing
        run: pnpm --filter @axignal/landing typecheck
      - name: Build real landing
        run: pnpm --filter @axignal/landing build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Execute desktop and mobile landing E2E
        run: pnpm exec playwright test --config=playwright.landing.config.ts
      - name: Upload non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p23-t02-message-copy-e2e-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            p23-t02-message-copy-evidence.json
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30
