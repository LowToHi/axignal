name: P23-T03 B2G Landing Copy E2E

on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: p23-t03-b2g-landing-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: B2G landing, trial, pricing and intake
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee p23-t03-b2g-landing-copy-e2e-exact-head.txt

      - name: Upload exact-head identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p23-t03-b2g-landing-copy-e2e-exact-head-${{ env.AXIGNAL_EXACT_SHA }}
          path: p23-t03-b2g-landing-copy-e2e-exact-head.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical B2G authority and historical succession
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/experience/b2g-landing-copy-e2e-runtime.v0.1.json >/dev/null
          python -m json.tool data/experience/message-copy-validation-e2e-runtime.v0.1.json >/dev/null
          python -m py_compile \
            scripts/verify_p23_t03_b2g_landing_copy_e2e.py \
            scripts/verify_p23_t02_message_copy_validation_e2e.py
          python scripts/verify_p23_t03_b2g_landing_copy_e2e.py \
            | tee p23-t03-b2g-landing-evidence.json
          python scripts/verify_p23_t02_message_copy_validation_e2e.py \
            | tee p23-t02-supersession-evidence.json
          python scripts/verify_landing_implementation.py \
            | tee landing-canonical-implementation-evidence.json

      - name: Typecheck real landing
        run: pnpm --filter @axignal/landing typecheck

      - name: Build real landing
        run: pnpm --filter @axignal/landing build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start exact production build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @axignal/landing start > p23-t03-landing-server.log 2>&1 &
          echo $! > p23-t03-landing-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat p23-t03-landing-server.log
          exit 1

      - name: Execute canonical desktop mobile and reduced-motion E2E
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --config=tests/landing/playwright.config.ts \
            2>&1 | tee p23-t03-browser.log

      - name: Emit P23-T03 markers
        if: success()
        shell: bash
        run: |
          {
            echo P23_T03_CANONICAL_B2G_MESSAGE_PASS
            echo P23_T03_PRICE_BOOK_RECONCILIATION_PASS
            echo P23_T03_CONTROLLED_TRIAL_INTAKE_PASS
            echo P23_T03_DESKTOP_MOBILE_REDUCED_MOTION_PASS
          } | tee p23-t03-markers.txt

      - name: Upload non-sensitive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p23-t03-b2g-landing-e2e-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            p23-t03-b2g-landing-evidence.json
            p23-t02-supersession-evidence.json
            landing-canonical-implementation-evidence.json
            p23-t03-browser.log
            p23-t03-markers.txt
            p23-t03-landing-server.log
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
