name: P24 Global Acceptance Paid Evidence and Launch Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/acceptance/**"
      - "docs/acceptance/**"
      - "scripts/p24_acceptance_reference.py"
      - "scripts/verify_p24_global_acceptance_paid_evidence_launch.py"
      - ".github/workflows/p24-global-acceptance-paid-evidence-launch-validation.yml"
  push:
    branches: ["agent/**"]
    paths:
      - "data/acceptance/**"
      - "docs/acceptance/**"
      - "scripts/p24_acceptance_reference.py"
      - "scripts/verify_p24_global_acceptance_paid_evidence_launch.py"
      - ".github/workflows/p24-global-acceptance-paid-evidence-launch-validation.yml"

permissions:
  contents: read

concurrency:
  group: p24-global-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Compile bounded reference and verifier
        run: |
          python -m py_compile \
            scripts/p24_acceptance_reference.py \
            scripts/verify_p24_global_acceptance_paid_evidence_launch.py

      - name: Validate JSON artifacts
        run: |
          python -m json.tool data/acceptance/global-acceptance-paid-evidence-launch-runtime.v0.1.json >/dev/null
          python -m json.tool data/acceptance/p24-evidence-manifest-template.v0.1.json >/dev/null
          python -m json.tool data/acceptance/p24-conformance-fixtures.v0.1.json >/dev/null
          python -m json.tool data/acceptance/p24-adversarial-cases.v0.1.json >/dev/null

      - name: Validate P24 contract
        run: |
          python scripts/verify_p24_global_acceptance_paid_evidence_launch.py \
            | tee p24-global-acceptance-evidence.json

      - name: Reject secrets and premature activation
        run: |
          ! grep -R -E '(sk_live_|rk_live_|whsec_[A-Za-z0-9]{20,})' \
            data/acceptance docs/acceptance \
            scripts/p24_acceptance_reference.py \
            scripts/verify_p24_global_acceptance_paid_evidence_launch.py
          ! grep -R '"global_acceptance_authorised": true' data/acceptance
          ! grep -R '"controlled_live_pilot_authorised": true' data/acceptance
          ! grep -R '"public_launch_authorised": true' data/acceptance
          ! grep -R '"general_availability_authorised": true' data/acceptance
          ! grep -R '"stripe_live_authorised": true' data/acceptance
          ! grep -R '"paid_media_authorised": true' data/acceptance

      - name: Enforce evidence template boundary
        run: |
          grep -q '"status": "TEMPLATE_NOT_EVIDENCE"' data/acceptance/p24-evidence-manifest-template.v0.1.json
          grep -q '"launch_decision": "NO_GO"' data/acceptance/p24-evidence-manifest-template.v0.1.json
          grep -q '"real_paid_evidence": "MISSING"' p24-global-acceptance-evidence.json

      - name: Upload non-sensitive engineering evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p24-global-acceptance-${{ github.sha }}
          path: p24-global-acceptance-evidence.json
          if-no-files-found: error
          retention-days: 30
