name: P25-T01 Identity Passwordless and Trial Abuse E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/security/identity-passwordless-trial-abuse-runtime.v0.1.json"
      - "docs/security/P25-T01-identity-passwordless-trial-abuse-e2e-v0.1.md"
      - "infra/postgres/12*-identity-*.sql"
      - "infra/postgres/123-trial-abuse-runtime.sql"
      - "infra/postgres/Dockerfile"
      - "infra/pilot/compose.identity-test.yaml"
      - "apps/api/src/axignal_api/identity*.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/test_identity*.py"
      - "apps/web/app/api/identity/**"
      - "apps/web/app/verify-email/**"
      - "apps/web/components/auth-gate.tsx"
      - "apps/web/lib/identity-server.ts"
      - "apps/web/lib/server-auth.ts"
      - "apps/web/types/webauthn-json.d.ts"
      - "apps/web/app/page.tsx"
      - "scripts/verify_p25_t01_identity_trial_abuse.py"
      - "scripts/verify_identity_trial_abuse_e2e.py"
      - "tests/e2e/identity-passwordless.spec.ts"
      - "pyproject.toml"
      - ".github/workflows/p25-t01-identity-trial-abuse-e2e.yml"

  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: p25-t01-identity-trial-abuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-trial-abuse:
    name: Identity, passkeys, sessions, abuse and trial economics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AXIGNAL_PILOT_ENV_FILE: /tmp/axignal-p25-identity-ci.env
      AXIGNAL_PILOT_COMPOSE_FILE: infra/pilot/compose.yaml
      AXIGNAL_PILOT_COMPOSE_EDGE_FILE: infra/pilot/remote/compose.shared-traefik.yaml
      AXIGNAL_IDENTITY_TEST_COMPOSE_FILE: infra/pilot/compose.identity-test.yaml
      AXIGNAL_PLAYWRIGHT_EXTERNAL_SERVER: "true"
      AXIGNAL_PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee p25-exact-head.txt

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Install frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify P25 contract
        run: python scripts/verify_p25_t01_identity_trial_abuse.py

      - name: Enforce focused lint and API tests
        run: |
          ruff check \
            apps/api/src/axignal_api/identity.py \
            apps/api/src/axignal_api/identity_config.py \
            apps/api/src/axignal_api/identity_delivery.py \
            apps/api/src/axignal_api/identity_entitlement_routes.py \
            apps/api/src/axignal_api/identity_repository.py \
            apps/api/src/axignal_api/identity_risk.py \
            apps/api/src/axignal_api/identity_routes.py \
            apps/api/src/axignal_api/application.py \
            apps/api/tests/test_identity_risk.py \
            scripts/verify_p25_t01_identity_trial_abuse.py \
            scripts/verify_identity_trial_abuse_e2e.py
          pytest apps/api/tests/test_identity_risk.py

      - name: Typecheck and build real product shell
        run: |
          pnpm typecheck
          pnpm build

      - name: Create isolated identity environment
        shell: bash
        run: |
          cat > "$AXIGNAL_PILOT_ENV_FILE" <<'ENV'
          AXIGNAL_BUILD_SHA=${{ env.AXIGNAL_EXACT_SHA }}
          AXIGNAL_PILOT_SITE_ADDRESS=:80
          AXIGNAL_PILOT_CADDY_SITE_ADDRESS=:80
          AXIGNAL_PILOT_EDGE_MODE=shared-traefik
          AXIGNAL_PILOT_BIND_ADDRESS=127.0.0.1
          AXIGNAL_PILOT_HTTP_PORT=18080
          AXIGNAL_PILOT_HTTPS_PORT=18443
          AXIGNAL_POSTGRES_DB=axignal
          AXIGNAL_POSTGRES_USER=axignal
          AXIGNAL_POSTGRES_PASSWORD=ci-admin-password-not-for-deployment
          AXIGNAL_PROPOSAL_DB_PASSWORD=ci-proposal-password-not-for-deployment
          AXIGNAL_ADMISSION_DB_PASSWORD=ci-admission-password-not-for-deployment
          AXIGNAL_HUMAN_REVIEW_DB_PASSWORD=ci-review-password-not-for-deployment
          AXIGNAL_VALIDATION_DB_PASSWORD=ci-validation-password-not-for-deployment
          AXIGNAL_VALIDATION_ANALYST_DB_PASSWORD=ci-analyst-password-not-for-deployment
          AXIGNAL_SCHEDULER_DB_PASSWORD=ci-scheduler-password-not-for-deployment
          AXIGNAL_AUTH_EMAIL=pilot@example.test
          AXIGNAL_AUTH_SUBJECT=usr_pilot_ci
          AXIGNAL_AUTH_TENANT_ID=11111111-1111-4111-8111-111111111111
          AXIGNAL_AUTH_PASSWORD_SCRYPT='scrypt$00112233445566778899aabbccddeeff$c90f8bf5f5c77a981b682204633909aba0e58fe328cb71c9c357399c5ca92ea4a088a494b462b96f17efb7360ac400648f893f36fa31d4ec996236784dcbee94'
          AXIGNAL_SESSION_SECRET=ci-session-secret-with-at-least-32-bytes
          AXIGNAL_IDENTITY_ASSERTION_SECRET=ci-identity-secret-with-at-least-32-bytes
          AXIGNAL_IDENTITY_HMAC_PEPPER=ci-identity-hmac-pepper-with-at-least-48-bytes-123456
          AXIGNAL_VALIDATION_PARTICIPANT_SALT=ci-participant-salt-with-at-least-32-bytes
          AXIGNAL_OTEL_ENABLED=false
          ENV

      - name: Start passwordless identity topology
        shell: bash
        run: |
          compose=(
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE"
            -f "$AXIGNAL_PILOT_COMPOSE_FILE"
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE"
            -f "$AXIGNAL_IDENTITY_TEST_COMPOSE_FILE"
          )
          "${compose[@]}" config >/dev/null
          "${compose[@]}" up --build --detach --wait
          curl --fail --silent http://127.0.0.1:18080/api/health \
            | tee p25-web-health.json >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path("p25-web-health.json").read_text())
          assert health["buildSha"] == os.environ["AXIGNAL_EXACT_SHA"], health
          PY

      - name: Execute identity and trial-abuse database E2E
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          compose=(
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE"
            -f "$AXIGNAL_PILOT_COMPOSE_FILE"
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE"
            -f "$AXIGNAL_IDENTITY_TEST_COMPOSE_FILE"
          )
          set +e
          "${compose[@]}" exec -T api sh -c '
            rm -rf /tmp/p25-evidence
            mkdir -p /tmp/p25-evidence
            cat > /tmp/verify-identity-trial-abuse-e2e.py
            AXIGNAL_IDENTITY_EVIDENCE_DIR=/tmp/p25-evidence \
              python /tmp/verify-identity-trial-abuse-e2e.py
          ' < scripts/verify_identity_trial_abuse_e2e.py \
            2>&1 | tee artifacts/identity-trial-abuse-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            "${compose[@]}" cp \
              api:/tmp/p25-evidence/identity-trial-abuse-e2e.json \
              artifacts/identity-trial-abuse-e2e.json
          fi
          exit "$status"

      - name: Execute real WebAuthn browser lifecycle
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test \
            tests/e2e/identity-passwordless.spec.ts \
            --project=chromium-desktop

      - name: Verify evidence boundary
        shell: bash
        run: |
          ! grep -R -E 'sk_(live|test)_|rk_(live|test)_|whsec_|smtp_password|raw_ip|raw_installation|session_[A-Za-z0-9_-]{40,}' artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/identity-trial-abuse-e2e.json").read_text())
          assert evidence["status"] == "PASS"
          assert evidence["strong_alias_reuse"] == "REUSE_EXISTING_TRIAL"
          assert evidence["trial_grant_count_after_alias"] == 1
          assert evidence["weak_installation_signal"] == "STEP_UP_REQUIRED"
          assert evidence["weak_signal_independent_block"] is False
          assert evidence["trial_before_first_ai"] == "NOT_ACTIVATED"
          assert evidence["trial_activation"] == "FIRST_ADMITTED_AI_REQUEST"
          assert evidence["trial_duration_seconds"] == 604800
          assert evidence["trial_seats"] == 2
          assert evidence["trial_token_budget"] == 1000000
          assert evidence["cost_budget"] == "ENFORCED"
          assert evidence["second_concurrent_run"] == "BLOCKED"
          assert evidence["session_assurance"] == "AAL2"
          assert evidence["session_revocation"] == "IMMEDIATE"
          assert evidence["append_only_security_ledger"] == "BLOCKED"
          assert evidence["identity_table_direct_access"] == "BLOCKED"
          assert evidence["external_identity_provider_calls"] == 0
          assert evidence["model_calls"] == 0
          assert evidence["public_signup_authorised"] is False

          recovery = json.loads(
              Path("artifacts/c2-identity-recovery-browser.json").read_text()
          )
          assert recovery["schema"] == "axignal.c2-identity-recovery-browser.v1"
          assert recovery["status"] == "PASS"
          assert recovery["session_rotation_after_authentication"] == "PASS"
          assert recovery["recovery_code_one_time"] == "PASS"
          assert recovery["recovery_revoked_prior_sessions"] == "PASS"
          assert recovery["recovery_revoked_prior_authenticators"] == "PASS"
          assert recovery["replacement_passkey_registration"] == "PASS"
          assert recovery["replacement_recovery_codes"] == 8
          assert recovery["replacement_session_assurance"] == "AAL2"
          assert recovery["tenant_continuity"] == "PRESERVED"
          assert recovery["trial_state_after_recovery"] == "READY"
          assert recovery["public_signup_authorised"] is False
          assert recovery["external_identity_provider_calls"] == 0
          assert recovery["model_calls"] == 0
          PY

      - name: Upload P25 and C2 identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-trial-abuse-e2e-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            p25-exact-head.txt
            p25-web-health.json
            artifacts/identity-trial-abuse-e2e.json
            artifacts/identity-trial-abuse-e2e.log
            artifacts/c2-identity-recovery-browser.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$AXIGNAL_PILOT_ENV_FILE" ]; then
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
              -f "$AXIGNAL_IDENTITY_TEST_COMPOSE_FILE" logs --no-color
          fi

      - name: Stop disposable services
        if: always()
        shell: bash
        run: |
          if [ -f "$AXIGNAL_PILOT_ENV_FILE" ]; then
            docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
              -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
              -f "$AXIGNAL_IDENTITY_TEST_COMPOSE_FILE" down -v
          fi
