name: Pilot Deployment Candidate

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/src/axignal_api/pilot_health.py"
      - "apps/api/tests/test_pilot_health.py"
      - "apps/web/app/api/health/**"
      - "apps/web/app/demo/**"
      - "apps/web/components/demo-guide*"
      - "infra/pilot/**"
      - "scripts/verify_pilot_candidate.py"
      - "scripts/verify_demo_contract.py"
      - "docs/roadmap/14-pilot-deployment-candidate.md"
      - "docs/runbooks/pilot-deployment.md"
      - ".github/workflows/pilot-deployment-candidate.yml"
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: pilot-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Pilot topology, API and demo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Python development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint pilot boundary
        run: |
          ruff check \
            apps/api/src/axignal_api/pilot_health.py \
            apps/api/tests/test_pilot_health.py \
            scripts/verify_pilot_candidate.py \
            scripts/verify_demo_contract.py
      - name: Test pilot health boundary
        run: pytest apps/api/tests/test_pilot_health.py
      - name: Verify deployment contract
        run: python scripts/verify_pilot_candidate.py | tee pilot-contract.json
      - name: Verify canonical demo
        run: python scripts/verify_demo_contract.py | tee pilot-demo.json
      - name: Validate shell syntax
        run: |
          bash -n infra/pilot/backup.sh
          bash -n infra/pilot/restore-rehearsal.sh
          bash -n infra/pilot/harden-db.sh
      - name: Upload static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-static-evidence
          path: |
            pilot-contract.json
            pilot-demo.json
          retention-days: 14

  web-build:
    name: Standalone web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  runtime-acceptance:
    name: Private edge, health, auth, backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [static-contract, web-build]
    env:
      AXIGNAL_PILOT_ENV_FILE: /tmp/axignal-pilot-ci.env
      AXIGNAL_PILOT_COMPOSE_FILE: infra/pilot/compose.yaml
      AXIGNAL_POSTGRES_USER: axignal
      AXIGNAL_POSTGRES_DB: axignal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create synthetic CI-only pilot environment
        shell: bash
        run: |
          cat > "$AXIGNAL_PILOT_ENV_FILE" <<'ENV'
          AXIGNAL_BUILD_SHA=${{ github.sha }}
          AXIGNAL_PILOT_SITE_ADDRESS=http://localhost
          AXIGNAL_PILOT_HTTP_PORT=18080
          AXIGNAL_PILOT_HTTPS_PORT=18443
          AXIGNAL_POSTGRES_DB=axignal
          AXIGNAL_POSTGRES_USER=axignal
          AXIGNAL_POSTGRES_PASSWORD=ci-admin-password-not-for-deployment
          AXIGNAL_PROPOSAL_DB_PASSWORD=ci-proposal-password-not-for-deployment
          AXIGNAL_ADMISSION_DB_PASSWORD=ci-admission-password-not-for-deployment
          AXIGNAL_HUMAN_REVIEW_DB_PASSWORD=ci-review-password-not-for-deployment
          AXIGNAL_VALIDATION_DB_PASSWORD=ci-validation-password-not-for-deployment
          AXIGNAL_VALIDATION_ANALYST_DB_PASSWORD=ci-analyst-password-not-for-deployment
          AXIGNAL_SCHEDULER_DB_PASSWORD=ci-scheduler-password-not-for-deployment
          AXIGNAL_AUTH_EMAIL=pilot@example.test
          AXIGNAL_AUTH_SUBJECT=usr_pilot_ci
          AXIGNAL_AUTH_TENANT_ID=11111111-1111-4111-8111-111111111111
          AXIGNAL_AUTH_PASSWORD_SCRYPT='scrypt$00112233445566778899aabbccddeeff$c90f8bf5f5c77a981b682204633909aba0e58fe328cb71c9c357399c5ca92ea4a088a494b462b96f17efb7360ac400648f893f36fa31d4ec996236784dcbee94'
          AXIGNAL_SESSION_SECRET=ci-session-secret-with-at-least-32-bytes
          AXIGNAL_IDENTITY_ASSERTION_SECRET=ci-identity-secret-with-at-least-32-bytes
          AXIGNAL_VALIDATION_PARTICIPANT_SALT=ci-participant-salt-with-at-least-32-bytes
          AXIGNAL_OTEL_ENABLED=false
          ENV
      - name: Validate Compose rendering
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" config >/dev/null
      - name: Start private pilot core
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" up --build --detach --wait
      - name: Verify web and API readiness
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/health | tee pilot-web-health.json
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" exec -T api \
            python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').read().decode())" \
            | tee pilot-api-readiness.json
      - name: Verify authenticated demo route
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            --dump-header pilot-login-headers.txt \
            --output pilot-login.json \
            --cookie-jar pilot-cookie-jar.txt \
            -H 'content-type: application/json' \
            -d '{"email":"pilot@example.test","password":"pilot-password"}' \
            http://127.0.0.1:18080/api/auth/login
          grep -q '"authenticated":true' pilot-login.json
          COOKIE_VALUE="$(
            sed -n 's/^[Ss]et-[Cc]ookie: axignal_session=\([^;]*\).*/\1/p' \
              pilot-login-headers.txt | tr -d '\r' | tail -n 1
          )"
          test -n "$COOKIE_VALUE"
          curl --fail --silent --show-error \
            --dump-header pilot-demo-headers.txt \
            --output pilot-demo.html \
            -H "Cookie: axignal_session=$COOKIE_VALUE" \
            http://127.0.0.1:18080/demo
          grep -q "From proposal to defensible knowledge" pilot-demo.html
      - name: Verify edge security headers
        shell: bash
        run: |
          curl --silent --dump-header pilot-headers.txt --output /dev/null http://127.0.0.1:18080/api/health
          grep -qi '^x-frame-options: DENY' pilot-headers.txt
          grep -qi '^x-content-type-options: nosniff' pilot-headers.txt
          grep -qi '^content-security-policy:' pilot-headers.txt
      - name: Rehearse backup and restore
        run: bash infra/pilot/restore-rehearsal.sh | tee pilot-restore.json
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-runtime-evidence
          path: |
            pilot-web-health.json
            pilot-api-readiness.json
            pilot-login-headers.txt
            pilot-login.json
            pilot-cookie-jar.txt
            pilot-demo-headers.txt
            pilot-demo.html
            pilot-headers.txt
            pilot-restore.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture service logs
        if: failure()
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" logs > pilot-services.log 2>&1 || true
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-failure-logs
          path: pilot-services.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy pilot services
        if: always()
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" down --volumes --remove-orphans
