name: Pilot Deployment Candidate

on:
  push:
    branches:
      - main
  workflow_call:
permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: pilot-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Pilot topology, API and demo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove static-contract exact head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee pilot-static-exact-head.txt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install Python development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint pilot boundary
        run: |
          ruff check \
            apps/api/src/axignal_api/pilot_health.py \
            apps/api/tests/test_pilot_health.py \
            scripts/verify_pilot_candidate.py \
            scripts/verify_demo_contract.py \
            scripts/verify_ted_product_runtime.py \
            scripts/verify_ted_security_review.py

      - name: Test pilot health boundary
        run: pytest apps/api/tests/test_pilot_health.py

      - name: Verify deployment contract
        run: python scripts/verify_pilot_candidate.py | tee pilot-contract.json

      - name: Verify canonical demo
        run: python scripts/verify_demo_contract.py | tee pilot-demo.json

      - name: Verify accepted TED runtime contract
        run: |
          python scripts/verify_ted_product_runtime.py | tee pilot-ted-contract.json
          python scripts/verify_ted_security_review.py | tee pilot-ted-security.json

      - name: Validate shell syntax
        run: |
          bash -n infra/pilot/backup.sh
          bash -n infra/pilot/restore-rehearsal.sh
          bash -n infra/pilot/harden-db.sh

      - name: Upload static evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-static-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            pilot-static-exact-head.txt
            pilot-contract.json
            pilot-demo.json
            pilot-ted-contract.json
            pilot-ted-security.json
          retention-days: 14

  web-build:
    name: Standalone web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove web-build exact head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee pilot-web-build-exact-head.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: AXIGNAL_BUILD_SHA="$AXIGNAL_EXACT_SHA" pnpm build

      - name: Upload web-build identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-web-build-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: pilot-web-build-exact-head.txt
          if-no-files-found: error
          retention-days: 14

  runtime-acceptance:
    name: Private edge, live TED, health, auth, backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [static-contract, web-build]
    env:
      AXIGNAL_PILOT_ENV_FILE: /tmp/axignal-pilot-ci.env
      AXIGNAL_PILOT_COMPOSE_FILE: infra/pilot/compose.yaml
      AXIGNAL_PILOT_COMPOSE_EDGE_FILE: infra/pilot/remote/compose.shared-traefik.yaml
      AXIGNAL_POSTGRES_USER: axignal
      AXIGNAL_POSTGRES_DB: axignal
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove runtime-acceptance exact head
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee pilot-runtime-exact-head.txt

      - name: Create synthetic CI-only pilot environment
        shell: bash
        run: |
          cat > "$AXIGNAL_PILOT_ENV_FILE" <<'ENV'
          AXIGNAL_BUILD_SHA=${{ env.AXIGNAL_EXACT_SHA }}
          AXIGNAL_PILOT_SITE_ADDRESS=:80
          AXIGNAL_PILOT_CADDY_SITE_ADDRESS=:80
          AXIGNAL_PILOT_EDGE_MODE=shared-traefik
          AXIGNAL_PILOT_BIND_ADDRESS=127.0.0.1
          AXIGNAL_PILOT_HTTP_PORT=18080
          AXIGNAL_PILOT_HTTPS_PORT=18443
          AXIGNAL_POSTGRES_DB=axignal
          AXIGNAL_POSTGRES_USER=axignal
          AXIGNAL_POSTGRES_PASSWORD=ci-admin-password-not-for-deployment
          AXIGNAL_PROPOSAL_DB_PASSWORD=ci-proposal-password-not-for-deployment
          AXIGNAL_ADMISSION_DB_PASSWORD=ci-admission-password-not-for-deployment
          AXIGNAL_HUMAN_REVIEW_DB_PASSWORD=ci-review-password-not-for-deployment
          AXIGNAL_VALIDATION_DB_PASSWORD=ci-validation-password-not-for-deployment
          AXIGNAL_VALIDATION_ANALYST_DB_PASSWORD=ci-analyst-password-not-for-deployment
          AXIGNAL_SCHEDULER_DB_PASSWORD=ci-scheduler-password-not-for-deployment
          AXIGNAL_AUTH_EMAIL=pilot@example.test
          AXIGNAL_AUTH_SUBJECT=usr_pilot_ci
          AXIGNAL_AUTH_TENANT_ID=11111111-1111-4111-8111-111111111111
          AXIGNAL_AUTH_PASSWORD_SCRYPT='scrypt$00112233445566778899aabbccddeeff$c90f8bf5f5c77a981b682204633909aba0e58fe328cb71c9c357399c5ca92ea4a088a494b462b96f17efb7360ac400648f893f36fa31d4ec996236784dcbee94'
          AXIGNAL_SESSION_SECRET=ci-session-secret-with-at-least-32-bytes
          AXIGNAL_IDENTITY_ASSERTION_SECRET=ci-identity-secret-with-at-least-32-bytes
          AXIGNAL_VALIDATION_PARTICIPANT_SALT=ci-participant-salt-with-at-least-32-bytes
          AXIGNAL_OTEL_ENABLED=false
          ENV

      - name: Validate Compose rendering
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" config >/dev/null

      - name: Start private pilot core
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" up --build --detach --wait

      - name: Verify web and API readiness
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/health | tee pilot-web-health.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          health = json.loads(Path("pilot-web-health.json").read_text())
          assert health["buildSha"] == os.environ["AXIGNAL_EXACT_SHA"], health
          PY
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" exec -T api \
            python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').read().decode())" \
            | tee pilot-api-readiness.json

      - name: Verify protected demo without reopening legacy login
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$AXIGNAL_PILOT_ENV_FILE"
          set +a

          LOGIN_STATUS="$(
            curl --silent --show-error \
              --output pilot-login-disabled.json \
              --write-out '%{http_code}' \
              -H 'content-type: application/json' \
              -d '{"email":"pilot@example.test","password":"pilot-password"}' \
              http://127.0.0.1:18080/api/auth/login
          )"
          test "$LOGIN_STATUS" = "404"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("pilot-login-disabled.json").read_text())
          assert payload == {
              "error": "request_rejected",
              "code": "legacy_password_login_disabled",
          }
          PY

          COOKIE_VALUE="$(python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          version = "v1"
          now = int(time.time())
          claims = {
              "sub": os.environ["AXIGNAL_AUTH_SUBJECT"],
              "email": os.environ["AXIGNAL_AUTH_EMAIL"].lower(),
              "iat": now,
              "exp": now + 8 * 60 * 60,
          }
          encoded = base64.urlsafe_b64encode(
              json.dumps(claims, separators=(",", ":")).encode("utf-8")
          ).rstrip(b"=").decode("ascii")
          signature = base64.urlsafe_b64encode(
              hmac.new(
                  os.environ["AXIGNAL_SESSION_SECRET"].encode("utf-8"),
                  f"{version}.{encoded}".encode("utf-8"),
                  hashlib.sha256,
              ).digest()
          ).rstrip(b"=").decode("ascii")
          print(f"{version}.{encoded}.{signature}")
          PY
          )"
          test -n "$COOKIE_VALUE"
          curl --fail --silent --show-error \
            --dump-header pilot-demo-headers.txt \
            --output pilot-demo.html \
            -H "Cookie: axignal_session=$COOKIE_VALUE" \
            http://127.0.0.1:18080/demo
          grep -q "From proposal to defensible knowledge" pilot-demo.html

      - name: Start only the bounded TED research worker
        run: |
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" \
            --profile workers up --build --detach research-worker

      - name: Execute live authenticated TED ResearchRun
        shell: bash
        run: |
          set -o pipefail
          docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_FILE" \
            -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" exec -T api \
            python - <<'PY' | tee pilot-ted-runtime.json
          import json
          import os
          import time
          import urllib.request
          from uuid import UUID

          from axignal_api.identity import build_identity_assertion

          assertion = build_identity_assertion(
              secret=os.environ["AXIGNAL_IDENTITY_ASSERTION_SECRET"],
              subject=os.environ["AXIGNAL_AUTH_SUBJECT"],
              email="pilot@example.test",
              tenant_id=UUID(os.environ["AXIGNAL_AUTH_TENANT_ID"]),
              ttl_seconds=300,
          )
          headers = {
              "content-type": "application/json",
              "X-AXIGNAL-Identity-Assertion": assertion,
          }
          command = {
              "context_id": "ctx_eu_procurement_pilot",
              "opportunity_id": "opp_eu_procurement_pilot_live",
              "question": "Investiga las oportunidades públicas europeas activas.",
              "include_private_knowledge": False,
          }
          request = urllib.request.Request(
              "http://127.0.0.1:8000/v1/research-runs/ted-procurement",
              data=json.dumps(command).encode(),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              accepted = json.load(response)
          run_id = accepted["research_run_id"]
          view = None
          for _ in range(60):
              poll = urllib.request.Request(
                  f"http://127.0.0.1:8000/v1/research-runs/{run_id}",
                  headers={"X-AXIGNAL-Identity-Assertion": assertion},
              )
              with urllib.request.urlopen(poll, timeout=10) as response:
                  view = json.load(response)
              if view["state"] in {"COMPLETED", "FAILED"}:
                  break
              time.sleep(1)
          assert view is not None
          assert view["state"] == "COMPLETED", view
          assert view["synthetic"] is False
          assert view["private_knowledge_authorised"] is False
          assert view["actual_usage"]["api_requests"] == 1
          assert view["actual_usage"]["model_calls"] == 0
          assert len(view["evidence"]) > 0
          assert len(view["candidate_claims"]) == len(view["canonical_claims"])
          assert view["dossier"]["status"] == "TRACEABLE_WITH_ADMITTED_FACTS"
          attribution = view["dossier"]["attribution"]
          assert attribution["source_id"] == "src_ted_search_api_v3"
          assert attribution["api_redistribution"] is False
          print(json.dumps({
              "status": "PASS",
              "task": "AX-F8-T14",
              "research_run_id": run_id,
              "state": view["state"],
              "live_api_requests": view["actual_usage"]["api_requests"],
              "notice_count": view["actual_usage"]["notices"],
              "evidence_count": len(view["evidence"]),
              "candidate_claim_count": len(view["candidate_claims"]),
              "canonical_claim_count": len(view["canonical_claims"]),
              "model_calls": view["actual_usage"]["model_calls"],
              "dossier_status": view["dossier"]["status"],
              "api_redistribution": attribution["api_redistribution"],
              "public_general_availability": False,
          }, sort_keys=True))
          PY

      - name: Verify edge security headers
        shell: bash
        run: |
          curl --silent --dump-header pilot-headers.txt --output /dev/null http://127.0.0.1:18080/api/health
          grep -qi '^x-frame-options: DENY' pilot-headers.txt
          grep -qi '^x-content-type-options: nosniff' pilot-headers.txt
          grep -qi '^content-security-policy:' pilot-headers.txt

      - name: Rehearse backup and restore
        run: bash infra/pilot/restore-rehearsal.sh | tee pilot-restore.json

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-runtime-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            pilot-runtime-exact-head.txt
            pilot-web-health.json
            pilot-api-readiness.json
            pilot-login-disabled.json
            pilot-demo-headers.txt
            pilot-demo.html
            pilot-ted-runtime.json
            pilot-headers.txt
            pilot-restore.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture service logs
        if: failure()
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" --profile workers logs > pilot-services.log 2>&1 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-failure-logs-${{ env.AXIGNAL_EXACT_SHA }}
          path: pilot-services.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Destroy pilot services
        if: always()
        run: docker compose --env-file "$AXIGNAL_PILOT_ENV_FILE" -f "$AXIGNAL_PILOT_COMPOSE_FILE" -f "$AXIGNAL_PILOT_COMPOSE_EDGE_FILE" --profile workers down --volumes --remove-orphans
