name: Pilot Diagnostics

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/pilot_health.py"
      - "apps/api/tests/test_pilot_health.py"
      - "apps/web/app/demo/**"
      - "apps/web/components/demo-guide*"
      - "scripts/verify_pilot_candidate.py"
      - "scripts/verify_demo_contract.py"
      - ".github/workflows/pilot-diagnostics.yml"

permissions:
  contents: read

jobs:
  python-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - shell: bash
        run: |
          set -o pipefail
          ruff check \
            apps/api/src/axignal_api/pilot_health.py \
            apps/api/tests/test_pilot_health.py \
            scripts/verify_pilot_candidate.py \
            scripts/verify_demo_contract.py 2>&1 | tee pilot-ruff.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-ruff-diagnostics
          path: pilot-ruff.log
          retention-days: 2

  web-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee pilot-typecheck.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-typecheck-diagnostics
          path: pilot-typecheck.log
          retention-days: 2
