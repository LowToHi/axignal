name: Public Landing Host Preflight

on:
  push:
    branches:
      - agent/public-landing-release-v0.1
    paths:
      - ".github/workflows/public-landing-host-preflight.yml"

permissions:
  contents: read

concurrency:
  group: axignal-public-landing-host-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Inspect authorised landing host boundary
    runs-on: [self-hosted, linux, x64, axignal-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Inspect host without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          command -v docker >/dev/null
          docker info >/dev/null

          mapfile -t traefik_containers < <(docker ps --format '{{.Names}}' | grep -E '(^|[-_])traefik([-_]|$)' || true)
          test "${#traefik_containers[@]}" -eq 1
          traefik_name="${traefik_containers[0]}"
          network_mode="$(docker inspect --format '{{.HostConfig.NetworkMode}}' "${traefik_name}")"
          test "${network_mode}" = "host"

          test -n "$(ss -H -ltn 'sport = :80')"
          test -n "$(ss -H -ltn 'sport = :443')"
          test -z "$(ss -H -ltn 'sport = :18180')"

          dynamic_mount="$({
            docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/traefik/dynamic"}}{{.Source}}{{end}}{{end}}' "${traefik_name}"
          })"
          test -n "${dynamic_mount}"

          axignal_ipv4="$(getent ahostsv4 axignal.com 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, - || true)"
          www_ipv4="$(getent ahostsv4 www.axignal.com 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, - || true)"

          export TRAEFIK_NAME="${traefik_name}"
          export TRAEFIK_NETWORK_MODE="${network_mode}"
          export TRAEFIK_DYNAMIC_MOUNT="${dynamic_mount}"
          export AXIGNAL_IPV4="${axignal_ipv4}"
          export WWW_AXIGNAL_IPV4="${www_ipv4}"
          python - <<'PY'
          import json
          import os
          import pathlib
          import socket

          expected_ip = "187.124.220.48"
          axignal_ips = [item for item in os.environ.get("AXIGNAL_IPV4", "").split(",") if item]
          www_ips = [item for item in os.environ.get("WWW_AXIGNAL_IPV4", "").split(",") if item]
          evidence = {
              "schema": "axignal.public-landing-host-preflight.v1",
              "goal_id": "AXIGNAL-GOAL-001",
              "revision": os.environ["GITHUB_SHA"],
              "runner": os.environ.get("RUNNER_NAME"),
              "effective_user": os.popen("id -un").read().strip(),
              "hostname": socket.gethostname(),
              "docker_access": True,
              "traefik": {
                  "container": os.environ["TRAEFIK_NAME"],
                  "network_mode": os.environ["TRAEFIK_NETWORK_MODE"],
                  "dynamic_mount": os.environ["TRAEFIK_DYNAMIC_MOUNT"],
                  "owns_public_ports": True,
              },
              "landing_port": {"host": "127.0.0.1", "port": 18180, "available": True},
              "dns": {
                  "expected_ipv4": expected_ip,
                  "axignal.com": axignal_ips,
                  "www.axignal.com": www_ips,
                  "ready": expected_ip in axignal_ips and (not www_ips or expected_ip in www_ips),
              },
              "mutation_performed": False,
          }
          pathlib.Path("public-landing-host-preflight.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload redacted preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-landing-host-preflight
          path: public-landing-host-preflight.json
          retention-days: 7
