name: Public Landing SSH Channel Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/public-landing-ssh-channel-preflight.yml"
  push:
    branches:
      - agent/public-landing-release-v0.1
    paths:
      - ".github/workflows/public-landing-ssh-channel-preflight.yml"

permissions:
  contents: read

jobs:
  ssh-channel:
    name: Verify production deploy credential and SSH reachability
    runs-on: ubuntu-24.04
    environment: production-landing
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ vars.AXIGNAL_VPS_HOST }}
      VPS_PORT: ${{ vars.AXIGNAL_VPS_SSH_PORT }}
    steps:
      - name: Validate and classify deploy key without disclosure
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AXIGNAL_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/axignal-ssh

          configured=false
          parseable=false
          encrypted=false
          normalized_literal_newlines=false
          key_kind=missing
          fingerprint=""
          line_count=0
          byte_count=0

          if [[ -n "${DEPLOY_KEY:-}" ]]; then
            configured=true
            DEPLOY_KEY_RAW="${DEPLOY_KEY}" python - <<'PY'
          import os
          from pathlib import Path

          value = os.environ["DEPLOY_KEY_RAW"]
          value = value.lstrip("\ufeff").replace("\r\n", "\n").replace("\r", "\n").strip()
          literal_newlines = "\\n" in value and "\n" not in value
          if literal_newlines:
              value = value.replace("\\n", "\n")
          if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
              value = value[1:-1].strip()
          Path("/tmp/axignal-ssh/deploy_key").write_text(value + "\n", encoding="utf-8")
          Path("/tmp/axignal-ssh/normalization.flag").write_text(
              "true" if literal_newlines else "false",
              encoding="utf-8",
          )
          PY
            chmod 600 /tmp/axignal-ssh/deploy_key
            normalized_literal_newlines="$(cat /tmp/axignal-ssh/normalization.flag)"
            line_count="$(wc -l < /tmp/axignal-ssh/deploy_key | tr -d ' ')"
            byte_count="$(wc -c < /tmp/axignal-ssh/deploy_key | tr -d ' ')"

            first_line="$(head -n 1 /tmp/axignal-ssh/deploy_key)"
            case "${first_line}" in
              "-----BEGIN OPENSSH PRIVATE KEY-----") key_kind=openssh-private ;;
              "-----BEGIN RSA PRIVATE KEY-----") key_kind=pem-rsa-private ;;
              "-----BEGIN EC PRIVATE KEY-----") key_kind=pem-ec-private ;;
              "-----BEGIN PRIVATE KEY-----") key_kind=pkcs8-private ;;
              "-----BEGIN ENCRYPTED PRIVATE KEY-----") key_kind=encrypted-pkcs8-private ; encrypted=true ;;
              "PuTTY-User-Key-File-"*) key_kind=putty-private ;;
              ssh-ed25519\ *|ssh-rsa\ *|ecdsa-sha2-*\ *) key_kind=public-key ;;
              *)
                if [[ -f "${first_line}" ]]; then
                  key_kind=filesystem-path
                else
                  key_kind=unknown
                fi
                ;;
            esac

            if ssh-keygen -y -P "" -f /tmp/axignal-ssh/deploy_key </dev/null > /tmp/axignal-ssh/deploy_key.pub 2>/tmp/axignal-ssh/key-error; then
              parseable=true
              fingerprint="$(ssh-keygen -lf /tmp/axignal-ssh/deploy_key.pub -E sha256 | awk '{print $2}')"
            elif grep -Eqi 'incorrect passphrase|passphrase' /tmp/axignal-ssh/key-error; then
              encrypted=true
            fi
          fi

          {
            echo "DEPLOY_KEY_CONFIGURED=${configured}"
            echo "DEPLOY_KEY_PARSEABLE=${parseable}"
            echo "DEPLOY_KEY_ENCRYPTED=${encrypted}"
            echo "DEPLOY_KEY_KIND=${key_kind}"
            echo "DEPLOY_KEY_FINGERPRINT=${fingerprint}"
            echo "DEPLOY_KEY_LITERAL_NEWLINES_NORMALIZED=${normalized_literal_newlines}"
            echo "DEPLOY_KEY_LINE_COUNT=${line_count}"
            echo "DEPLOY_KEY_BYTE_COUNT=${byte_count}"
          } >> "${GITHUB_ENV}"

      - name: Probe SSH transport and collect host fingerprint
        shell: bash
        run: |
          set -euo pipefail
          host="${VPS_HOST:-187.124.220.48}"
          port="${VPS_PORT:-22}"
          reachable=false
          host_key_available=false
          host_fingerprints=""

          if timeout 8 bash -c "</dev/tcp/${host}/${port}" 2>/dev/null; then
            reachable=true
            if ssh-keyscan -T 8 -p "${port}" -t ed25519,rsa "${host}" > /tmp/axignal-ssh/known_hosts 2>/dev/null; then
              if [[ -s /tmp/axignal-ssh/known_hosts ]]; then
                host_key_available=true
                host_fingerprints="$(ssh-keygen -lf /tmp/axignal-ssh/known_hosts -E sha256 | awk '{print $2}' | sort -u | paste -sd, -)"
              fi
            fi
          fi

          export TARGET_HOST="${host}"
          export TARGET_PORT="${port}"
          export SSH_REACHABLE="${reachable}"
          export HOST_KEY_AVAILABLE="${host_key_available}"
          export HOST_FINGERPRINTS="${host_fingerprints}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema": "axignal.public-landing-ssh-channel-preflight.v3",
              "goal_id": "AXIGNAL-GOAL-001",
              "environment": "production-landing",
              "target": {
                  "host": os.environ["TARGET_HOST"],
                  "port": int(os.environ["TARGET_PORT"]),
              },
              "deploy_key": {
                  "secret_name": "AXIGNAL_VPS_SSH_PRIVATE_KEY",
                  "configured": os.environ.get("DEPLOY_KEY_CONFIGURED") == "true",
                  "parseable": os.environ.get("DEPLOY_KEY_PARSEABLE") == "true",
                  "encrypted": os.environ.get("DEPLOY_KEY_ENCRYPTED") == "true",
                  "kind": os.environ.get("DEPLOY_KEY_KIND"),
                  "public_fingerprint": os.environ.get("DEPLOY_KEY_FINGERPRINT") or None,
                  "literal_newlines_normalized": os.environ.get("DEPLOY_KEY_LITERAL_NEWLINES_NORMALIZED") == "true",
                  "line_count": int(os.environ.get("DEPLOY_KEY_LINE_COUNT", "0")),
                  "byte_count": int(os.environ.get("DEPLOY_KEY_BYTE_COUNT", "0")),
              },
              "transport": {
                  "reachable": os.environ.get("SSH_REACHABLE") == "true",
                  "host_key_available": os.environ.get("HOST_KEY_AVAILABLE") == "true",
                  "host_key_fingerprints": [
                      value for value in os.environ.get("HOST_FINGERPRINTS", "").split(",") if value
                  ],
              },
              "authentication_attempted": False,
              "mutation_performed": False,
          }
          Path("public-landing-ssh-channel-preflight.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          if not evidence["deploy_key"]["configured"]:
              raise SystemExit("AXIGNAL_VPS_SSH_PRIVATE_KEY is not available to production-landing")
          if not evidence["deploy_key"]["parseable"]:
              raise SystemExit("AXIGNAL_VPS_SSH_PRIVATE_KEY is not a usable non-interactive private key")
          if not evidence["transport"]["reachable"] or not evidence["transport"]["host_key_available"]:
              raise SystemExit("SSH transport or host key discovery is unavailable")
          PY

      - name: Remove temporary key material
        if: always()
        run: rm -rf /tmp/axignal-ssh

      - name: Upload redacted SSH channel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-landing-ssh-channel-preflight
          path: public-landing-ssh-channel-preflight.json
          if-no-files-found: ignore
          retention-days: 7
