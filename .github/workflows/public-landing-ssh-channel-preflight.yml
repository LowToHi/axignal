name: Public Landing SSH Channel Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/public-landing-ssh-channel-preflight.yml"
  push:
    branches:
      - agent/public-landing-release-v0.1
    paths:
      - ".github/workflows/public-landing-ssh-channel-preflight.yml"

permissions:
  contents: read

jobs:
  ssh-channel:
    name: Verify deploy credential presence and host key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AXIGNAL_VPS_SSH_PRIVATE_KEY: ${{ secrets.AXIGNAL_VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - name: Scan authorised VPS host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axignal-ssh
          ssh-keyscan -T 10 -t ed25519,rsa 187.124.220.48 > /tmp/axignal-ssh/known_hosts 2>/dev/null
          test -s /tmp/axignal-ssh/known_hosts
          ssh-keygen -lf /tmp/axignal-ssh/known_hosts -E sha256 > /tmp/axignal-ssh/fingerprints.txt

      - name: Detect configured deploy key without disclosure
        shell: bash
        run: |
          set -euo pipefail
          configured_name=""
          configured_value=""
          for name in AXIGNAL_VPS_SSH_PRIVATE_KEY VPS_SSH_PRIVATE_KEY SSH_PRIVATE_KEY HOSTINGER_SSH_PRIVATE_KEY; do
            value="${!name:-}"
            if [[ -n "${value}" ]]; then
              configured_name="${name}"
              configured_value="${value}"
              break
            fi
          done

          key_valid=false
          if [[ -n "${configured_value}" ]]; then
            umask 077
            printf '%s\n' "${configured_value}" > /tmp/axignal-ssh/deploy_key
            if ssh-keygen -y -f /tmp/axignal-ssh/deploy_key >/dev/null 2>&1; then
              key_valid=true
            fi
          fi

          export CONFIGURED_NAME="${configured_name}"
          export KEY_VALID="${key_valid}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fingerprints = [
              line.strip()
              for line in Path('/tmp/axignal-ssh/fingerprints.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          evidence = {
              'schema': 'axignal.public-landing-ssh-channel-preflight.v1',
              'goal_id': 'AXIGNAL-GOAL-001',
              'target': '187.124.220.48',
              'host_key_fingerprints': fingerprints,
              'deploy_secret_name': os.environ.get('CONFIGURED_NAME') or None,
              'deploy_key_configured': bool(os.environ.get('CONFIGURED_NAME')),
              'deploy_key_parseable': os.environ.get('KEY_VALID') == 'true',
              'connection_attempted': False,
              'mutation_performed': False,
          }
          Path('public-landing-ssh-channel-preflight.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Remove temporary key material
        if: always()
        run: rm -rf /tmp/axignal-ssh

      - name: Upload redacted SSH channel evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-landing-ssh-channel-preflight
          path: public-landing-ssh-channel-preflight.json
          retention-days: 7
