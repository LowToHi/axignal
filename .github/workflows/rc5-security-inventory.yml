name: RC5 Secret and Asset Hardening

on:
  pull_request:
    branches:
      - "release/axignal-rc4-58f666b"
    paths:
      - ".github/workflows/rc5-security-inventory.yml"
      - "data/security/reviewed-secret-baseline.v1.json"
      - "scripts/verify_secret_baseline.py"
      - "scripts/asset_download_security.py"
      - "scripts/acquire_globe_assets.py"
      - "apps/api/tests/test_asset_download_security.py"
      - "docs/landing/assets-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-secret-baseline:
    name: Reviewed secret baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned detector
        run: python -m pip install --disable-pip-version-check "detect-secrets==1.5.0"
      - name: Verify exact reviewed inventory
        run: python scripts/verify_secret_baseline.py | tee secret-baseline-verification.json
      - name: Inventory remote I/O surfaces
        run: |
          git grep -n -I -E \
            '(^|[^A-Za-z])(httpx|requests|urllib|urlopen|urlretrieve|aiohttp|fetch\(|axios|download|remote[_ -]?asset|asset[_ -]?url)' \
            -- \
            ':(glob)**/*.py' \
            ':(glob)**/*.ts' \
            ':(glob)**/*.tsx' \
            ':(glob)**/*.js' \
            ':(glob)**/*.mjs' \
            ':(glob)**/*.cjs' \
            ':(glob)**/*.sh' \
            ':(glob)**/*.yml' \
            ':(glob)**/*.yaml' \
            > remote-io-inventory.txt || true
          cut -d: -f1 remote-io-inventory.txt | sort -u > remote-io-files.txt
          python - <<'PY'
          import json
          from pathlib import Path

          files = [line for line in Path("remote-io-files.txt").read_text().splitlines() if line]
          Path("remote-io-summary.json").write_text(
              json.dumps(
                  {
                      "schema": "axignal.remote-io-inventory.v1",
                      "matched_file_count": len(files),
                      "matched_files": files,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload non-secret review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc5-secret-baseline-evidence
          path: |
            secret-baseline-verification.json
            remote-io-files.txt
            remote-io-summary.json
          if-no-files-found: error
          retention-days: 14

  bounded-asset-acquisition:
    name: Bounded asset acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install frozen application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Enforce focused static analysis
        run: |
          ruff check \
            scripts/asset_download_security.py \
            scripts/acquire_globe_assets.py \
            scripts/verify_secret_baseline.py \
            apps/api/tests/test_asset_download_security.py
          python -m compileall -q \
            scripts/asset_download_security.py \
            scripts/acquire_globe_assets.py \
            scripts/verify_secret_baseline.py \
            apps/api/tests/test_asset_download_security.py
      - name: Run adversarial downloader tests
        run: pytest apps/api/tests/test_asset_download_security.py
      - name: Verify acquisition manifest and fail-closed state
        run: |
          test "$(grep -c 'expected_sha256' docs/landing/assets-manifest.json)" -eq 5
          ! grep -E 'urllib|urlopen|urlretrieve|requests\.' scripts/acquire_globe_assets.py
          python scripts/acquire_globe_assets.py \
            --output /tmp/axignal-asset-dry-run \
            --dry-run | tee asset-acquisition-dry-run.json
          set +e
          python scripts/acquire_globe_assets.py \
            --output /tmp/axignal-asset-denied \
            > asset-acquisition-denied.json
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          dry_run = json.loads(Path("asset-acquisition-dry-run.json").read_text())
          denied = json.loads(Path("asset-acquisition-denied.json").read_text())
          assert dry_run["status"] == "DRY_RUN"
          assert len(dry_run["assets"]) == 5
          assert all(asset["digest_pinned"] is False for asset in dry_run["assets"])
          assert denied["status"] == "DENIED"
          assert "pinned expected_sha256" in denied["error"]
          assert not list(Path("/tmp/axignal-asset-denied").glob("*"))
          PY
      - name: Upload asset security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc5-asset-security-evidence
          path: |
            asset-acquisition-dry-run.json
            asset-acquisition-denied.json
          if-no-files-found: error
          retention-days: 14
