name: RC5 Security Inventory

on:
  pull_request:
    branches:
      - "release/axignal-rc4-58f666b"
    paths:
      - ".github/workflows/rc5-security-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install pinned inventory tools
        run: python -m pip install --disable-pip-version-check "detect-secrets==1.5.0"
      - name: Generate secret-pattern inventory
        run: |
          detect-secrets scan --all-files \
            --exclude-files '(^|/)(\.git|\.pytest_cache|\.ruff_cache|pnpm-lock\.yaml|.*\.lock|test-results|playwright-report|bandit-report\.json|pip-audit-report\.json|coverage-python\.xml)(/|$)' \
            > detect-secrets-report.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path("detect-secrets-report.json").read_text(encoding="utf-8"))
          results = report.get("results", {})
          plugins = Counter()
          areas = Counter()
          total = 0
          for path, findings in results.items():
              total += len(findings)
              if path.startswith("apps/"):
                  area = "apps"
              elif path.startswith("scripts/"):
                  area = "scripts"
              elif path.startswith("tests/"):
                  area = "tests"
              elif path.startswith(".github/"):
                  area = "workflows"
              elif path.startswith("docs/"):
                  area = "docs"
              else:
                  area = "root_or_other"
              areas[area] += len(findings)
              for finding in findings:
                  plugins[finding.get("type", "unknown")] += 1
          summary = {
              "schema": "axignal.secret-inventory-summary.v1",
              "finding_count": total,
              "file_count": len(results),
              "by_area": dict(sorted(areas.items())),
              "by_plugin": dict(sorted(plugins.items())),
              "paths": [
                  {"path": path, "count": len(findings)}
                  for path, findings in sorted(results.items())
              ],
          }
          Path("detect-secrets-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Build redacted finding context
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          report = json.loads(Path("detect-secrets-report.json").read_text(encoding="utf-8"))
          safe_markers = (
              "127.0.0.1",
              "localhost",
              "example.invalid",
              "example.com",
              "fixture",
              "test",
              "dummy",
              "placeholder",
              "replace",
              "sha256",
              "checksum",
              "digest",
              "fingerprint",
              "commit",
              "expected",
              "secrets.",
              "secret_name",
              "environment",
              "password_required",
          )
          key_pattern = re.compile(
              r"[A-Za-z0-9_.-]*(?:secret|password|token|key|sha|hash|digest|commit|fingerprint|url|dsn)[A-Za-z0-9_.-]*",
              re.IGNORECASE,
          )
          url_pattern = re.compile(r"https?://[^\s\"'<>]+", re.IGNORECASE)
          quoted_pattern = re.compile(r"(['\"])(?:\\.|(?!\1).)*\1")
          long_token_pattern = re.compile(r"\b[A-Za-z0-9_+/=-]{16,}\b")

          entries = []
          for path, findings in sorted(report.get("results", {}).items()):
              source = Path(path)
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              for finding in findings:
                  line_number = int(finding["line_number"])
                  line = lines[line_number - 1] if 0 < line_number <= len(lines) else ""
                  lower = line.casefold()
                  hosts = []
                  for raw_url in url_pattern.findall(line):
                      try:
                          parsed = urlsplit(raw_url)
                      except ValueError:
                          continue
                      if parsed.hostname:
                          hosts.append(parsed.hostname.casefold())
                  redacted = re.sub(
                      r"(https?://)[^/@\s]+@",
                      r"\1<redacted-userinfo>@",
                      line,
                      flags=re.IGNORECASE,
                  )
                  redacted = quoted_pattern.sub(lambda match: f"{match.group(1)}<redacted>{match.group(1)}", redacted)
                  redacted = long_token_pattern.sub("<redacted-token>", redacted)
                  entries.append(
                      {
                          "path": path,
                          "line_number": line_number,
                          "type": finding.get("type"),
                          "hashed_secret": finding.get("hashed_secret"),
                          "markers": [marker for marker in safe_markers if marker in lower],
                          "keys": sorted(set(key_pattern.findall(line))),
                          "url_hosts": sorted(set(hosts)),
                          "redacted_context": redacted[:400],
                      }
                  )
          payload = {
              "schema": "axignal.secret-redacted-context.v1",
              "finding_count": len(entries),
              "findings": entries,
          }
          Path("detect-secrets-redacted-context.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Inventory remote I/O and download surfaces
        run: |
          git grep -n -I -E \
            '(^|[^A-Za-z])(httpx|requests|urllib|urlopen|urlretrieve|aiohttp|fetch\(|axios|download|remote[_ -]?asset|asset[_ -]?url)' \
            -- \
            ':(glob)**/*.py' \
            ':(glob)**/*.ts' \
            ':(glob)**/*.tsx' \
            ':(glob)**/*.js' \
            ':(glob)**/*.mjs' \
            ':(glob)**/*.cjs' \
            ':(glob)**/*.sh' \
            ':(glob)**/*.yml' \
            ':(glob)**/*.yaml' \
            > remote-io-inventory.txt || true
          cut -d: -f1 remote-io-inventory.txt | sort -u > remote-io-files.txt
          if test -s remote-io-files.txt; then
            tar -czf remote-io-source.tar.gz -T remote-io-files.txt
          else
            tar -czf remote-io-source.tar.gz --files-from /dev/null
          fi
          python - <<'PY'
          from pathlib import Path

          files = [line for line in Path("remote-io-files.txt").read_text().splitlines() if line]
          Path("remote-io-summary.txt").write_text(
              f"matched_files={len(files)}\n" + "\n".join(files) + ("\n" if files else ""),
              encoding="utf-8",
          )
          PY
      - name: Upload non-secret audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc5-security-inventory
          path: |
            detect-secrets-report.json
            detect-secrets-summary.json
            detect-secrets-redacted-context.json
            remote-io-inventory.txt
            remote-io-files.txt
            remote-io-summary.txt
            remote-io-source.tar.gz
          if-no-files-found: error
          retention-days: 3
