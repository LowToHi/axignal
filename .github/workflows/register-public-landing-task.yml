name: Register Public Landing Release Task

on:
  push:
    branches:
      - agent/public-landing-release-v0.1
    paths:
      - ".github/workflows/register-public-landing-task.yml"

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/public-landing-release-v0.1
      - name: Register AX-F2-T17 and retire patch workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/roadmap/02-task-catalogue.md')
          text = path.read_text(encoding='utf-8')
          anchor = '| `AX-F2-T16` | Add isolated shared-Traefik pilot edge and host-only credential lifecycle | 06, 08–10, 18, 19, ADR-011 | repository-architect, security-reviewer, test-engineer, operations-engineer, operations-writer |'
          entry = '| `AX-F2-T17` | Release the public landing through incumbent Traefik with private consent-aware intake | 06, 08–10, 18, 19 | repository-architect, privacy-reviewer, security-reviewer, test-engineer, operations-engineer, operations-writer |'
          if entry not in text:
              if anchor not in text:
                  raise SystemExit('AX-F2-T16 catalogue anchor not found')
              text = text.replace(anchor, anchor + '\n' + entry, 1)
              path.write_text(text, encoding='utf-8')
          PY
          grep -q 'AX-F2-T17' docs/roadmap/02-task-catalogue.md
          rm .github/workflows/register-public-landing-task.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/02-task-catalogue.md .github/workflows/register-public-landing-task.yml
          git commit -m "Register AX-F2-T17 public landing release"
          git push origin HEAD:agent/public-landing-release-v0.1
