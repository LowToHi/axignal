name: Remote Pilot Operations

on:
  pull_request:
    paths:
      - "infra/pilot/remote/**"
      - "scripts/verify_remote_pilot_ops.py"
      - "docs/roadmap/15-remote-pilot-operations.md"
      - "docs/runbooks/remote-pilot-operations.md"
      - ".github/workflows/remote-pilot-operations.yml"
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: remote-pilot-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Bootstrap, secrets, deploy and recovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ansible-core==2.18.7
          ansible-galaxy collection install -r infra/pilot/remote/requirements.yml
      - name: Lint remote operations boundary
        shell: bash
        run: |
          set -o pipefail
          ruff check \
            infra/pilot/remote/prepare_env.py \
            infra/pilot/remote/files/remote_state.py \
            infra/pilot/remote/tests/test_remote_ops.py \
            scripts/verify_remote_pilot_ops.py 2>&1 | tee remote-ruff.log
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-pilot-ruff-diagnostics
          path: remote-ruff.log
          if-no-files-found: ignore
          retention-days: 2
      - name: Validate shell syntax
        run: |
          bash -n infra/pilot/remote/files/compose_boundary.sh
          bash -n infra/pilot/remote/files/axignal-remote-deploy
          bash -n infra/pilot/remote/files/axignal-remote-verify
          bash -n infra/pilot/remote/files/axignal-remote-backup
          bash -n infra/pilot/remote/files/axignal-remote-rollback
          bash -n infra/pilot/remote/files/axignal-remote-watchdog
          bash -n infra/pilot/remote/files/axignal-remote-rotate-operator
          bash -n infra/pilot/remote/files/axignal-remote-retire-operator-credential
      - name: Verify Ansible syntax
        working-directory: infra/pilot/remote
        run: |
          cp inventory.example.ini inventory.ci.ini
          ansible-playbook --syntax-check -i inventory.ci.ini playbook.yml \
            -e axignal_deploy_sha=${{ github.sha }} \
            -e axignal_site_address=https://pilot.example.com \
            -e axignal_acme_email=ops@example.test \
            -e axignal_auth_email=pilot@example.test \
            -e axignal_auth_subject=usr_pilot_ci
      - name: Test secret preparation and state boundary
        run: pytest -q infra/pilot/remote/tests/test_remote_ops.py
      - name: Verify remote operations contract
        run: python scripts/verify_remote_pilot_ops.py | tee remote-operations-contract.json
      - name: Generate synthetic root-only environment
        shell: bash
        run: |
          umask 077
          python infra/pilot/remote/prepare_env.py \
            create \
            --output /tmp/axignal-pilot-ci.env \
            --password-output /tmp/axignal-operator-password.pending \
            --metadata-output /tmp/axignal-credential-metadata.json \
            --sha "${{ github.sha }}" \
            --site-address https://pilot.example.com \
            --acme-email ops@example.test \
            --auth-email pilot@example.test \
            --auth-subject usr_pilot_ci \
            --edge-mode shared-traefik \
            --http-port 18080 \
            | tee remote-environment-evidence.json
          test "$(stat -c '%a' /tmp/axignal-pilot-ci.env)" = "600"
          test "$(stat -c '%a' /tmp/axignal-operator-password.pending)" = "600"
          test "$(stat -c '%a' /tmp/axignal-credential-metadata.json)" = "600"
          python - <<'PY'
          from pathlib import Path
          password = Path('/tmp/axignal-operator-password.pending').read_text().strip()
          environment = Path('/tmp/axignal-pilot-ci.env').read_text()
          evidence = Path('remote-environment-evidence.json').read_text()
          assert password not in environment
          assert password not in evidence
          PY
      - name: Validate pilot Compose with generated secrets
        run: |
          docker compose \
            --env-file /tmp/axignal-pilot-ci.env \
            -f infra/pilot/compose.yaml \
            -f infra/pilot/remote/compose.shared-traefik.yaml \
            config > /tmp/axignal-shared-compose.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('/tmp/axignal-shared-compose.yaml').read_text())
          published = config['services']['caddy']['ports']
          assert len(published) == 1, published
          assert published[0]['host_ip'] == '127.0.0.1', published
          assert published[0]['published'] == '18080', published
          assert published[0]['target'] == 80, published
          PY
      - name: Upload remote operations evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-pilot-operations-evidence
          path: |
            remote-operations-contract.json
            remote-environment-evidence.json
          retention-days: 1
      - name: Remove synthetic private files
        if: always()
        run: |
          rm -f \
            /tmp/axignal-pilot-ci.env \
            /tmp/axignal-operator-password.pending \
            /tmp/axignal-credential-metadata.json
