name: One-shot Python dev lock xlrd repair

on:
  push:
    branches:
      - agent/ax-gate7-o01-e-history-frequency-lag
    paths:
      - .github/workflows/repair-python-dev-lock-xlrd.yml

permissions:
  contents: write

concurrency:
  group: repair-python-dev-lock-xlrd
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/ax-gate7-o01-e-history-frequency-lag
          fetch-depth: 0
          persist-credentials: true

      - name: Append exact hashed lock entry
        shell: bash
        run: |
          set -euo pipefail
          lock=requirements/python-dev.lock
          if grep -q '^xlrd==2\.0\.2 ' "$lock"; then
            echo 'xlrd lock entry already present; refusing duplicate mutation' >&2
            exit 1
          fi
          cat >> "$lock" <<'EOF'
          xlrd==2.0.2 \
              --hash=sha256:ea762c3d29f4cca48d82df517b6d89fbce4db3107f9d78713e48cd321d5c9aa9
              # via axignal-api (pyproject.toml)
          EOF
          tail -n 4 "$lock"

      - name: Prove hashed lock installation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
          check-latest: false

      - name: Install complete dev graph from hashes
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==26.1.2'
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement requirements/python-dev.lock
          python -m pip check
          python - <<'PY'
          import xlrd
          assert xlrd.__version__ == '2.0.2'
          PY

      - name: Commit exact lock repair
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'requirements/python-dev.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/python-dev.lock
          git commit -m 'build(ci): add hashed xlrd to Python dev lock'
          git push origin HEAD:agent/ax-gate7-o01-e-history-frequency-lag
