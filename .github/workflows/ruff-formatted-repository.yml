name: Ruff Formatted Repository

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/repository.py"
      - ".github/workflows/ruff-formatted-repository.yml"

permissions:
  contents: write

jobs:
  format-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12,<1'
      - name: Apply isolated repository formatting
        shell: bash
        run: |
          ruff check apps/api/src/axignal_api/repository.py --fix || true
          ruff format apps/api/src/axignal_api/repository.py
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/axignal_api/repository.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        with psycopg.connect(self.dsn, row_factory=dict_row) as connection:\n'
              '            with connection.cursor() as cursor:\n'
              '                cursor.execute(sql.SQL("SET LOCAL ROLE {}").format(sql.Identifier(role)))\n'
              '                if tenant_id is not None:\n'
              '                    cursor.execute(\n'
              '                        "SELECT set_config(\'app.tenant_id\', %s, true)",\n'
              '                        (str(tenant_id),),\n'
              '                    )\n'
              '                yield cursor\n',
              '        with (\n'
              '            psycopg.connect(self.dsn, row_factory=dict_row) as connection,\n'
              '            connection.cursor() as cursor,\n'
              '        ):\n'
              '            cursor.execute(sql.SQL("SET LOCAL ROLE {}").format(sql.Identifier(role)))\n'
              '            if tenant_id is not None:\n'
              '                cursor.execute(\n'
              '                    "SELECT set_config(\'app.tenant_id\', %s, true)",\n'
              '                    (str(tenant_id),),\n'
              '                )\n'
              '            yield cursor\n',
          )
          text = text.replace(
              '            cursor.execute(\n'
              '                "SELECT state, opportunity_id FROM tenant_private.research_runs WHERE research_run_id = %s",\n'
              '                (run_id,),\n'
              '            )\n',
              '            cursor.execute(\n'
              '                """\n'
              '                SELECT state, opportunity_id\n'
              '                FROM tenant_private.research_runs\n'
              '                WHERE research_run_id = %s\n'
              '                """,\n'
              '                (run_id,),\n'
              '            )\n',
          )
          text = text.replace(
              '            cursor.execute(\n'
              '                "SELECT canonical_claim_id FROM axignal_global.canonical_claims WHERE fingerprint = %s",\n'
              '                (candidate.fingerprint,),\n'
              '            )\n',
              '            cursor.execute(\n'
              '                """\n'
              '                SELECT canonical_claim_id\n'
              '                FROM axignal_global.canonical_claims\n'
              '                WHERE fingerprint = %s\n'
              '                """,\n'
              '                (candidate.fingerprint,),\n'
              '            )\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          ruff format apps/api/src/axignal_api/repository.py
          ruff check apps/api/src/axignal_api/repository.py
      - name: Commit exact formatted module
        shell: bash
        run: |
          if git diff --quiet -- apps/api/src/axignal_api/repository.py; then
            echo 'Repository module already matches Ruff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/axignal_api/repository.py
          git commit -m 'Apply Ruff fixes to persistent repository'
          git push origin HEAD:${{ github.head_ref }}
