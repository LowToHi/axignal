name: Ruff Formatted Repository

on:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/repository.py"
      - ".github/workflows/ruff-formatted-repository.yml"

permissions:
  contents: read

jobs:
  format-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12,<1'
      - name: Format isolated copy
        shell: bash
        run: |
          mkdir -p formatted/apps/api/src/axignal_api
          cp apps/api/src/axignal_api/repository.py formatted/apps/api/src/axignal_api/repository.py
          ruff check formatted/apps/api/src/axignal_api/repository.py --fix || true
          ruff format formatted/apps/api/src/axignal_api/repository.py
          ruff check formatted/apps/api/src/axignal_api/repository.py > formatted/ruff-after-format.txt 2>&1 || true
      - name: Upload formatted repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruff-formatted-repository
          path: formatted
          if-no-files-found: error
          retention-days: 7
