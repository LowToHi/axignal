name: AXIGNAL Runner Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axignal-runner-acceptance
  cancel-in-progress: false

jobs:
  accept-runner:
    name: Trusted acceptance workload
    runs-on: [self-hosted, linux, x64, axignal-ci]
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: axignal-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify runner security boundary
        shell: bash
        run: bash scripts/runner/verify-host-boundary.sh

      - name: Start bounded resource sampling
        shell: bash
        run: bash scripts/runner/sample-metrics.sh start

      - name: Set up exact Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Set up exact Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(corepack pnpm@10.12.4 --version)" = "10.12.4"
          python -c "import sys; assert sys.version_info[:2] == (3, 13)"

      - name: Validate canonical identity
        run: python3 scripts/validate_canonical_naming.py .

      - name: Install contract and API validators
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/axignal-venv"
          echo "${RUNNER_TEMP}/axignal-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/axignal-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/axignal-venv/bin/python" -m pip install -e ".[dev]" \
            jsonschema pyyaml openapi-spec-validator

      - name: Validate JSON schemas
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          files = sorted(Path("schemas").glob("*.schema.json"))
          if not files:
              raise SystemExit("No JSON schemas found")
          for path in files:
              Draft202012Validator.check_schema(
                  json.loads(path.read_text(encoding="utf-8"))
              )
              print(f"PASS {path}")
          PY

      - name: Validate skill registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("skills/registry.yaml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert data["goal_id"] == "AXIGNAL-GOAL-001"
          assert data["canonical_brand"] == "AXIGNAL"
          assert data["canonical_domain"] == "axignal.com"
          skill_ids = [item["skill_id"] for item in data["skills"]]
          assert len(skill_ids) == len(set(skill_ids)), "Duplicate skill IDs"
          print(f"PASS {path}: {len(skill_ids)} skills")
          PY

      - name: Validate OpenAPI contract
        run: openapi-spec-validator openapi/axignal-v1.yaml

      - name: Install frozen JavaScript dependency graph
        shell: bash
        run: |
          corepack pnpm@10.12.4 install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Typecheck JavaScript workspaces
        run: corepack pnpm@10.12.4 typecheck

      - name: Build product applications
        run: corepack pnpm@10.12.4 build

      - name: Run API lint and tests
        shell: bash
        run: |
          ruff check apps/api
          pytest --cov=axignal_api --cov-report=term-missing

      - name: Install Playwright browser engines
        run: corepack pnpm@10.12.4 exec playwright install chromium webkit

      - name: Run complete browser acceptance
        run: corepack pnpm@10.12.4 test:e2e

      - name: Start disposable services
        run: docker compose up --build --detach --wait

      - name: Execute synthetic PostGIS and pgvector integration
        shell: bash
        run: |
          result="$(
            docker compose exec -T postgres psql \
              -U axignal \
              -d axignal \
              -v ON_ERROR_STOP=1 \
              -Atc "SELECT ST_AsText(ST_SetSRID(ST_MakePoint(37.6173, 55.7558), 4326)) || '|' || round(('[0.1,0.2,0.3]'::vector <-> '[0.1,0.2,0.4]'::vector)::numeric, 6);"
          )"
          test "$result" = "POINT(37.6173 55.7558)|0.100000"

      - name: Execute synthetic Valkey integration
        shell: bash
        run: |
          docker compose exec -T valkey valkey-cli SET axignal:acceptance synthetic >/dev/null
          test "$(docker compose exec -T valkey valkey-cli GET axignal:acceptance)" = "synthetic"
          test "$(docker compose exec -T valkey valkey-cli DEL axignal:acceptance)" = "1"

      - name: Record bounded runner evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## AXIGNAL runner acceptance"
            echo
            echo "- Goal: \`AXIGNAL-GOAL-001\`"
            echo "- Repository: \`LowToHi/axignal\`"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Effective user: \`$(id -un)\` (uid \`$(id -u)\`)"
            echo "- Required scheduling labels: \`self-hosted, linux, x64, axignal-ci\`"
            echo "- Kernel: \`$(uname -sr)\`"
            echo "- Docker security: \`$(docker info --format '{{join .SecurityOptions ", "}}')\`"
            echo "- Root Docker socket accessible: \`$(test -r /var/run/docker.sock && echo yes || echo no)\`"
            echo "- Filesystem: \`$(df -h "$GITHUB_WORKSPACE" | tail -1 | tr -s ' ')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy services, stop sampling and verify cleanup
        if: always()
        shell: bash
        run: bash scripts/runner/destroy-acceptance.sh

  verify-clean-runner:
    name: Post-job isolation proof
    if: ${{ always() }}
    needs: accept-runner
    runs-on: [self-hosted, linux, x64, axignal-ci]
    timeout-minutes: 5
    steps:
      - name: Verify exact runner and completed-job cleanup hook
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "axignal-runner"
          test "$(id -u)" != "0"
          test "${RUNNER_NAME}" = "axignal-ci-01"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
          test -z "$(find "${GITHUB_WORKSPACE}" -mindepth 1 -print -quit 2>/dev/null)"
          while IFS= read -r container_id; do
            project="$(
              docker inspect \
                --format '{{ index .Config.Labels "com.docker.compose.project" }}' \
                "${container_id}"
            )"
            case "${project}" in
              axignal-acceptance-*)
                echo "Acceptance container remains after the completed-job hook." >&2
                exit 1
                ;;
            esac
          done < <(docker ps -aq --filter "label=com.docker.compose.project")
          while IFS= read -r volume_name; do
            project="$(
              docker volume inspect \
                --format '{{ index .Labels "com.docker.compose.project" }}' \
                "${volume_name}"
            )"
            case "${project}" in
              axignal-acceptance-*)
                echo "Acceptance volume remains after the completed-job hook." >&2
                exit 1
                ;;
            esac
          done < <(docker volume ls -q --filter "label=com.docker.compose.project")
          for port in 3000 3001 5432 6379 8000; do
            test -z "$(ss -H -ltn "sport = :${port}")"
          done
          for forbidden_path in \
            "${HOME}/.ssh/id_rsa" \
            "${HOME}/.ssh/id_ed25519" \
            "${HOME}/.env" \
            "${HOME}/.env.production"; do
            test ! -e "${forbidden_path}"
          done
          if pgrep -u "$(id -u)" -f \
            'next-server|playwright.*node|postgres.*axignal|valkey-server.*axignal' >/dev/null; then
            echo "A job-related process remains after the completed-job hook." >&2
            exit 1
          fi
          {
            echo "## AXIGNAL post-job isolation"
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Workspace from the prior job: empty"
            echo "- Test ports: closed"
            echo "- Job processes: absent"
            echo "- Forbidden credential paths: absent"
          } >> "${GITHUB_STEP_SUMMARY}"
