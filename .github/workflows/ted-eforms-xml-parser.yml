name: TED eForms XML Parser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "apps/api/src/axignal_api/connectors/ted_eforms.py"
      - "apps/api/tests/fixtures/ted_eforms_cn16_synthetic.xml"
      - "apps/api/tests/test_ted_eforms_parser.py"
      - "data/universes/eu-public-procurement/xml-parser-profile.v0.1.json"
      - "docs/roadmap/02-task-catalogue.md"
      - "docs/roadmap/tasks/AX-F8-T11.json"
      - "docs/sources/ted-eforms-xml-parser-v0.1.md"
      - "scripts/verify_ted_eforms_parser_contract.py"
      - "scripts/verify_ted_eforms_sdk_example.py"
      - ".github/workflows/ted-eforms-xml-parser.yml"

  workflow_call:
permissions:
  contents: read

concurrency:
  group: ted-eforms-xml-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-contract:
    name: Validate parser, privacy and authority contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install deterministic development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" jsonschema

      - name: Enforce lint
        run: |
          ruff check \
            apps/api/src/axignal_api/connectors/ted_eforms.py \
            apps/api/tests/test_ted_eforms_parser.py \
            scripts/verify_ted_eforms_parser_contract.py \
            scripts/verify_ted_eforms_sdk_example.py

      - name: Validate parser contract
        run: python scripts/verify_ted_eforms_parser_contract.py

      - name: Test synthetic and negative profiles
        run: pytest apps/api/tests/test_ted_eforms_parser.py

  official-sdk-example:
    name: Parse pinned official eForms SDK 1.14 example
    needs: parser-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install parser runtime
        run: python -m pip install --upgrade pip && python -m pip install -e "."

      - name: Parse transient official SDK example
        run: python scripts/verify_ted_eforms_sdk_example.py

      - name: Upload non-sensitive parser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ted-eforms-sdk-example-${{ github.sha }}
          path: ted-eforms-sdk-example-evidence.json
          if-no-files-found: error
          retention-days: 30
