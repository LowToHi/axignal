name: TED Persistent Source

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".env.example"
      - "apps/api/src/axignal_api/connectors/ted_xml.py"
      - "apps/api/src/axignal_api/persistent_procurement_research.py"
      - "apps/api/src/axignal_api/procurement_*.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/fixtures/ted_*"
      - "apps/api/tests/test_ted_persistent_source.py"
      - "data/sources/ted-search-api-v3.v1.0.json"
      - "data/universes/eu-public-procurement/claim-policy.v1.0.json"
      - "docs/roadmap/15-ted-persistent-source.md"
      - "docs/roadmap/tasks/AX-F8-T14.json"
      - "docs/runbooks/ted-persistent-source.md"
      - "docs/sources/ted-product-admission-v1.0.md"
      - "infra/postgres/070-ted-persistent-source.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/verify_official_ted_sdk_samples.py"
      - "scripts/verify_ted_*"
      - ".github/workflows/ted-persistent-source.yml"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - "apps/api/src/axignal_api/connectors/ted_xml.py"
      - "apps/api/src/axignal_api/persistent_procurement_research.py"
      - "apps/api/src/axignal_api/procurement_*.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/tests/fixtures/ted_*"
      - "apps/api/tests/test_ted_persistent_source.py"
      - "data/sources/ted-search-api-v3.v1.0.json"
      - "data/universes/eu-public-procurement/claim-policy.v1.0.json"
      - "docs/roadmap/15-ted-persistent-source.md"
      - "docs/roadmap/tasks/AX-F8-T14.json"
      - "docs/runbooks/ted-persistent-source.md"
      - "docs/sources/ted-product-admission-v1.0.md"
      - "infra/postgres/070-ted-persistent-source.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/verify_official_ted_sdk_samples.py"
      - "scripts/verify_ted_*"
      - ".github/workflows/ted-persistent-source.yml"

permissions:
  contents: read

concurrency:
  group: ted-persistent-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-official-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install deterministic dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Enforce focused lint
        run: |
          ruff check \
            apps/api/src/axignal_api/connectors/ted_xml.py \
            apps/api/src/axignal_api/persistent_procurement_research.py \
            apps/api/src/axignal_api/procurement_admission_runtime.py \
            apps/api/src/axignal_api/procurement_persistent_types.py \
            apps/api/src/axignal_api/procurement_queue.py \
            apps/api/src/axignal_api/procurement_repository.py \
            apps/api/src/axignal_api/procurement_retrieval_runtime.py \
            apps/api/tests/test_ted_persistent_source.py \
            scripts/verify_official_ted_sdk_samples.py \
            scripts/verify_ted_persistent_contract.py \
            scripts/verify_ted_persistent_source.py
      - name: Verify rights, privacy and runtime contract
        run: python scripts/verify_ted_persistent_contract.py
      - name: Run focused unit tests
        run: pytest apps/api/tests/test_ted_persistent_source.py
      - name: Verify official SDK correction and result samples
        run: python scripts/verify_official_ted_sdk_samples.py
      - name: Upload non-sensitive official evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ted-official-sdk-samples-${{ github.sha }}
          path: ted-official-sdk-sample-evidence.json
          if-no-files-found: error
          retention-days: 30

  persistent-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_TED_DATABASE_URL: postgresql://axignal_ted_worker:axignal_ted_worker@127.0.0.1:5432/axignal
      AXIGNAL_TED_ADMISSION_DATABASE_URL: postgresql://axignal_ted_admission_runtime:axignal_ted_admission_runtime@127.0.0.1:5432/axignal
      AXIGNAL_VALKEY_URL: redis://127.0.0.1:6379/0
      AXIGNAL_TED_RESEARCH_ENABLED: "true"
      AXIGNAL_TED_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_TED_FIXTURE_MANIFEST_PATH: apps/api/tests/fixtures/ted_persistent_fixture_manifest.json
      AXIGNAL_TED_RETRIEVAL_QUEUE_KEY: axignal:ted:retrieval:queue:ci
      AXIGNAL_TED_ADMISSION_QUEUE_KEY: axignal:ted:admission:queue:ci
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install deterministic dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Start disposable PostgreSQL and Valkey
        run: docker compose up --build --detach --wait postgres valkey
      - name: Rehearse migration replay and pre-070 restore
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify_ted_migration_rehearsal.sh 2>&1 | tee ted-migration-rehearsal.log
      - name: Run isolated persistent TED acceptance
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_ted_persistent_source.py 2>&1 | tee ted-persistent-source.log
      - name: Upload runtime and restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ted-persistent-runtime-${{ github.sha }}
          path: |
            ted-migration-rehearsal.log
            ted-persistent-source.log
            ted-persistent-source-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Destroy disposable services
        if: always()
        run: docker compose down --volumes --remove-orphans
