name: TED Product Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/src/axignal_api/ted_*.py"
      - "apps/api/src/axignal_api/persistent_ted_research.py"
      - "apps/api/src/axignal_api/worker.py"
      - "apps/api/src/axignal_api/settings.py"
      - "apps/api/tests/test_ted_product_runtime.py"
      - "apps/api/tests/fixtures/ted_search_probe.json"
      - "apps/web/app/api/research/runs/route.ts"
      - "apps/web/lib/navigator-client.ts"
      - "data/sources/ted-search-api-v3.v0.1.json"
      - "data/universes/eu-public-procurement/ted-product-admission-profile.v0.1.json"
      - "docs/security/AX-F8-T14-ted-runtime-security-review.md"
      - "docs/sources/ted-product-admission-v0.1.md"
      - "docs/roadmap/tasks/AX-F8-T14.json"
      - "infra/pilot/compose.yaml"
      - "infra/postgres/070-ted-product-runtime.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/verify_ted_product_runtime.py"
      - "scripts/verify_ted_security_review.py"
      - "scripts/verify_ted_persistent_e2e.py"
      - "scripts/benchmark_ted_product_runtime.py"
      - ".github/workflows/ted-product-runtime.yml"

  workflow_call:
permissions:
  contents: read

concurrency:
  group: ted-product-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Bounded source, deterministic authority and UI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install deterministic development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enforce focused Python lint
        run: |
          ruff check \
            apps/api/src/axignal_api/ted_runtime.py \
            apps/api/src/axignal_api/ted_repository.py \
            apps/api/src/axignal_api/persistent_ted_research.py \
            apps/api/src/axignal_api/worker.py \
            apps/api/src/axignal_api/settings.py \
            apps/api/tests/test_ted_product_runtime.py \
            scripts/verify_ted_product_runtime.py \
            scripts/verify_ted_security_review.py \
            scripts/verify_ted_persistent_e2e.py \
            scripts/benchmark_ted_product_runtime.py

      - name: Run bounded TED tests
        run: pytest apps/api/tests/test_ted_connector.py apps/api/tests/test_ted_product_runtime.py

      - name: Verify product admission and authority wiring
        run: python scripts/verify_ted_product_runtime.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"

      - name: Typecheck Navigator integration
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @axignal/web typecheck

  security-review:
    name: Independent identity, tenant, authority and export review
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install security review dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run adversarial boundary tests
        run: |
          pytest apps/api/tests/test_ted_product_runtime.py \
            -k "forged_identity or expired_identity or tenant_injection or kill_switch or live_activation"
      - name: Execute independent security contract
        run: python scripts/verify_ted_security_review.py | tee ted-security-review.json
      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ted-security-review-${{ github.sha }}
          path: ted-security-review.json
          if-no-files-found: error
          retention-days: 1

  persistent-e2e:
    name: Identity to tenant, worker, admission, dossier and polling view
    needs: [contract, security-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_VALKEY_URL: redis://127.0.0.1:6379/0
      AXIGNAL_PERSISTENT_RESEARCH_ENABLED: "true"
      AXIGNAL_TED_PROCUREMENT_ENABLED: "true"
      AXIGNAL_TED_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_TED_FIXTURE_PATH: apps/api/tests/fixtures/ted_search_probe.json
      AXIGNAL_RESEARCH_QUEUE_KEY: axignal:research:queue:ted-ci
      AXIGNAL_IDENTITY_ASSERTION_SECRET: ci-identity-assertion-secret-with-at-least-32-bytes
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Start disposable PostgreSQL and Valkey
        run: docker compose up -d --build postgres valkey

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Execute authenticated persistent TED circuit
        run: python scripts/verify_ted_persistent_e2e.py

      - name: Upload non-sensitive E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ted-product-runtime-${{ github.sha }}
          path: ted-product-runtime-evidence.json
          if-no-files-found: error
          retention-days: 1

      - name: Dump service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color postgres valkey

      - name: Stop disposable services
        if: always()
        run: docker compose down -v

  metrics:
    name: Latency, completeness, cost, failure and rollback metrics
    needs: persistent-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_VALKEY_URL: redis://127.0.0.1:6379/0
      AXIGNAL_PERSISTENT_RESEARCH_ENABLED: "true"
      AXIGNAL_TED_PROCUREMENT_ENABLED: "true"
      AXIGNAL_TED_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_LIVE_SOURCES_ENABLED: "false"
      AXIGNAL_TED_FIXTURE_PATH: apps/api/tests/fixtures/ted_search_probe.json
      AXIGNAL_RESEARCH_QUEUE_KEY: axignal:research:queue:ted-metrics-ci
      AXIGNAL_IDENTITY_ASSERTION_SECRET: ci-identity-assertion-secret-with-at-least-32-bytes
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Start clean metric dependencies
        run: docker compose up -d --build postgres valkey
      - name: Install runtime
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Measure the persistent runtime
        run: python scripts/benchmark_ted_product_runtime.py
      - name: Upload reproducible metric evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ted-product-runtime-metrics-${{ github.sha }}
          path: ted-product-runtime-metrics.json
          if-no-files-found: error
          retention-days: 1
      - name: Dump metric service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color postgres valkey
      - name: Stop metric dependencies
        if: always()
        run: docker compose down -v
