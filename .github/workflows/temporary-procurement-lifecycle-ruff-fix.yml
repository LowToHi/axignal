name: Temporary Procurement Lifecycle Ruff Fix

on:
  push:
    branches:
      - agent/f8-procurement-lifecycle-dossier-v0.1
    paths:
      - "apps/api/src/axignal_api/procurement_lifecycle_rehearsal.py"
      - ".github/workflows/temporary-procurement-lifecycle-ruff-fix.yml"

permissions:
  contents: write

jobs:
  fix-and-retire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/f8-procurement-lifecycle-dossier-v0.1
          persist-credentials: true

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply deterministic import fix
        run: |
          set -euo pipefail
          ruff check --fix apps/api/src/axignal_api/procurement_lifecycle_rehearsal.py
          ruff check apps/api/src/axignal_api/procurement_lifecycle_rehearsal.py

      - name: Retire temporary workflow and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-procurement-lifecycle-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/axignal_api/procurement_lifecycle_rehearsal.py
          git commit -m "Fix procurement lifecycle import ordering"
          git push origin HEAD:agent/f8-procurement-lifecycle-dossier-v0.1
