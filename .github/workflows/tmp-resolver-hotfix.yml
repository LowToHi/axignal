name: Temporary Resolver Hotfix

on:
  push:
    branches:
      - agent/public-landing-resolver-hotfix-v0.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/public-landing-resolver-hotfix-v0.1
          fetch-depth: 0

      - name: Patch resolver parser and add regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deploy_path = Path('infra/landing/deploy.sh')
          deploy = deploy_path.read_text(encoding='utf-8')
          old = 'for name in re.findall(r"--certificatesresolvers\\.([A-Za-z0-9_.-]+)\\.", args, re.I):'
          new = 'for name in re.findall(r"--certificatesresolvers\\.([A-Za-z0-9_-]+)\\.", args, re.I):'
          if deploy.count(old) != 1:
              raise SystemExit(f'expected exactly one greedy resolver parser, found {deploy.count(old)}')
          deploy_path.write_text(deploy.replace(old, new), encoding='utf-8')

          test_path = Path('scripts/verify_traefik_resolver_parser.py')
          test_path.write_text('''from __future__ import annotations

import re
from pathlib import Path

DEPLOY_PATH = Path("infra/landing/deploy.sh")
EXPECTED_LINE = (
    'for name in re.findall(r"--certificatesresolvers\\\\.([A-Za-z0-9_-]+)\\\\.", '
    'args, re.I):'
)
PATTERN = r"--certificatesresolvers\\.([A-Za-z0-9_-]+)\\."

source = DEPLOY_PATH.read_text(encoding="utf-8")
assert EXPECTED_LINE in source
assert "[A-Za-z0-9_.-]+" not in source.split("--certificatesresolvers", 1)[1].split("args, re.I", 1)[0]

real_args = """
--entrypoints.web.address=:80
--entrypoints.websecure.address=:443
--certificatesresolvers.letsencrypt.acme.email=ops@example.com
--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
--certificatesresolvers.letsencrypt.acme.httpchallenge=true
--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
"""
assert sorted(set(re.findall(PATTERN, real_args, re.I))) == ["letsencrypt"]

multiple_roots = real_args + "\\n--certificatesresolvers.backup.acme.storage=/backup.json\\n"
assert sorted(set(re.findall(PATTERN, multiple_roots, re.I))) == ["backup", "letsencrypt"]

print("traefik resolver parser contract: PASS")
''', encoding='utf-8')

          candidate_path = Path('.github/workflows/public-landing-release-candidate.yml')
          candidate = candidate_path.read_text(encoding='utf-8')
          marker = '          bash -n infra/landing/deploy.sh\n'
          addition = marker + '          python3 scripts/verify_traefik_resolver_parser.py\n'
          if 'python3 scripts/verify_traefik_resolver_parser.py' not in candidate:
              if candidate.count(marker) != 1:
                  raise SystemExit('release candidate validation marker not found exactly once')
              candidate = candidate.replace(marker, addition)
              candidate_path.write_text(candidate, encoding='utf-8')

          Path('.github/workflows/tmp-resolver-hotfix.yml').unlink()
          PY

          bash -n infra/landing/deploy.sh
          python3 scripts/verify_traefik_resolver_parser.py

      - name: Commit self-retiring hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Traefik resolver root parsing"
          git push origin HEAD:agent/public-landing-resolver-hotfix-v0.1
