name: Trial Retention Lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/src/axignal_api/retention_*.py"
      - "apps/api/tests/test_retention_runtime.py"
      - "infra/postgres/090-trial-retention-lifecycle.sql"
      - "infra/postgres/091-retention-pgcrypto-boundary.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/trial_grant_fixture.py"
      - "scripts/verify_trial_retention_*.py"
      - "docs/security/AX-F9-T15-retention-deletion-boundary.md"
      - "docs/roadmap/tasks/AX-F9-T15.json"
      - ".github/workflows/trial-retention-lifecycle.yml"
  push:
    branches: [main, "agent/**"]
    paths:
      - "apps/api/src/axignal_api/application.py"
      - "apps/api/src/axignal_api/retention_*.py"
      - "apps/api/tests/test_retention_runtime.py"
      - "infra/postgres/090-trial-retention-lifecycle.sql"
      - "infra/postgres/091-retention-pgcrypto-boundary.sql"
      - "infra/postgres/Dockerfile"
      - "scripts/trial_grant_fixture.py"
      - "scripts/verify_trial_retention_*.py"
      - "docs/security/AX-F9-T15-retention-deletion-boundary.md"
      - "docs/roadmap/tasks/AX-F9-T15.json"
      - ".github/workflows/trial-retention-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: trial-retention-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Disabled-by-default retention and API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install deterministic development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Enforce focused Python lint
        run: |
          ruff check \
            apps/api/src/axignal_api/application.py \
            apps/api/src/axignal_api/retention_config.py \
            apps/api/src/axignal_api/retention_repository.py \
            apps/api/src/axignal_api/retention_routes.py \
            apps/api/src/axignal_api/retention_worker.py \
            apps/api/tests/test_retention_runtime.py \
            scripts/trial_grant_fixture.py \
            scripts/verify_trial_retention_contract.py \
            scripts/verify_trial_retention_e2e.py
      - name: Run identity, request and kill-switch tests
        run: pytest apps/api/tests/test_retention_runtime.py
      - name: Verify normative retention contract
        run: python scripts/verify_trial_retention_contract.py | tee trial-retention-contract.json
      - name: Upload contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trial-retention-contract-${{ github.sha }}
          path: trial-retention-contract.json
          if-no-files-found: error
          retention-days: 30

  retention-e2e:
    name: Expiry, suspension, purge, isolation and restore E2E
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AXIGNAL_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_ENTITLEMENT_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_RETENTION_DATABASE_URL: postgresql://axignal:axignal@127.0.0.1:5432/axignal
      AXIGNAL_TRIAL_RUNTIME_ENABLED: "true"
      AXIGNAL_DELETION_REQUESTS_ENABLED: "true"
      AXIGNAL_PURGE_WORKER_ENABLED: "true"
      AXIGNAL_OPERATOR_SUSPENSION_ENABLED: "true"
      AXIGNAL_TRIAL_RETENTION_SECONDS: "1"
      AXIGNAL_PURGE_LEASE_SECONDS: "60"
      AXIGNAL_IDENTITY_ASSERTION_SECRET: ci-retention-identity-secret-with-at-least-32-bytes
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Start disposable PostgreSQL
        run: docker compose up -d --build postgres
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Seed canonical active trial grants
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import UTC, datetime
          from uuid import UUID

          sys.path.insert(0, "scripts")
          from trial_grant_fixture import ensure_active_trial_grant

          dsn = os.environ["AXIGNAL_DATABASE_URL"]
          started_at = datetime(2026, 7, 29, 20, 0, tzinfo=UTC)
          for tenant_id in (
              UUID("aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"),
              UUID("bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"),
          ):
              ensure_active_trial_grant(dsn, tenant_id=tenant_id, now=started_at)
          PY
      - name: Execute terminal deletion circuit
        run: python scripts/verify_trial_retention_e2e.py
      - name: Upload non-sensitive E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trial-retention-e2e-${{ github.sha }}
          path: artifacts/trial-retention-e2e.json
          if-no-files-found: error
          retention-days: 30
      - name: Dump PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Stop disposable services
        if: always()
        run: docker compose down -v
