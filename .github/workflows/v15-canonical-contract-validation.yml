name: V1.5 Canonical Contract Validation

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

env:
  AXIGNAL_EXACT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-v15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AXIGNAL_EXACT_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact-head checkout 1
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "$AXIGNAL_EXACT_SHA"
          {
            printf 'exact_head_sha=%s\n' "$actual_sha"
            printf 'git_tree_sha=%s\n' "$tree_sha"
          } | tee v15-canonical-contract-validation-exact-head-1.txt

      - name: Upload exact-head identity 1
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v15-canonical-contract-validation-exact-head-1-${{ env.AXIGNAL_EXACT_SHA }}
          path: v15-canonical-contract-validation-exact-head-1.txt
          if-no-files-found: error
          retention-days: 30
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install validator
        run: python -m pip install jsonschema

      - name: Validate v1.5 canonical programme
        run: python scripts/verify_global_e2e_contract_v15.py

      - name: Reject activation and secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            'public_launch_authorised[[:space:]]*[:=][[:space:]]*true|public_indexing_authorised[[:space:]]*[:=][[:space:]]*true|live_self_service_billing_authorised[[:space:]]*[:=][[:space:]]*true|production_mcp_authorised[[:space:]]*[:=][[:space:]]*true' \
            docs/contracts/31-global-e2e-development-contract-v1.5.md \
            docs/roadmap/15-global-e2e-development-program-v1.5.md \
            data/programmes/global-e2e-canonical-state.v1.5.json \
            data/growth/google-search-console-integration.v0.1.json; then
            echo "Premature activation literal found"
            exit 1
          fi

          if grep -RInE \
            'BEGIN PRIVATE KEY|client_secret[[:space:]]*[:=]|refresh_token[[:space:]]*[:=]|GSC_CREDENTIALS_JSON|STRIPE_LIVE_SECRET' \
            docs/contracts/31-global-e2e-development-contract-v1.5.md \
            docs/growth/google-search-console-and-mcp-governance-v0.1.md \
            data/growth/google-search-console-integration.v0.1.json \
            data/programmes/global-e2e-canonical-state.v1.5.json; then
            echo "Credential or live-secret material found"
            exit 1
          fi

      - name: Upload non-sensitive contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axignal-v15-canonical-contract-evidence-${{ env.AXIGNAL_EXACT_SHA }}
          path: |
            docs/contracts/31-global-e2e-development-contract-v1.5.md
            docs/adr/ADR-016-v1-5-canonical-programme-and-final-launch-gate.md
            docs/roadmap/15-global-e2e-development-program-v1.5.md
            data/programmes/global-e2e-canonical-state.v1.5.json
            data/programmes/global-e2e-task-registry.v1.5.json
            data/programmes/global-e2e-tasks-p25-p27.v1.5.json
            data/growth/google-search-console-integration.v0.1.json
