name: World Bank Live Source Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/axignal_api/connectors/world_bank.py"
      - "scripts/verify_world_bank_live_source.py"
      - ".github/workflows/world-bank-live-source-smoke.yml"
  push:
    branches:
      - agent/persistent-research-spine-v0.1
    paths:
      - "apps/api/src/axignal_api/connectors/world_bank.py"
      - "scripts/verify_world_bank_live_source.py"
      - ".github/workflows/world-bank-live-source-smoke.yml"

permissions:
  contents: read

concurrency:
  group: world-bank-live-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-source:
    name: Exact allowlisted institutional API retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install connector runtime
        run: python -m pip install --upgrade pip && python -m pip install -e "."
      - name: Retrieve admitted World Bank indicator
        env:
          AXIGNAL_LIVE_SOURCES_ENABLED: "true"
        run: python scripts/verify_world_bank_live_source.py
      - name: Upload source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: world-bank-live-source-evidence
          path: world-bank-live-source-evidence.json
          if-no-files-found: error
          retention-days: 1
