services:
  postgres:
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_DB: axignal
      POSTGRES_USER: axignal
      POSTGRES_PASSWORD: axignal
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axignal -d axignal"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - axignal-postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  axignal-postgres:
