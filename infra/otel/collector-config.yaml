receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  batch: {}
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: api_key
        action: delete
      - key: password
        action: delete
      - key: prompt
        action: delete
      - key: document
        action: delete
      - key: email
        action: delete

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
