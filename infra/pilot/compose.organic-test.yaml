services:
  api:
    environment:
      AXIGNAL_ORGANIC_DISCOVERY_ENABLED: "true"
      AXIGNAL_ORGANIC_PUBLIC_INDEXING_ENABLED: "true"
      AXIGNAL_TENDER_ALERTS_ENABLED: "true"
      AXIGNAL_ORGANIC_DATABASE_URL: postgresql://${AXIGNAL_POSTGRES_USER:-axignal}:${AXIGNAL_POSTGRES_PASSWORD}@postgres:5432/${AXIGNAL_POSTGRES_DB:-axignal}
      AXIGNAL_ORGANIC_HMAC_PEPPER: ${AXIGNAL_ORGANIC_HMAC_PEPPER:?required}
      AXIGNAL_PUBLIC_SITE_URL: ${AXIGNAL_ORGANIC_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
      AXIGNAL_PUBLIC_APP_URL: ${AXIGNAL_ORGANIC_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
      AXIGNAL_WEBAUTHN_RP_ID: ${AXIGNAL_ORGANIC_WEBAUTHN_RP_ID:-127.0.0.1}
      AXIGNAL_WEBAUTHN_ORIGIN: ${AXIGNAL_ORGANIC_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
      AXIGNAL_ENVIRONMENT: test
      AXIGNAL_TEST_RUNTIME_ENABLED: "true"

  web:
    environment:
      AXIGNAL_ORGANIC_DISCOVERY_ENABLED: "true"
      AXIGNAL_ORGANIC_PUBLIC_INDEXING_ENABLED: "true"
      AXIGNAL_TENDER_ALERTS_ENABLED: "true"
      AXIGNAL_PUBLIC_SITE_URL: ${AXIGNAL_ORGANIC_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
      AXIGNAL_PUBLIC_ORIGIN: ${AXIGNAL_ORGANIC_PUBLIC_ORIGIN:-http://127.0.0.1:18080}
      AXIGNAL_ENVIRONMENT: test
      AXIGNAL_TEST_RUNTIME_ENABLED: "true"
