services:
  api:
    command:
      - sh
      - -ec
      - |
        python -m axignal_api.seat_identity_test_seed
        exec uvicorn axignal_api.application:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      AXIGNAL_SEAT_GOVERNANCE_ENABLED: "true"
      AXIGNAL_SEAT_DATABASE_URL: postgresql://${AXIGNAL_POSTGRES_USER:-axignal}:${AXIGNAL_POSTGRES_PASSWORD}@postgres:5432/${AXIGNAL_POSTGRES_DB:-axignal}
      AXIGNAL_AUTH_EMAIL: ${AXIGNAL_AUTH_EMAIL:?required}
      AXIGNAL_AUTH_SUBJECT: ${AXIGNAL_AUTH_SUBJECT:?required}
      AXIGNAL_ORGANISATION_OWNER_SUBJECTS: ${AXIGNAL_AUTH_SUBJECT:?required}
      AXIGNAL_SEAT_INVITATION_PROVIDER: test
      AXIGNAL_SEAT_INVITATION_TTL_HOURS: "72"
      AXIGNAL_PUBLIC_APP_URL: http://localhost:18080
      AXIGNAL_IDENTITY_RUNTIME_ENABLED: "true"
      AXIGNAL_IDENTITY_DATABASE_URL: postgresql://${AXIGNAL_POSTGRES_USER:-axignal}:${AXIGNAL_POSTGRES_PASSWORD}@postgres:5432/${AXIGNAL_POSTGRES_DB:-axignal}
      AXIGNAL_ENVIRONMENT: test
      AXIGNAL_TEST_RUNTIME_ENABLED: "true"
      AXIGNAL_WEBAUTHN_RP_ID: localhost
      AXIGNAL_WEBAUTHN_RP_NAME: AXIGNAL
      AXIGNAL_WEBAUTHN_ORIGIN: http://localhost:18080
      AXIGNAL_IDENTITY_HMAC_PEPPER: ${AXIGNAL_IDENTITY_HMAC_PEPPER:-ci-seat-identity-hmac-pepper-with-at-least-48-bytes-123456}
      AXIGNAL_IDENTITY_EMAIL_PROVIDER: test
      AXIGNAL_IDENTITY_BOT_PROVIDER: test
      AXIGNAL_IDENTITY_SESSION_IDLE_SECONDS: "3600"
      AXIGNAL_IDENTITY_SESSION_ABSOLUTE_SECONDS: "86400"
      AXIGNAL_IDENTITY_SESSION_TOUCH_SECONDS: "300"
      AXIGNAL_IDENTITY_CHALLENGE_TTL_SECONDS: "600"
      AXIGNAL_TRIAL_FULL_TOKEN_BUDGET: "1000000"
      AXIGNAL_TRIAL_RESTRICTED_TOKEN_BUDGET: "250000"
      AXIGNAL_TRIAL_FULL_COST_BUDGET_MICROUNITS: "5000000"
      AXIGNAL_TRIAL_RESTRICTED_COST_BUDGET_MICROUNITS: "1000000"

  web:
    environment:
      AXIGNAL_SEAT_GOVERNANCE_UI_ENABLED: "true"
      AXIGNAL_IDENTITY_RUNTIME_ENABLED: "true"
      AXIGNAL_TEST_RUNTIME_ENABLED: "true"
      AXIGNAL_PUBLIC_ORIGIN: http://localhost:18080
