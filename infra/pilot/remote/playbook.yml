---
- name: Bootstrap and deploy the AXIGNAL private pilot
  hosts: pilot
  become: true
  gather_facts: true
  vars:
    axignal_root: /opt/axignal
    axignal_state_root: /var/lib/axignal/ops
    axignal_backup_root: /var/backups/axignal
    axignal_env_path: /etc/axignal/pilot.env
    axignal_credential_root: /etc/axignal/private
    axignal_operator_password_path: /etc/axignal/private/operator-password.pending
    axignal_credential_metadata_path: /var/lib/axignal/ops/credential-metadata.json
    axignal_repo_url: https://github.com/LowToHi/axignal.git
    axignal_backup_retention_days: 14
    axignal_min_free_gb: 5
    axignal_edge_mode: standalone
    axignal_standalone_http_port: 80
    axignal_standalone_https_port: 443
    axignal_internal_http_port: 18080
    axignal_traefik_container_name: traefik-aiwf-traefik-1
    axignal_traefik_dynamic_dir: /etc/traefik/dynamic
    axignal_traefik_entrypoint: websecure
    axignal_traefik_cert_resolver: letsencrypt
  pre_tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version('24.04', '>=')
        fail_msg: AXIGNAL remote pilot requires Ubuntu 24.04 or newer.

    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - axignal_deploy_sha is match('^[0-9a-f]{40}$')
          - axignal_site_address is match('^https://[A-Za-z0-9.-]+$')
          - axignal_acme_email is match('^[^@ ]+@[^@ ]+\.[^@ ]+$')
          - axignal_auth_email is match('^[^@ ]+@[^@ ]+\.[^@ ]+$')
          - axignal_auth_subject | length >= 3
          - axignal_edge_mode in ['standalone', 'shared-traefik']
          - axignal_edge_mode != 'shared-traefik' or axignal_internal_http_port | int >= 1024
          - axignal_edge_mode != 'shared-traefik' or axignal_internal_http_port | int <= 65535
          - axignal_internal_http_port | int not in [80, 443]
        fail_msg: Exact SHA, confirmed identities, HTTPS site and valid edge boundary are required.

  tasks:
    - name: Install host dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - git
          - python3
          - python3-apt
          - ufw
          - unattended-upgrades
          - util-linux
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Create AXIGNAL operator group
      ansible.builtin.group:
        name: axignal
        system: true

    - name: Create AXIGNAL operator user
      ansible.builtin.user:
        name: axignal
        group: axignal
        groups: docker
        append: true
        system: true
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create protected AXIGNAL directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/axignal, owner: root, group: axignal, mode: '0750'}
        - {path: "{{ axignal_credential_root }}", owner: root, group: root, mode: '0700'}
        - {path: /usr/local/lib/axignal, owner: root, group: root, mode: '0755'}
        - {path: "{{ axignal_root }}", owner: root, group: axignal, mode: '0750'}
        - {path: "{{ axignal_root }}/releases", owner: root, group: axignal, mode: '0750'}
        - {path: "{{ axignal_state_root }}", owner: root, group: axignal, mode: '0750'}
        - {path: "{{ axignal_backup_root }}", owner: root, group: axignal, mode: '0750'}

    - name: Install remote operation helpers
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {src: files/axignal-remote-deploy, dest: /usr/local/sbin/axignal-remote-deploy, mode: '0755'}
        - {src: files/axignal-remote-verify, dest: /usr/local/sbin/axignal-remote-verify, mode: '0755'}
        - {src: files/axignal-remote-backup, dest: /usr/local/sbin/axignal-remote-backup, mode: '0755'}
        - {src: files/axignal-remote-rollback, dest: /usr/local/sbin/axignal-remote-rollback, mode: '0755'}
        - {src: files/axignal-remote-watchdog, dest: /usr/local/sbin/axignal-remote-watchdog, mode: '0755'}
        - {src: files/axignal-remote-rotate-operator, dest: /usr/local/sbin/axignal-remote-rotate-operator, mode: '0755'}
        - {src: files/axignal-remote-retire-operator-credential, dest: /usr/local/sbin/axignal-remote-retire-operator-credential, mode: '0755'}
        - {src: files/compose_boundary.sh, dest: /usr/local/lib/axignal/compose_boundary.sh, mode: '0644'}
        - {src: prepare_env.py, dest: /usr/local/lib/axignal/prepare_env.py, mode: '0755'}
        - {src: files/remote_state.py, dest: /usr/local/lib/axignal/remote_state.py, mode: '0755'}

    - name: Inspect shared Traefik runtime boundary
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{.State.Running}}|{{.HostConfig.NetworkMode}}|{{.State.StartedAt}}' }}"
          - "{{ axignal_traefik_container_name }}"
      register: axignal_traefik_runtime
      changed_when: false
      when: axignal_edge_mode == 'shared-traefik'
      no_log: true

    - name: Require running host-network Traefik
      ansible.builtin.assert:
        that:
          - axignal_traefik_runtime.stdout is match('^true\|host\|.+$')
        fail_msg: Shared edge mode requires the approved running host-network Traefik boundary.
      when: axignal_edge_mode == 'shared-traefik'

    - name: Inspect approved Traefik static arguments
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{json .Config.Cmd}}' }}"
          - "{{ axignal_traefik_container_name }}"
      register: axignal_traefik_static
      changed_when: false
      when: axignal_edge_mode == 'shared-traefik'
      no_log: true

    - name: Require the confirmed Traefik resolver and ACME contact
      ansible.builtin.assert:
        that:
          - "'--entrypoints.' ~ axignal_traefik_entrypoint ~ '.address=:443' in axignal_traefik_static.stdout"
          - "'--providers.file.directory=' ~ axignal_traefik_dynamic_dir in axignal_traefik_static.stdout"
          - "'--certificatesresolvers.' ~ axignal_traefik_cert_resolver ~ '.acme.email=' ~ axignal_acme_email in axignal_traefik_static.stdout"
        fail_msg: Confirmed Traefik entrypoint, file provider and ACME contact must match the existing static boundary.
      when: axignal_edge_mode == 'shared-traefik'
      no_log: true

    - name: Snapshot running containers before AXIGNAL deployment
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - "--format={{ '{{.Names}}' }}"
      register: axignal_preexisting_containers
      changed_when: false
      no_log: true

    - name: Inspect Traefik dynamic configuration directory
      ansible.builtin.stat:
        path: "{{ axignal_traefik_dynamic_dir }}"
      register: axignal_traefik_dynamic
      when: axignal_edge_mode == 'shared-traefik'

    - name: Require existing Traefik file-provider directory
      ansible.builtin.assert:
        that:
          - axignal_traefik_dynamic.stat.exists
          - axignal_traefik_dynamic.stat.isdir
        fail_msg: Shared edge mode will not create or replace the Traefik file-provider boundary.
      when: axignal_edge_mode == 'shared-traefik'

    - name: Inspect existing private pilot environment
      ansible.builtin.stat:
        path: "{{ axignal_env_path }}"
      register: axignal_env
      no_log: true

    - name: Inspect first-deployment loopback port
      ansible.builtin.command:
        argv:
          - ss
          - -H
          - -ltn
          - "sport = :{{ axignal_internal_http_port }}"
      register: axignal_internal_port_listener
      changed_when: false
      when:
        - axignal_edge_mode == 'shared-traefik'
        - not axignal_env.stat.exists

    - name: Require an unused first-deployment loopback port
      ansible.builtin.assert:
        that:
          - axignal_internal_port_listener.stdout | length == 0
        fail_msg: The selected AXIGNAL loopback port is already in use.
      when:
        - axignal_edge_mode == 'shared-traefik'
        - not axignal_env.stat.exists

    - name: Generate host-only pilot credentials and environment
      ansible.builtin.command:
        argv:
          - python3
          - /usr/local/lib/axignal/prepare_env.py
          - create
          - --output
          - "{{ axignal_env_path }}"
          - --password-output
          - "{{ axignal_operator_password_path }}"
          - --metadata-output
          - "{{ axignal_credential_metadata_path }}"
          - --sha
          - "{{ axignal_deploy_sha }}"
          - --site-address
          - "{{ axignal_site_address }}"
          - --acme-email
          - "{{ axignal_acme_email }}"
          - --auth-email
          - "{{ axignal_auth_email }}"
          - --auth-subject
          - "{{ axignal_auth_subject }}"
          - --edge-mode
          - "{{ axignal_edge_mode }}"
          - --http-port
          - "{{ axignal_internal_http_port if axignal_edge_mode == 'shared-traefik' else axignal_standalone_http_port }}"
          - --https-port
          - "{{ axignal_standalone_https_port }}"
      when: not axignal_env.stat.exists
      no_log: true

    - name: Inspect generated private files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ axignal_env_path }}"
        - "{{ axignal_credential_metadata_path }}"
      register: axignal_private_files
      no_log: true

    - name: Require root-owned mode-0600 private files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
        fail_msg: Pilot credentials and metadata must be root-owned regular files with mode 0600.
      loop: "{{ axignal_private_files.results }}"
      no_log: true

    - name: Inspect pending operator password
      ansible.builtin.stat:
        path: "{{ axignal_operator_password_path }}"
      register: axignal_operator_password
      no_log: true

    - name: Require a protected temporary password after initial generation
      ansible.builtin.assert:
        that:
          - axignal_operator_password.stat.exists
          - axignal_operator_password.stat.isreg
          - axignal_operator_password.stat.pw_name == 'root'
          - axignal_operator_password.stat.mode == '0600'
        fail_msg: Initial host-only credential generation did not create a protected password file.
      when: not axignal_env.stat.exists
      no_log: true

    - name: Install isolated AXIGNAL Traefik route
      ansible.builtin.template:
        src: templates/axignal-pilot-traefik.yml.j2
        dest: "{{ axignal_traefik_dynamic_dir }}/axignal-pilot.yml"
        owner: root
        group: root
        mode: '0644'
      when: axignal_edge_mode == 'shared-traefik'

    - name: Configure firewall defaults
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - {direction: incoming, policy: deny}
        - {direction: outgoing, policy: allow}

    - name: Allow SSH, HTTP and HTTPS only
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ ansible_port | default(22) }}"
        - '80'
        - '443'

    - name: Enable firewall
      community.general.ufw:
        state: enabled

    - name: Install systemd services and timers
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - {src: templates/axignal-pilot-backup.service.j2, dest: axignal-pilot-backup.service}
        - {src: templates/axignal-pilot-backup.timer.j2, dest: axignal-pilot-backup.timer}
        - {src: templates/axignal-pilot-watchdog.service.j2, dest: axignal-pilot-watchdog.service}
        - {src: templates/axignal-pilot-watchdog.timer.j2, dest: axignal-pilot-watchdog.timer}
      notify: Reload systemd

    - name: Deploy exact approved SHA
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/axignal-remote-deploy
          - "{{ axignal_deploy_sha }}"
          - "{{ axignal_operator_password_path if axignal_operator_password.stat.exists else '' }}"
      environment:
        AXIGNAL_REMOTE_ROOT: "{{ axignal_root }}"
        AXIGNAL_PILOT_ENV_FILE: "{{ axignal_env_path }}"
        AXIGNAL_REMOTE_STATE_ROOT: "{{ axignal_state_root }}"
        AXIGNAL_REMOTE_BACKUP_ROOT: "{{ axignal_backup_root }}"
        AXIGNAL_REPO_URL: "{{ axignal_repo_url }}"
      register: axignal_deployment
      changed_when: "'DEPLOYED_AWAITING_ACCEPTANCE' in axignal_deployment.stdout"

    - name: Enable backup and watchdog timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - axignal-pilot-backup.timer
        - axignal-pilot-watchdog.timer

    - name: Verify public pilot health over HTTPS
      ansible.builtin.uri:
        url: "{{ axignal_site_address }}/api/health"
        method: GET
        status_code: 200
        return_content: true
        validate_certs: true
      register: axignal_public_health
      retries: 6
      delay: 5
      until:
        - axignal_public_health.json.status == 'ok'
        - axignal_public_health.json.build_sha == axignal_deploy_sha

    - name: Inspect running containers after AXIGNAL deployment
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - "--format={{ '{{.Names}}' }}"
      register: axignal_postdeployment_containers
      changed_when: false
      no_log: true

    - name: Preserve every pre-existing running container
      ansible.builtin.assert:
        that:
          - axignal_preexisting_containers.stdout_lines | difference(axignal_postdeployment_containers.stdout_lines) | length == 0
        fail_msg: At least one pre-existing container stopped during AXIGNAL deployment.
      no_log: true

    - name: Verify Traefik was not restarted
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{.State.Running}}|{{.HostConfig.NetworkMode}}|{{.State.StartedAt}}' }}"
          - "{{ axignal_traefik_container_name }}"
      register: axignal_traefik_after
      changed_when: false
      when: axignal_edge_mode == 'shared-traefik'
      no_log: true

    - name: Require uninterrupted Traefik runtime
      ansible.builtin.assert:
        that:
          - axignal_traefik_after.stdout == axignal_traefik_runtime.stdout
        fail_msg: Traefik changed runtime identity or restart time during AXIGNAL deployment.
      when: axignal_edge_mode == 'shared-traefik'

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
