[project]
name = "axignal-api"
version = "0.0.0"
description = "AXIGNAL typed product API spine"
requires-python = ">=3.13"
dependencies = [
  "defusedxml>=0.7.1,<0.8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "redis>=6.2,<7",
  "uvicorn[standard]>=0.35,<1",
  "webauthn>=3,<4"
]

[project.optional-dependencies]
dev = [
  "hatchling==1.27.0",
  "jsonschema>=4.25,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "pyyaml>=6,<7",
  "xlrd==2.0.2"
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/axignal_api"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src", "apps/api/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
